<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحان | Miss Marwa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2563eb;
            --glowing-cyan: #00E5FF;
            --bg-deep: #020617;
            --text-light: #f8fafc;
            --card-glass: rgba(15, 23, 42, 0.65);
            --border-glass: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0f24 0%, #020617 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #00E5FF;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #2563eb;
            bottom: -20%;
            right: -10%;
        }

        .top-nav {
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .brand-name span {
            color: var(--glowing-cyan);
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 80px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 720px;
        }

        .header-section h1 {
            font-size: 2rem;
            margin: 0 0 6px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, var(--glowing-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-section p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .exam-wrapper {
            width: 100%;
            max-width: 720px;
        }

        .question-card {
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            padding: 22px 24px;
            border-radius: 18px;
            margin-bottom: 16px;
        }

        .question-text {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .option-label:hover {
            border-color: var(--glowing-cyan);
            background: rgba(0, 229, 255, 0.06);
        }

        .option-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--glowing-cyan);
            flex-shrink: 0;
        }

        .option-label span {
            font-size: 1rem;
        }

        .submit-exam-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary-blue), var(--glowing-cyan));
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            transition: 0.2s ease;
        }

        .submit-exam-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.3);
        }

        .submit-exam-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-card {
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .status-card i {
            font-size: 3rem;
            color: var(--glowing-cyan);
            margin-bottom: 16px;
            display: block;
        }

        .status-card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .status-card p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.7;
        }

        .back-btn-inline {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 26px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            text-decoration: none;
            font-weight: 700;
        }

        .back-btn-inline:hover {
            border-color: var(--glowing-cyan);
            color: var(--glowing-cyan);
        }

        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 1.5rem;
            }

            .question-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav class="top-nav">
        <div class="brand-name">Miss <span>Marwa</span></div>
    </nav>

    <main class="main-content">
        <div class="header-section">
            <h1 id="pageHeading">جاري التحميل...</h1>
            <p id="pageSubheading">اختاري إجابة واحدة لكل سؤال ثم سلّمي الامتحان</p>
        </div>

        <div class="exam-wrapper" id="examContainer">
            <div class="status-card">
                <i class="fas fa-spinner fa-spin"></i>
                <h2>لحظات من فضلك</h2>
                <p>بنجهزلك الامتحان...</p>
            </div>
        </div>
    </main>

    <script>
        // تعريف المتغيرات في النطاق العام لتكون متاحة لكل الدوال
        let student = null;
        let examId = null;
        let examQuestions = [];
        let leaveWarningEnabled = false;

        // تحذير لو الطالب حاول يقفل الصفحة أو يرجع للخلف أثناء الامتحان
        window.addEventListener('beforeunload', function (e) {
            if (leaveWarningEnabled) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        function renderMessage(title, text, icon) {
            document.getElementById('pageHeading').textContent = 'الامتحان';
            document.getElementById('pageSubheading').textContent = '';
            const backUrl = student ? `./materials.html?grade=${encodeURIComponent(student.grade || '')}&cat=exams` : './index.html';
            document.getElementById('examContainer').innerHTML = `
                <div class="status-card">
                    <i class="fas ${icon}"></i>
                    <h2>${title}</h2>
                    <p>${text}</p>
                    <a href="${backUrl}" class="back-btn-inline">رجوع لقائمة الامتحانات</a>
                </div>
            `;
        }

        function renderResultScreen(score, total) {
            document.getElementById('pageHeading').textContent = 'نتيجتك';
            document.getElementById('pageSubheading').textContent = '';
            const backUrl = `./materials.html?grade=${encodeURIComponent(student.grade || '')}&cat=exams`;
            document.getElementById('examContainer').innerHTML = `
                <div class="status-card">
                    <i class="fas fa-circle-check" style="color:#4ade80;"></i>
                    <h2>تم تسليم هذا الامتحان</h2>
                    <p>درجتك: <strong style="color:#fff; font-size:1.2rem;">${score} / ${total}</strong></p>
                    <a href="${backUrl}" class="back-btn-inline">رجوع لقائمة الامتحانات</a>
                </div>
            `;
        }

        function renderExamForm(title, questions) {
            document.getElementById('pageHeading').textContent = title;
            document.getElementById('pageSubheading').textContent = 'اختاري إجابة واحدة لكل سؤال ثم سلّمي الامتحان';

            let html = '<form id="examForm">';
            questions.forEach((q, qi) => {
                html += `<div class="question-card">
                    <p class="question-text">${qi + 1}. ${q.question}</p>
                    <div class="options-group">`;
                q.options.forEach((opt, oi) => {
                    html += `<label class="option-label">
                        <input type="radio" name="q${qi}" value="${oi}" required>
                        <span>${opt}</span>
                    </label>`;
                });
                html += `</div></div>`;
            });
            html += `<button type="submit" class="submit-exam-btn" id="submitExamBtn">
                <i class="fas fa-paper-plane"></i> تسليم الامتحان
            </button></form>`;

            document.getElementById('examContainer').innerHTML = html;
            document.getElementById('examForm').addEventListener('submit', handleSubmit);
        }

        async function handleSubmit(e) {
            e.preventDefault();

            const answers = examQuestions.map((q, qi) => {
                const selected = document.querySelector(`input[name="q${qi}"]:checked`);
                return selected ? parseInt(selected.value, 10) : -1;
            });

            if (answers.includes(-1)) {
                alert('لازم تجاوبي على كل الأسئلة قبل التسليم');
                return;
            }

            const submitBtn = document.getElementById('submitExamBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التسليم...';

            try {
                const res = await fetch('/api/exams?action=submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId, studentId: student.id, answers })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'فشل تسليم الامتحان');

                leaveWarningEnabled = false;
                renderResultScreen(data.score, data.total);
            } catch (err) {
                alert('حصل خطأ أثناء التسليم: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> تسليم الامتحان';
            }
        }

        async function startExam() {
            try {
                const res = await fetch('/api/exams?action=start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId, studentId: student.id })
                });
                const data = await res.json();

                if (data.status === 'started') {
                    examQuestions = data.questions;
                    renderExamForm(data.title, data.questions);
                    leaveWarningEnabled = true;
                } else if (data.status === 'submitted') {
                    renderResultScreen(data.score, data.total);
                } else if (data.status === 'locked') {
                    renderMessage('لا يمكنك الدخول', data.error || 'أنتِ دخلتِ هذا الامتحان قبل كده.', 'fa-lock');
                } else if (data.status === 'expired') {
                    renderMessage('انتهى الوقت', data.error || 'انتهى وقت هذا الامتحان.', 'fa-clock');
                } else {
                    renderMessage('حصل خطأ', data.error || 'حصل خطأ غير متوقع، حاولي تاني.', 'fa-triangle-exclamation');
                }
            } catch (err) {
                renderMessage('حصل خطأ', 'تعذر الاتصال بالخادم، تأكدي من الإنترنت وحاولي تاني.', 'fa-triangle-exclamation');
            }
        }

        // حارس الحماية وضبط التهيئة (يعمل بمجرد تحميل الصفحة)
        window.addEventListener('DOMContentLoaded', () => {
            const sessionData = localStorage.getItem('student_session');
            
            // 1. التحقق من وجود جلسة الطالب
            if (!sessionData) {
                alert('عفواً، يبدو أنك غير مسجل الدخول أو انتهت الجلسة. سيتم تحويلك للصفحة الرئيسية.');
                window.location.replace('./index.html');
                return; // إيقاف تنفيذ باقي الكود تماماً
            }

            student = JSON.parse(sessionData);
            
            // 2. التحقق من وجود رابط الامتحان (examId)
            const params = new URLSearchParams(window.location.search);
            examId = params.get('id');

            if (!examId) {
                alert('عفواً، رابط الامتحان غير صحيح أو مفقود. سيتم إعادتك لقائمة الامتحانات.');
                window.location.replace('./materials.html?grade=' + encodeURIComponent(student.grade || '') + '&cat=exams');
                return; // إيقاف التنفيذ
            }

            // إذا كان كل شيء سليماً، نبدأ الامتحان
            startExam();
        });
    </script>

</body>

</html>
