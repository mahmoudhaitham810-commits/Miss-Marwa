<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج الامتحانات | Miss Marwa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2563eb;
            --glowing-cyan: #00E5FF;
            --bg-deep: #020617;
            --text-light: #f8fafc;
            --card-glass: rgba(15, 23, 42, 0.65);
            --border-glass: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0f24 0%, #020617 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #00E5FF;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #2563eb;
            bottom: -20%;
            right: -10%;
        }

        .top-nav {
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.3rem;
            color: #fff;
        }

        .brand-name span {
            color: var(--glowing-cyan);
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .back-link:hover {
            color: var(--glowing-cyan);
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 80px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 720px;
        }

        .header-section h1 {
            font-size: 2rem;
            margin: 0 0 6px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, var(--glowing-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-section p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .results-wrapper {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .result-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .result-title {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .result-meta {
            color: #64748b;
            font-size: 0.82rem;
        }

        .result-score {
            font-weight: 900;
            font-size: 1.3rem;
            padding: 6px 18px;
            border-radius: 50px;
            white-space: nowrap;
        }

        .score-green {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .score-red {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .score-neutral {
            color: #e2e8f0;
            background: rgba(255, 255, 255, 0.06);
        }

        .empty-placeholder {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            width: 100%;
            max-width: 500px;
        }

        .empty-placeholder i {
            font-size: 2.5rem;
            margin-bottom: 14px;
            display: block;
            color: #334155;
        }

        @media (max-width: 600px) {
            .header-section h1 {
                font-size: 1.5rem;
            }

            .result-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav class="top-nav">
        <div class="brand-name">Miss <span>Marwa</span></div>
        <a href="./index.html" class="back-link" id="dashboardLink">
            <i class="fas fa-arrow-right"></i> الرئيسية
        </a>
    </nav>

    <main class="main-content">
        <div class="header-section">
            <h1>نتائج الامتحانات</h1>
            <p>كل درجاتك في الامتحانات اللي سلمتيها</p>
        </div>

        <div class="results-wrapper" id="resultsContainer">
            <div class="empty-placeholder">
                <i class="fas fa-spinner fa-spin"></i>
                <p>جاري تحميل نتائجك...</p>
            </div>
        </div>
    </main>

    <script>
        const sessionData = localStorage.getItem('student_session');
        if (!sessionData) {
            alert('يرجى تسجيل الدخول أولاً');
            window.location.href = './index.html';
        }
        const student = JSON.parse(sessionData || '{}');

        // زرار "الرئيسية" يوديها لصفحة مرحلتها الدراسية لو متاحة
        const gradeRoutes = {
            prep1: './prep1/prep1.html',
            prep2: './prep2/prep2.html',
            prep3: './prep3/prep3.html',
            sec1: './sec1/Sec1.html'
        };
        if (student.grade && gradeRoutes[student.grade]) {
            document.getElementById('dashboardLink').href = gradeRoutes[student.grade];
        }

        function scoreClass(score, total) {
            if (score === null || score === undefined || total === 0) return 'score-neutral';
            const pct = (score / total) * 100;
            if (pct < 50) return 'score-red';
            if (score >= total - 1) return 'score-green';
            return 'score-neutral';
        }

        async function loadMyResults() {
            const container = document.getElementById('resultsContainer');
            try {
                const res = await fetch(`/api/exams?action=my-results&studentId=${encodeURIComponent(student.id || '')}&t=${Date.now()}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'فشل تحميل النتائج');

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = `
                        <div class="empty-placeholder">
                            <i class="fas fa-clipboard-list"></i>
                            <h3 style="color:#cbd5e1; margin-bottom:6px;">لا توجد نتائج بعد</h3>
                            <p>لما تسلمي أي امتحان، درجتك هتظهر هنا.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.map(r => `
                    <div class="result-card">
                        <div class="result-info">
                            <span class="result-title">${r.title}</span>
                            <span class="result-meta">${(r.grade || '').toUpperCase()}</span>
                        </div>
                        <div class="result-score ${scoreClass(r.score, r.total)}">${r.score} / ${r.total}</div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `
                    <div class="empty-placeholder">
                        <i class="fas fa-triangle-exclamation"></i>
                        <p>حصل خطأ أثناء تحميل النتائج: ${err.message}</p>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadMyResults);
    </script>

</body>

</html>
