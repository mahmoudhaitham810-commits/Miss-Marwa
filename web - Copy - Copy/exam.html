<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحان | Miss Marwa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2563eb;
            --glowing-cyan: #00E5FF;
            --bg-deep: #020617;
            --text-light: #f8fafc;
            --card-glass: rgba(15, 23, 42, 0.65);
            --border-glass: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* منع تحديد النص في كل الصفحة عشان يصعب نسخ أسئلة الامتحان */
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0f24 0%, #020617 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #00E5FF;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #2563eb;
            bottom: -20%;
            right: -10%;
        }

        .top-nav {
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.3rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .brand-name span {
            color: var(--glowing-cyan);
        }

        .timer-badge {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(0, 229, 255, 0.08);
            border: 1px solid var(--border-glass);
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.05rem;
            color: var(--glowing-cyan);
        }

        .timer-badge.warning {
            color: #f87171;
            border-color: #f87171;
            background: rgba(239, 68, 68, 0.1);
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 80px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 720px;
        }

        .header-section h1 {
            font-size: 2rem;
            margin: 0 0 6px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, var(--glowing-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-section p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .exam-wrapper {
            width: 100%;
            max-width: 720px;
        }

        .question-card {
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            padding: 22px 24px;
            border-radius: 18px;
            margin-bottom: 16px;
        }

        .question-text {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .option-label:hover {
            border-color: var(--glowing-cyan);
            background: rgba(0, 229, 255, 0.06);
        }

        .option-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--glowing-cyan);
            flex-shrink: 0;
        }

        .option-label span {
            font-size: 1rem;
        }

        .submit-exam-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary-blue), var(--glowing-cyan));
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            transition: 0.2s ease;
        }

        .submit-exam-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.3);
        }

        .submit-exam-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-card {
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .status-card i {
            font-size: 3rem;
            color: var(--glowing-cyan);
            margin-bottom: 16px;
            display: block;
        }

        .status-card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .status-card p {
            color: #94a3b8;
            font-size: 1rem;
            line-height: 1.7;
        }

        .back-btn-inline {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 26px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            text-decoration: none;
            font-weight: 700;
        }

        .back-btn-inline:hover {
            border-color: var(--glowing-cyan);
            color: var(--glowing-cyan);
        }

        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 1.5rem;
            }

            .question-card {
                padding: 18px;
            }

            .timer-badge {
                font-size: 0.9rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav class="top-nav">
        <div class="brand-name">Miss <span>Marwa</span></div>
        <div class="timer-badge" id="timerBadge">
            <i class="fas fa-stopwatch"></i>
            <span id="timerText">00:00</span>
        </div>
    </nav>

    <main class="main-content">
        <div class="header-section">
            <h1 id="pageHeading">جاري التحميل...</h1>
            <p id="pageSubheading">اختاري إجابة واحدة لكل سؤال ثم سلّمي الامتحان</p>
        </div>

        <div class="exam-wrapper" id="examContainer">
            <div class="status-card">
                <i class="fas fa-spinner fa-spin"></i>
                <h2>لحظات من فضلك</h2>
                <p>بنجهزلك الامتحان...</p>
            </div>
        </div>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const examId = params.get('id');

        // نفس حارس تسجيل الدخول المستخدم في باقي الموقع
        const sessionData = localStorage.getItem('student_session');
        if (!sessionData) {
            alert('يرجى تسجيل الدخول أولاً');
            window.location.href = './index.html';
        }
        const student = JSON.parse(sessionData || '{}');

        if (!examId) {
            window.location.href = './index.html';
        }

        let examQuestions = [];
        let leaveWarningEnabled = false;
        let timerInterval = null;
        let tabSwitchCount = 0;

        // ==================== منع النسخ والغش ====================

        // منع الزرار اليمين (القائمة اللي فيها "نسخ" و"فحص العنصر")
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // منع نسخ أي نص من الصفحة
        document.addEventListener('copy', (e) => e.preventDefault());
        document.addEventListener('cut', (e) => e.preventDefault());

        // منع أشهر اختصارات لوحة المفاتيح للنسخ/الطباعة/أدوات المطور
        document.addEventListener('keydown', (e) => {
            const key = (e.key || '').toLowerCase();
            const ctrlOrCmd = e.ctrlKey || e.metaKey;

            // F12 وأدوات المطور
            if (key === 'f12') { e.preventDefault(); return; }
            if (ctrlOrCmd && e.shiftKey && ['i', 'j', 'c'].includes(key)) { e.preventDefault(); return; }

            // نسخ / قص / لصق / طباعة / حفظ / عرض المصدر
            if (ctrlOrCmd && ['c', 'x', 'v', 'p', 's', 'u'].includes(key)) { e.preventDefault(); return; }

            // زرار PrintScreen (المتصفح ملوش سيطرة كاملة عليه، لكن بنحاول نحذف اللي انسخ فوراً)
            if (key === 'printscreen') {
                navigator.clipboard?.writeText('').catch(() => { });
            }
        });

        // تحذير لو الطالب حاول يقفل الصفحة أو يرجع للخلف أثناء الامتحان
        window.addEventListener('beforeunload', function (e) {
            if (leaveWarningEnabled) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // اكتشاف تبديل التابات أثناء الامتحان: تحذير أول مرة، وتسليم تلقائي لو اتكررت
        document.addEventListener('visibilitychange', () => {
            if (!leaveWarningEnabled || !document.hidden) return;

            tabSwitchCount++;
            if (tabSwitchCount === 1) {
                alert('تنبيه: الخروج من صفحة الامتحان غير مسموح به. لو تكرر الأمر، هيتم تسليم الامتحان تلقائياً بإجاباتك الحالية.');
            } else if (tabSwitchCount >= 2) {
                submitAnswers(true, 'تم رصد خروجك من صفحة الامتحان أكتر من مرة، فتم تسليمه تلقائياً بإجاباتك الحالية.');
            }
        });

        // ==================== العداد التنازلي ====================

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const s = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function startTimer(minutes) {
            let remainingSeconds = minutes * 60;
            const badge = document.getElementById('timerBadge');
            const text = document.getElementById('timerText');
            badge.style.display = 'flex';
            text.textContent = formatTime(remainingSeconds);

            timerInterval = setInterval(() => {
                remainingSeconds--;
                text.textContent = formatTime(remainingSeconds);

                if (remainingSeconds <= 60) {
                    badge.classList.add('warning');
                }

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    submitAnswers(true, 'خلص وقت الامتحان، فتم تسليمه تلقائياً بإجاباتك الحالية.');
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('timerBadge').style.display = 'none';
        }

        // ==================== عرض الحالات المختلفة ====================

        function renderMessage(title, text, icon) {
            stopTimer();
            document.getElementById('pageHeading').textContent = 'الامتحان';
            document.getElementById('pageSubheading').textContent = '';
            const backUrl = `./materials.html?grade=${encodeURIComponent(student.grade || '')}&cat=exams`;
            document.getElementById('examContainer').innerHTML = `
                <div class="status-card">
                    <i class="fas ${icon}"></i>
                    <h2>${title}</h2>
                    <p>${text}</p>
                    <a href="${backUrl}" class="back-btn-inline">رجوع لقائمة الامتحانات</a>
                </div>
            `;
        }

        function renderResultScreen(score, total, note) {
            stopTimer();
            document.getElementById('pageHeading').textContent = 'نتيجتك';
            document.getElementById('pageSubheading').textContent = '';
            const backUrl = `./materials.html?grade=${encodeURIComponent(student.grade || '')}&cat=exams`;
            document.getElementById('examContainer').innerHTML = `
                <div class="status-card">
                    <i class="fas fa-circle-check" style="color:#4ade80;"></i>
                    <h2>تم تسليم هذا الامتحان</h2>
                    <p>درجتك: <strong style="color:#fff; font-size:1.2rem;">${score} / ${total}</strong></p>
                    ${note ? `<p style="margin-top:10px; color:#f87171;">${note}</p>` : ''}
                    <a href="${backUrl}" class="back-btn-inline">رجوع لقائمة الامتحانات</a>
                </div>
            `;
        }

        function renderExamForm(title, questions) {
            document.getElementById('pageHeading').textContent = title;
            document.getElementById('pageSubheading').textContent = 'اختاري إجابة واحدة لكل سؤال ثم سلّمي الامتحان';

            let html = '<form id="examForm">';
            questions.forEach((q, qi) => {
                html += `<div class="question-card">
                    <p class="question-text">${qi + 1}. ${q.question}</p>
                    <div class="options-group">`;
                q.options.forEach((opt, oi) => {
                    html += `<label class="option-label">
                        <input type="radio" name="q${qi}" value="${oi}" required>
                        <span>${opt}</span>
                    </label>`;
                });
                html += `</div></div>`;
            });
            html += `<button type="submit" class="submit-exam-btn" id="submitExamBtn">
                <i class="fas fa-paper-plane"></i> تسليم الامتحان
            </button></form>`;

            document.getElementById('examContainer').innerHTML = html;
            document.getElementById('examForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const answers = examQuestions.map((q, qi) => {
                    const selected = document.querySelector(`input[name="q${qi}"]:checked`);
                    return selected ? parseInt(selected.value, 10) : -1;
                });

                if (answers.includes(-1)) {
                    alert('لازم تجاوبي على كل الأسئلة قبل التسليم');
                    return;
                }

                submitAnswers(false);
            });
        }

        // ==================== التسليم (يدوي أو تلقائي) ====================

        // isAutoSubmit=true بتتسلم أي إجابات موجودة من غير ما تشترط إن كل الأسئلة اتجاوبت
        // (بتستخدم لما الوقت يخلص أو لما نظام منع الغش يقفل الامتحان تلقائياً)
        async function submitAnswers(isAutoSubmit, autoNote) {
            const submitBtn = document.getElementById('submitExamBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التسليم...';
            }

            const answers = examQuestions.map((q, qi) => {
                const selected = document.querySelector(`input[name="q${qi}"]:checked`);
                return selected ? parseInt(selected.value, 10) : -1;
            });

            try {
                const res = await fetch('/api/exams?action=submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId, studentId: student.id, answers })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'فشل تسليم الامتحان');

                leaveWarningEnabled = false;
                renderResultScreen(data.score, data.total, isAutoSubmit ? autoNote : null);
            } catch (err) {
                if (isAutoSubmit) {
                    // لو التسليم التلقائي فشل (مثلاً مشكلة نت)، نوقف كل حاجة ونوضح المشكلة
                    leaveWarningEnabled = false;
                    renderMessage('حصل خطأ أثناء التسليم التلقائي', 'حاولي تفتحي الامتحان تاني أو كلمي المدرّسة.', 'fa-triangle-exclamation');
                    return;
                }
                alert('حصل خطأ أثناء التسليم: ' + err.message);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> تسليم الامتحان';
                }
            }
        }

        // ==================== بدء الامتحان ====================

        async function startExam() {
            try {
                const res = await fetch('/api/exams?action=start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId, studentId: student.id })
                });
                const data = await res.json();

                if (data.status === 'started') {
                    examQuestions = data.questions;
                    renderExamForm(data.title, data.questions);
                    leaveWarningEnabled = true;
                    if (data.timeLimitMinutes) {
                        startTimer(data.timeLimitMinutes);
                    }
                } else if (data.status === 'submitted') {
                    renderResultScreen(data.score, data.total);
                } else if (data.status === 'locked') {
                    renderMessage('لا يمكنك الدخول', data.error || 'أنتِ دخلتِ هذا الامتحان قبل كده.', 'fa-lock');
                } else if (data.status === 'expired') {
                    renderMessage('انتهى الوقت', data.error || 'انتهى وقت هذا الامتحان.', 'fa-clock');
                } else {
                    renderMessage('حصل خطأ', data.error || 'حصل خطأ غير متوقع، حاولي تاني.', 'fa-triangle-exclamation');
                }
            } catch (err) {
                renderMessage('حصل خطأ', 'تعذر الاتصال بالخادم، تأكدي من الإنترنت وحاولي تاني.', 'fa-triangle-exclamation');
            }
        }

        window.addEventListener('DOMContentLoaded', startExam);
    </script>

</body>

</html>
