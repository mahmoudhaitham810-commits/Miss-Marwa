<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Academy | Miss Marwa</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QSM0JZ79ZR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-QSM0JZ79ZR');

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2563eb;
            --glowing-cyan: #00E5FF;
            --bg-deep: #020617;
            --text-light: #f8fafc;
            --card-glass: rgba(15, 23, 42, 0.65);
            --border-glass: rgba(0, 229, 255, 0.2);
            --error-red: #ef4444;
            --admin-gold: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- Background Animation --- */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0f24 0%, #020617 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.45;
            animation: floatOrbs 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 450px;
            height: 450px;
            background: #00E5FF;
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #2563eb;
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 350px;
            height: 350px;
            background: #8b5cf6;
            top: 40%;
            left: 50%;
            animation-delay: -10s;
            opacity: 0.25;
        }

        @keyframes floatOrbs {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(80px, 40px) scale(1.15); }
            100% { transform: translate(-40px, 80px) scale(0.95); }
        }

        /* --- Preloader --- */
        .preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            display: flex;
            pointer-events: none;
        }

        .preloader .half {
            width: 100%;
            height: 50vh;
            background: #000;
            position: absolute;
            left: 0;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preloader .top-half { top: 0; align-items: flex-end; transform-origin: top; }
        .preloader .bottom-half { bottom: 0; align-items: flex-start; transform-origin: bottom; }

        .loader-icon {
            font-size: 5rem;
            color: var(--glowing-cyan);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: atomSpin 3s linear infinite, glowPulse 1s infinite alternate;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }

        body.loaded .preloader .top-half { transform: translateY(-100%); }
        body.loaded .preloader .bottom-half { transform: translateY(100%); }
        body.loaded .loader-icon { opacity: 0; }

        /* --- Header Navigation --- */
        .dashboard {
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 200;
        }

        .social-icons {
            display: flex;
            gap: 18px;
            direction: ltr;
        }

        .social-icons a {
            color: #fff;
            font-size: 1.4rem;
            text-decoration: none;
            transition: 0.3s;
        }

        .social-icons a:hover {
            transform: translateY(-3px) scale(1.15);
            color: var(--glowing-cyan);
            filter: drop-shadow(0 0 10px var(--glowing-cyan));
        }

        .auth-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .auth-btn {
            border: 1px solid var(--border-glass);
            padding: 8px 20px;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .auth-btn.primary {
            background: linear-gradient(135deg, var(--glowing-cyan), var(--primary-blue));
            color: #020617;
            border: none;
        }

        .auth-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.35);
        }

        /* --- Account Menu & Popup --- */
        .account-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 7px 16px;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .account-btn:hover,
        .account-btn.active {
            border-color: var(--glowing-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .account-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--glowing-cyan), var(--primary-blue));
            color: #020617;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 900;
        }

        .account-avatar.admin-avatar {
            background: linear-gradient(135deg, var(--admin-gold), #f59e0b);
            color: #020617;
        }

        .account-popup {
            position: absolute;
            top: 55px;
            left: 0;
            width: 320px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 229, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 300;
            display: none;
            flex-direction: column;
            gap: 14px;
            animation: popupFade 0.25s ease;
            text-align: right;
        }

        .account-popup.show { display: flex; }

        .popup-user-info h3 { font-size: 1.15rem; font-weight: 800; color: #fff; }
        .popup-user-info p { font-size: 0.85rem; color: #94a3b8; margin-top: 2px; }

        .popup-id-card {
            background: rgba(0, 229, 255, 0.08);
            border: 1px dashed var(--glowing-cyan);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .popup-id-card span { font-size: 0.78rem; color: #94a3b8; display: block; }
        .popup-id-card strong { font-size: 1.15rem; color: var(--glowing-cyan); letter-spacing: 0.5px; }

        .popup-copy-btn {
            background: rgba(0, 229, 255, 0.15);
            border: none;
            color: var(--glowing-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .popup-copy-btn:hover { background: var(--glowing-cyan); color: #020617; }

        .admin-grades-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }

        .admin-grade-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 8px 10px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .admin-grade-btn:hover {
            background: var(--primary-blue);
            border-color: var(--glowing-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .popup-action-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            transition: 0.3s;
        }

        .popup-action-btn.classroom {
            background: linear-gradient(135deg, var(--glowing-cyan), var(--primary-blue));
            color: #020617;
        }

        .popup-action-btn.classroom:hover {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            transform: translateY(-1px);
        }

        .popup-action-btn.logout {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .popup-action-btn.logout:hover {
            background: #ef4444;
            color: #fff;
        }

        /* --- Homepage Hero Content --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            text-align: center;
        }

        .hero-logo i {
            font-size: 4.5rem;
            background: linear-gradient(135deg, #fff, var(--glowing-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: atomSpin 25s linear infinite;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, var(--glowing-cyan), #2563eb);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 5s linear infinite;
        }

        .hero p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 620px;
            margin: 0 auto 35px;
            line-height: 1.6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            direction: ltr;
        }

        /* --- Auth Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.35s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .auth-box {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 229, 255, 0.1);
            position: relative;
            transform: scale(0.92) translateY(20px);
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            direction: rtl;
        }

        .modal-overlay.active .auth-box {
            transform: scale(1) translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover {
            color: var(--error-red);
            transform: rotate(90deg);
        }

        .auth-tabs {
            display: flex;
            border-radius: 14px;
            background: rgba(2, 6, 23, 0.6);
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary-blue);
            color: #fff;
            box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4);
        }

        .form-panel { display: none; }
        .form-panel.active { display: block; animation: fadeIn 0.3s ease; }

        .form-row { display: flex; gap: 12px; }

        .form-group {
            margin-bottom: 16px;
            flex: 1;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            right: 14px;
            color: #64748b;
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 11px 42px 11px 14px;
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Cairo', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input.input-error {
            border-color: var(--error-red) !important;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3) !important;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: var(--glowing-cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
            background: rgba(2, 6, 23, 0.9);
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--glowing-cyan), var(--primary-blue));
            border: none;
            border-radius: 12px;
            color: #020617;
            font-size: 1.05rem;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .submit-btn:hover {
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
            transform: translateY(-2px);
        }

        .status-msg {
            font-size: 0.92rem;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: shake 0.35s ease;
        }

        .status-msg.error {
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            direction: ltr;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer a {
            color: #94a3b8;
            text-decoration: none;
            margin: 0 10px;
            transition: 0.3s;
        }

        .footer a:hover { color: var(--glowing-cyan); }

        @keyframes atomSpin { 100% { transform: rotate(360deg); } }
        @keyframes glowPulse { 0% { filter: drop-shadow(0 0 10px var(--glowing-cyan)); } 100% { filter: drop-shadow(0 0 30px var(--glowing-cyan)); transform: translate(-50%, -50%) scale(1.1); } }
        @keyframes shineText { to { background-position: 200% center; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popupFade { from { opacity: 0; transform: translateY(-8px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.3rem; }
            .form-row { flex-direction: column; gap: 0; }
            .account-popup { left: auto; right: 0; width: 280px; }
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="preloader" id="preloader">
        <div class="half top-half"></div>
        <i class="fas fa-atom loader-icon"></i>
        <div class="half bottom-half"></div>
    </div>

    <!-- Header Navigation -->
    <header class="dashboard">
        <div class="social-icons">
            <a href="https://www.facebook.com/profile.php?id=61588022231167" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://wa.me/201144488717" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>

        <!-- Logged Out Actions -->
        <div class="auth-actions" id="guestAuthActions">
            <button class="auth-btn secondary" onclick="openModal('login')">
                <i class="fas fa-sign-in-alt"></i>
                <span>تسجيل الدخول</span>
            </button>
            <button class="auth-btn primary" onclick="openModal('signup')">
                <i class="fas fa-user-plus"></i>
                <span>حساب جديد</span>
            </button>
        </div>

        <!-- Logged In Actions -->
        <div class="auth-actions" id="studentAuthActions" style="display: none;">
            <button class="account-btn" id="accountMenuBtn" onclick="toggleAccountPopup(event)">
                <div class="account-avatar" id="headerAvatarLetter">M</div>
                <span id="headerStudentName">الطالب</span>
                <i class="fas fa-chevron-down" style="font-size: 0.8rem; color: #94a3b8;"></i>
            </button>

            <!-- Floating Account Popup -->
            <div class="account-popup" id="accountPopup">
                <div class="popup-user-info">
                    <h3 id="popupFullName">اسم الطالب</h3>
                    <p id="popupGradeName">المرحلة الدراسية</p>
                </div>

                <div class="popup-id-card">
                    <div>
                        <span>Student ID</span>
                        <strong id="popupStudentId">MM-000000</strong>
                    </div>
                    <button class="popup-copy-btn" onclick="copyStudentIdFromPopup()">
                        <i class="far fa-copy"></i>
                        <span>نسخ</span>
                    </button>
                </div>

                <!-- Regular Student Direct Link -->
                <button class="popup-action-btn classroom" id="studentClassroomBtn" onclick="enterClassroom()">
                    <i class="fas fa-graduation-cap"></i>
                    <span>الانتقال لصفك الدراسي</span>
                </button>

                <!-- Admin All-Grades Switcher -->
                <div id="adminGradesContainer" style="display: none;">
                    <span style="font-size: 0.8rem; color: var(--admin-gold); display: block; margin-bottom: 6px; font-weight: 700;">
                        <i class="fas fa-unlock-keyhole"></i> التنقل المباشر لجميع المراحل:
                    </span>
                    <div class="admin-grades-grid">
                        <a href="./prep1/prep1.html" class="admin-grade-btn">Prep 1</a>
                        <a href="./prep2/prep2.html" class="admin-grade-btn">Prep 2</a>
                        <a href="./prep3/prep3.html" class="admin-grade-btn">Prep 3</a>
                        <a href="./sec1/Sec1.html" class="admin-grade-btn">Sec 1</a>
                    </div>
                </div>

                <button class="popup-action-btn logout" onclick="logoutStudent()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="hero-logo"><i class="fas fa-atom"></i></div>
        
        <div class="hero">
            <h1>Science With Miss Marwa</h1>
            <p>Premium Education & Interactive Science Learning. Step into the future of science.</p>
            <button class="auth-btn primary" id="heroCtaBtn" style="padding: 14px 36px; font-size: 1.1rem;" onclick="handleHeroCta()">
                <span id="heroCtaText">ابدأ التعلم الآن</span>
                <i class="fas fa-arrow-left"></i>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <span>© 2026 Science With Miss Marwa. All rights reserved.</span>
        <span>•</span>
        <a href="admin.html"><i class="fas fa-lock"></i> بوابة المعلم / الإدارة</a>
    </footer>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="auth-box">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            
            <div class="auth-tabs" id="modalTabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">إنشاء حساب</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="form-panel active">
                <div class="form-group">
                    <label for="loginId">كود الطالب (Student ID)</label>
                    <div class="input-wrapper">
                        <input type="text" id="loginId" placeholder="مثال: MM-294810" required autocomplete="username">
                        <i class="fas fa-id-badge"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="loginSubmitBtn">
                    <span>دخول المنصة</span>
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="status-msg error" id="loginStatus"></div>
            </form>

            <!-- Sign Up Form -->
            <form id="signupForm" class="form-panel">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">الاسم الأول</label>
                        <div class="input-wrapper">
                            <input type="text" id="firstName" placeholder="الاسم الأول" required>
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="lastName">اسم العائلة</label>
                        <div class="input-wrapper">
                            <input type="text" id="lastName" placeholder="اسم العائلة" required>
                            <i class="fas fa-user-group"></i>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone">رقم هاتف الطالب</label>
                    <div class="input-wrapper">
                        <input type="tel" id="phone" placeholder="01xxxxxxxxx" required>
                        <i class="fas fa-mobile-screen"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="parentPhone">رقم هاتف ولي الأمر</label>
                    <div class="input-wrapper">
                        <input type="tel" id="parentPhone" placeholder="01xxxxxxxxx" required>
                        <i class="fas fa-phone-volume"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupGrade">المرحلة الدراسية</label>
                    <div class="input-wrapper">
                        <select id="signupGrade" required>
                            <option value="" disabled selected>اختر المرحلة الدراسية</option>
                            <option value="prep1">Prep 1 (الصف الأول الإعدادي)</option>
                            <option value="prep2">Prep 2 (الصف الثاني الإعدادي)</option>
                            <option value="prep3">Prep 3 (الصف الثالث الإعدادي)</option>
                            <option value="sec1">Secondary 1 (الصف الأول الثانوي)</option>
                        </select>
                        <i class="fas fa-graduation-cap"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupPassword" placeholder="••••••••" required minlength="4">
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="signupSubmitBtn">
                    <span>إنشاء الحساب وتوليد الكود</span>
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="status-msg error" id="signupStatus"></div>
            </form>
        </div>
    </div>

    <!-- Universal Database Adapter -->
    <script src="./db.js"></script>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => document.body.classList.add('loaded'), 800);
            renderAuthState();
        });

        const gradeLabels = {
            'prep1': 'الصف الأول الإعدادي (Prep 1)',
            'prep2': 'الصف الثاني الإعدادي (Prep 2)',
            'prep3': 'الصف الثالث الإعدادي (Prep 3)',
            'sec1': 'الصف الأول الثانوي (Secondary 1)',
            'all': 'المعلم / صلاحية شاملة لجميع المراحل (Admin)'
        };

        const gradeRoutes = {
            'prep1': './prep1/prep1.html',
            'prep2': './prep2/prep2.html',
            'prep3': './prep3/prep3.html',
            'sec1': './sec1/Sec1.html'
        };

        const modal = document.getElementById('authModal');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');
        const modalTabs = document.getElementById('modalTabs');
        const accountPopup = document.getElementById('accountPopup');

        // Fallback Engine if db.js is not loaded
        const fallbackAuth = {
            getStudents: () => {
                let s = JSON.parse(localStorage.getItem('mm_students_db') || '[]');
                if (!s.some(x => (x.studentId || '').toUpperCase() === 'MM-ADMIN')) {
                    s.unshift({
                        studentId: 'MM-ADMIN',
                        firstName: 'Miss Marwa',
                        lastName: '(Admin)',
                        grade: 'all',
                        role: 'admin',
                        password: 'marwa2026'
                    });
                    localStorage.setItem('mm_students_db', JSON.stringify(s));
                }
                return s;
            },
            async login(id, pass) {
                const cleanId = (id || '').trim().toUpperCase();
                const cleanPass = (pass || '').trim();
                const acc = this.getStudents().find(x => (x.studentId || '').trim().toUpperCase() === cleanId);
                if (!acc || acc.password !== cleanPass) throw new Error('Wrong ID/Password');
                return {
                    success: true,
                    student: {
                        id: acc.studentId,
                        firstName: acc.firstName,
                        lastName: acc.lastName,
                        grade: acc.grade,
                        role: acc.role || (acc.grade === 'all' ? 'admin' : 'student')
                    }
                };
            },
            async signup(p) {
                const s = this.getStudents();
                const studentId = `MM-${Math.floor(100000 + Math.random() * 900000)}`;
                const newS = {
                    studentId,
                    firstName: p.firstName.trim(),
                    lastName: p.lastName.trim(),
                    phone: p.phone.trim(),
                    parentPhone: p.parentPhone.trim(),
                    grade: p.grade,
                    password: p.password.trim(),
                    role: 'student',
                    createdAt: new Date().toLocaleDateString('ar-EG')
                };
                s.push(newS);
                localStorage.setItem('mm_students_db', JSON.stringify(s));
                return {
                    success: true,
                    studentId,
                    student: {
                        id: studentId,
                        firstName: newS.firstName,
                        lastName: newS.lastName,
                        grade: newS.grade,
                        role: 'student'
                    }
                };
            }
        };

        const AuthProvider = (typeof DB !== 'undefined' && DB.login) ? DB : fallbackAuth;

        function renderAuthState() {
            const currentSession = localStorage.getItem('student_session');
            const guestAuthActions = document.getElementById('guestAuthActions');
            const studentAuthActions = document.getElementById('studentAuthActions');
            const heroCtaText = document.getElementById('heroCtaText');
            const adminGradesContainer = document.getElementById('adminGradesContainer');
            const studentClassroomBtn = document.getElementById('studentClassroomBtn');
            const headerAvatarLetter = document.getElementById('headerAvatarLetter');

            if (currentSession) {
                const session = JSON.parse(currentSession);
                guestAuthActions.style.display = 'none';
                studentAuthActions.style.display = 'flex';
                
                document.getElementById('headerStudentName').textContent = session.firstName;
                document.getElementById('popupFullName').textContent = `${session.firstName} ${session.lastName}`;
                document.getElementById('popupGradeName').textContent = gradeLabels[session.grade] || session.grade;
                document.getElementById('popupStudentId').textContent = session.id;

                if (session.role === 'admin' || session.grade === 'all') {
                    headerAvatarLetter.textContent = '★';
                    headerAvatarLetter.classList.add('admin-avatar');
                    adminGradesContainer.style.display = 'block';
                    studentClassroomBtn.style.display = 'none';
                    heroCtaText.textContent = 'فتح قائمة المناهج (Admin)';
                } else {
                    headerAvatarLetter.textContent = session.firstName.charAt(0).toUpperCase();
                    headerAvatarLetter.classList.remove('admin-avatar');
                    adminGradesContainer.style.display = 'none';
                    studentClassroomBtn.style.display = 'flex';
                    heroCtaText.textContent = 'الانتقال إلى صفي الدراسي';
                }
            } else {
                guestAuthActions.style.display = 'flex';
                studentAuthActions.style.display = 'none';
                heroCtaText.textContent = 'ابدأ التعلم الآن';
                accountPopup.classList.remove('show');
            }
        }

        function toggleAccountPopup(e) {
            e.stopPropagation();
            accountPopup.classList.toggle('show');
            document.getElementById('accountMenuBtn').classList.toggle('active');
        }

        document.addEventListener('click', (e) => {
            if (!accountPopup.contains(e.target) && e.target !== document.getElementById('accountMenuBtn')) {
                accountPopup.classList.remove('show');
                const btn = document.getElementById('accountMenuBtn');
                if (btn) btn.classList.remove('active');
            }
        });

        function handleHeroCta() {
            const session = localStorage.getItem('student_session');
            if (session) {
                const data = JSON.parse(session);
                if (data.role === 'admin' || data.grade === 'all') {
                    toggleAccountPopup(new Event('click'));
                } else {
                    enterClassroom();
                }
            } else {
                openModal('login');
            }
        }

        function logoutStudent() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('student_session');
                accountPopup.classList.remove('show');
                renderAuthState();
            }
        }

        function clearErrors() {
            const loginStatus = document.getElementById('loginStatus');
            const signupStatus = document.getElementById('signupStatus');
            loginStatus.style.display = 'none';
            signupStatus.style.display = 'none';
            document.getElementById('loginId').classList.remove('input-error');
            document.getElementById('loginPassword').classList.remove('input-error');
        }

        function openModal(mode = 'login') {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            modalTabs.style.display = 'flex';
            clearErrors();
            switchTab(mode);
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
            clearErrors();
        }

        function switchTab(mode) {
            clearErrors();
            if (mode === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabSignup').classList.remove('active');
                loginForm.classList.add('active');
                signupForm.classList.remove('active');
            } else {
                document.getElementById('tabSignup').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                signupForm.classList.add('active');
                loginForm.classList.remove('active');
            }
        }

        document.getElementById('closeModalBtn').onclick = closeModal;
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('loginStatus');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const loginIdInput = document.getElementById('loginId');
            const loginPassInput = document.getElementById('loginPassword');

            const studentId = loginIdInput.value.trim();
            const password = loginPassInput.value;

            clearErrors();
            submitBtn.disabled = true;

            try {
                const data = await AuthProvider.login(studentId, password);

                localStorage.setItem('student_session', JSON.stringify(data.student));
                closeModal();
                renderAuthState();

                if (data.student.role === 'admin' || data.student.grade === 'all') {
                    toggleAccountPopup(new Event('click'));
                } else {
                    const route = gradeRoutes[data.student.grade];
                    if (route) window.location.href = route;
                }

            } catch (err) {
                status.innerHTML = `<i class="fas fa-circle-exclamation"></i> <span>${err.message || 'Wrong ID/Password'}</span>`;
                status.style.display = 'flex';
                loginIdInput.classList.add('input-error');
                loginPassInput.classList.add('input-error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // Signup Handler
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('signupStatus');
            const submitBtn = document.getElementById('signupSubmitBtn');

            const phone = document.getElementById('phone').value.trim();
            const parentPhone = document.getElementById('parentPhone').value.trim();

            const phoneRegex = /^01[0125][0-9]{8}$/;
            if (!phoneRegex.test(phone) || !phoneRegex.test(parentPhone)) {
                status.innerHTML = '<i class="fas fa-circle-exclamation"></i> <span>يرجى إدخال أرقام هواتف مصرية صحيحة (11 رقم تبدأ بـ 01)</span>';
                status.style.display = 'flex';
                return;
            }

            const payload = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                phone: phone,
                parentPhone: parentPhone,
                grade: document.getElementById('signupGrade').value,
                password: document.getElementById('signupPassword').value
            };

            submitBtn.disabled = true;
            status.style.display = 'none';

            try {
                const data = await AuthProvider.signup(payload);
                localStorage.setItem('student_session', JSON.stringify(data.student));
                alert(`تم إنشاء الحساب بنجاح!\nكود الدخول الخاص بك هو: ${data.studentId}\nاحتفظ به لتسجيل الدخول.`);
                closeModal();
                renderAuthState();

                const route = gradeRoutes[data.student.grade];
                if (route) window.location.href = route;
            } catch (err) {
                status.innerHTML = `<i class="fas fa-circle-exclamation"></i> <span>${err.message}</span>`;
                status.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
            }
        });

        function copyStudentIdFromPopup() {
            const id = document.getElementById('popupStudentId').textContent;
            navigator.clipboard.writeText(id);
            alert('تم نسخ الكود: ' + id);
        }

        function enterClassroom() {
            const session = JSON.parse(localStorage.getItem('student_session'));
            if (session && gradeRoutes[session.grade]) {
                window.location.href = gradeRoutes[session.grade];
            }
        }
    </script>
</body>

</html>
