<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Academy | Prep 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2563eb;
            --glowing-cyan: #00E5FF;
            --bg-deep: #020617;
            --text-light: #f8fafc;
            --card-glass: rgba(15, 23, 42, 0.65);
            --border-glass: rgba(0, 229, 255, 0.2);
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0f24 0%, #020617 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatOrbs 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #00E5FF;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #2563eb;
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes floatOrbs {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(100px, 50px) scale(1.2);
            }

            100% {
                transform: translate(-50px, 100px) scale(0.9);
            }
        }

        .top-nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 200;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
            direction: ltr;
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--glowing-cyan);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s ease;
            padding: 6px 14px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            direction: ltr;
        }

        .back-link:hover {
            color: var(--glowing-cyan);
            border-color: var(--glowing-cyan);
            transform: translateX(-3px);
        }

        .account-wrapper {
            position: relative;
        }

        .account-btn {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--border-glass);
            color: #fff;
            padding: 6px 14px;
            border-radius: 50px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .account-btn:hover {
            border-color: var(--glowing-cyan);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .account-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--glowing-cyan), var(--primary-blue));
            color: #020617;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 900;
        }

        .account-popup {
            position: absolute;
            top: 50px;
            left: 0;
            width: 290px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 229, 255, 0.15);
            backdrop-filter: blur(20px);
            z-index: 300;
            display: none;
            flex-direction: column;
            gap: 12px;
            text-align: right;
        }

        .account-popup.show {
            display: flex;
        }

        .popup-id-card {
            background: rgba(0, 229, 255, 0.08);
            border: 1px dashed var(--glowing-cyan);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .popup-id-card span {
            font-size: 0.75rem;
            color: #94a3b8;
            display: block;
        }

        .popup-id-card strong {
            font-size: 1.05rem;
            color: var(--glowing-cyan);
        }

        .popup-copy-btn {
            background: rgba(0, 229, 255, 0.15);
            border: none;
            color: var(--glowing-cyan);
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .popup-copy-btn:hover {
            background: var(--glowing-cyan);
            color: #020617;
        }

        .popup-logout-btn {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            transition: 0.3s;
        }

        .popup-logout-btn:hover {
            background: #ef4444;
            color: #fff;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px 80px;
            text-align: center;
        }

        .header-section h1 {
            font-size: 5rem;
            margin: 0 0 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ffffff, var(--glowing-cyan), #2563eb);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shineText 5s linear infinite;
        }

        .header-section p {
            color: #94a3b8;
            font-size: 1.2rem;
            margin-bottom: 50px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            direction: ltr;
        }

        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            direction: ltr;
            width: 100%;
            max-width: 900px;
        }

        .tab-button {
            position: relative;
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            padding: 22px 45px;
            border-radius: 20px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .tab-button i {
            font-size: 1.6rem;
            color: #64748b;
            transition: 0.3s;
        }

        .tab-button:hover {
            transform: translateY(-10px) scale(1.04);
            background: rgba(15, 23, 42, 0.9);
            border-color: var(--glowing-cyan);
            box-shadow: 0 15px 35px rgba(0, 229, 255, 0.25);
            color: #fff;
        }

        .tab-button:hover i {
            color: var(--glowing-cyan);
            transform: scale(1.2);
            filter: drop-shadow(0 0 10px var(--glowing-cyan));
        }

        .item-count-badge {
            background: rgba(0, 229, 255, 0.15);
            color: var(--glowing-cyan);
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            margin-left: 5px;
        }

        @keyframes shineText {
            to {
                background-position: 200% center;
            }
        }

        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 3.5rem;
            }

            .tabs-container {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .tab-button {
                width: 100%;
                max-width: 320px;
                justify-content: center;
                padding: 18px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav class="top-nav">
        <div class="nav-left">
            <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Home</a>
            <div class="brand-name">Miss <span>Marwa</span></div>
        </div>

        <div class="account-wrapper">
            <button class="account-btn" id="accountMenuBtn" onclick="toggleAccountPopup(event)">
                <div class="account-avatar" id="avatarLetter">M</div>
                <span id="navStudentName">طالب</span>
                <i class="fas fa-chevron-down" style="font-size: 0.75rem; color: #94a3b8;"></i>
            </button>

            <div class="account-popup" id="accountPopup">
                <div>
                    <h4 id="popupFullName" style="font-size: 1.05rem; color: #fff;">اسم الطالب</h4>
                    <p style="font-size: 0.8rem; color: #94a3b8;">Prep 1 (الصف الأول الإعدادي)</p>
                </div>

                <div class="popup-id-card">
                    <div>
                        <span>Student ID</span>
                        <strong id="popupStudentId">MM-000000</strong>
                    </div>
                    <button class="popup-copy-btn" onclick="copyStudentId()">نسخ</button>
                </div>

                <button class="popup-logout-btn" onclick="logoutStudent()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>تسجيل الخروج</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="header-section">
            <h1>Prep 1</h1>
            <p>Select a category to view lessons, notes, and exams</p>
        </div>

        <div class="tabs-container">
            <a href="../materials.html?grade=prep1&cat=videos" class="tab-button">
                <i class="fas fa-play-circle"></i>
                <span>VIDEOS</span>
                <span class="item-count-badge" id="videoCount">0</span>
            </a>

            <a href="../materials.html?grade=prep1&cat=summaries" class="tab-button">
                <i class="fas fa-book-open"></i>
                <span>SUMMARIES</span>
                <span class="item-count-badge" id="summaryCount">0</span>
            </a>

            <a href="../materials.html?grade=prep1&cat=exams" class="tab-button">
                <i class="fas fa-file-signature"></i>
                <span>EXAMS</span>
                <span class="item-count-badge" id="examCount">0</span>
            </a>
        </div>
    </main>

    <script src="../db.js"></script>
    <script>
        const sessionData = localStorage.getItem('student_session');
        if (!sessionData) {
            alert('يرجى تسجيل الدخول أولاً للوصول إلى محتوى المرحلة الدراسية.');
            window.location.href = '../index.html';
        }

        const student = JSON.parse(sessionData || '{}');
        const isAuthorized = student.role === 'admin' || student.grade === 'all' || (student.grade && student.grade.toLowerCase() === 'prep1');
        if (!isAuthorized) {
            alert('غير مصرح لك بالدخول إلى هذه المرحلة الدراسية.');
            window.location.href = '../index.html';
        }

        if (student && student.firstName) {
            document.getElementById('navStudentName').textContent = student.firstName;
            document.getElementById('avatarLetter').textContent = student.role === 'admin' ? '★' : student.firstName.charAt(0).toUpperCase();
            document.getElementById('popupFullName').textContent = `${student.firstName} ${student.lastName || ''}`;
            document.getElementById('popupStudentId').textContent = student.id || student.studentId || 'MM-000000';
        }

        const accountPopup = document.getElementById('accountPopup');
        function toggleAccountPopup(e) {
            e.stopPropagation();
            accountPopup.classList.toggle('show');
        }

        document.addEventListener('click', (e) => {
            if (!accountPopup.contains(e.target) && e.target !== document.getElementById('accountMenuBtn')) {
                accountPopup.classList.remove('show');
            }
        });

        function copyStudentId() {
            const id = document.getElementById('popupStudentId').textContent;
            navigator.clipboard.writeText(id);
            alert('تم نسخ الكود: ' + id);
        }

        function logoutStudent() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('student_session');
                window.location.href = '../index.html';
            }
        }

        async function updateCategoryCounts() {
            let items = [];
            try {
                if (typeof DB !== 'undefined' && DB.getLessons) {
                    items = await DB.getLessons('prep1', 'ALL');
                } else {
                    const allLessons = JSON.parse(localStorage.getItem('mm_lessons_db') || '[]');
                    items = allLessons.filter(l => (l.grade || '').trim().toLowerCase() === 'prep1');
                }
            } catch (e) {
                const allLessons = JSON.parse(localStorage.getItem('mm_lessons_db') || '[]');
                items = allLessons.filter(l => (l.grade || '').trim().toLowerCase() === 'prep1');
            }

            const videos = items.filter(l => (l.category || l.type || '').includes('video'));
            const summaries = items.filter(l => (l.category || l.type || '').includes('summar') || (l.category || l.type || '').includes('pdf'));
            const exams = items.filter(l => (l.category || l.type || '').includes('exam') || (l.category || l.type || '').includes('quiz'));

            document.getElementById('videoCount').textContent = videos.length;
            document.getElementById('summaryCount').textContent = summaries.length;
            document.getElementById('examCount').textContent = exams.length;
        }

        updateCategoryCounts();
        window.addEventListener('pageshow', updateCategoryCounts);
    </script>
</body>

</html>
