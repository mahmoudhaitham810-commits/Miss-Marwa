<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials | Science Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #2563eb;
            --glowing-cyan: #00E5FF;
            --bg-deep: #020617;
            --text-light: #f8fafc;
            --card-glass: rgba(15, 23, 42, 0.65);
            --border-glass: rgba(0, 229, 255, 0.2);
            --youtube-red: #ff0000;
            --facebook-blue: #1877F2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 50% 50%, #0a0f24 0%, #020617 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: floatOrbs 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: #00E5FF;
            top: -10%;
            left: -10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: #2563eb;
            bottom: -20%;
            right: -10%;
            animation-delay: -5s;
        }

        @keyframes floatOrbs {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(100px, 50px) scale(1.2);
            }

            100% {
                transform: translate(-50px, 100px) scale(0.9);
            }
        }

        .top-nav {
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 15px;
            direction: ltr;
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.4rem;
            color: #fff;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .brand-name span {
            color: var(--glowing-cyan);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s ease;
            direction: ltr;
        }

        .back-link:hover {
            color: var(--glowing-cyan);
            border-color: var(--glowing-cyan);
            transform: translateX(-3px);
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 80px;
            width: 100%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-section h1 {
            font-size: 3.5rem;
            margin: 0 0 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, #ffffff, var(--glowing-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-section p {
            color: #94a3b8;
            font-size: 1.1rem;
            direction: ltr;
        }

        .links-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .material-card {
            background: var(--card-glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            padding: 20px 26px;
            border-radius: 18px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .material-card:hover {
            transform: translateY(-5px) scale(1.01);
            background: rgba(15, 23, 42, 0.9);
            border-color: var(--glowing-cyan);
            box-shadow: 0 12px 30px rgba(0, 229, 255, 0.25);
        }

        .card-left {
            display: flex;
            align-items: center;
            gap: 16px;
            direction: ltr;
        }

        .item-icon {
            font-size: 1.8rem;
            color: #64748b;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .material-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-light);
            transition: 0.3s;
        }

        .material-subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .action-icon {
            font-size: 1.3rem;
            color: #64748b;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .material-card:hover .material-title,
        .material-card:hover .action-icon {
            color: var(--glowing-cyan);
        }

        .material-card:hover .item-icon.yt {
            color: var(--youtube-red);
            filter: drop-shadow(0 0 10px rgba(255, 0, 0, 0.5));
        }

        .material-card:hover .item-icon.fb {
            color: var(--facebook-blue);
            filter: drop-shadow(0 0 10px rgba(24, 119, 242, 0.5));
        }

        .material-card:hover .item-icon.pdf {
            color: #f87171;
            filter: drop-shadow(0 0 10px rgba(248, 113, 113, 0.5));
        }

        .material-card:hover .item-icon.exam {
            color: #4ade80;
            filter: drop-shadow(0 0 10px rgba(74, 222, 128, 0.5));
        }

        .empty-placeholder {
            text-align: center;
            padding: 50px 20px;
            background: var(--card-glass);
            border: 1px dashed var(--border-glass);
            border-radius: 20px;
            color: #64748b;
            width: 100%;
        }

        .empty-placeholder i {
            font-size: 3rem;
            color: #334155;
            margin-bottom: 12px;
            display: block;
        }

        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 2.5rem;
            }

            .material-card {
                padding: 16px 18px;
            }

            .material-title {
                font-size: 1.05rem;
            }
        }
    </style>
</head>

<body>

    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <nav class="top-nav">
        <div class="nav-left">
            <a id="backLink" href="./index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
            <div class="brand-name">Miss <span>Marwa</span></div>
        </div>
    </nav>

    <main class="main-content">
        <div class="header-section">
            <h1 id="pageHeading">Loading...</h1>
            <p id="pageSubheading">Educational Content</p>
        </div>

        <div class="links-container" id="itemsContainer">
            <!-- Populated from LocalStorage -->
        </div>
    </main>

    <!-- Universal Database Adapter -->
    <script src="./db.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const grade = (params.get('grade') || 'prep1').toLowerCase();
        const cat = (params.get('cat') || 'videos').toLowerCase();

        // Authentication Guard
        const sessionData = localStorage.getItem('student_session');
        if (!sessionData) {
            alert('يرجى تسجيل الدخول أولاً');
            window.location.href = './index.html';
        }

        const student = JSON.parse(sessionData || '{}');
        const isAuthorized = student.role === 'admin' || student.grade === 'all' || student.grade === grade;
        if (!isAuthorized) {
            alert('غير مصرح لك بالدخول إلى هذه المرحلة');
            window.location.href = './index.html';
        }

        const gradeNames = { prep1: 'Prep 1', prep2: 'Prep 2', prep3: 'Prep 3', sec1: 'Secondary 1' };
        const catTitles = { videos: 'Videos', summaries: 'Summaries', exams: 'Exams' };
        const gradeFileNames = { prep1: 'prep1/prep1.html', prep2: 'prep2/prep2.html', prep3: 'prep3/prep3.html', sec1: 'sec1/Sec1.html' };

        document.title = `${gradeNames[grade] || grade} - ${catTitles[cat] || cat} | Miss Marwa`;
        document.getElementById('pageHeading').textContent = catTitles[cat] || cat;
        document.getElementById('pageSubheading').textContent = `${gradeNames[grade] || grade} Content Library`;
        document.getElementById('backLink').href = `./${gradeFileNames[grade] || 'index.html'}`;
        document.getElementById('backLink').innerHTML = `<i class="fas fa-arrow-left"></i> Back to ${gradeNames[grade] || 'Grade'}`;

        async function loadContent() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = `
                <div style="text-align: center; padding: 40px; color: var(--glowing-cyan);">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
                    <p style="color: #94a3b8; font-size: 0.95rem;">جاري تحميل المحتوى...</p>
                </div>
            `;

            let filtered = [];
            try {
                if (typeof DB !== 'undefined' && DB.getLessons) {
                    filtered = await DB.getLessons(grade, cat);
                } else {
                    const allLessons = JSON.parse(localStorage.getItem('mm_lessons_db') || '[]');
                    filtered = allLessons.filter(item => {
                        const itemGrade = (item.grade || '').trim().toLowerCase();
                        const itemCat = (item.category || item.type || '').trim().toLowerCase();
                        const matchGrade = itemGrade === grade;
                        let matchCat = false;
                        if (cat === 'videos') matchCat = itemCat.includes('video');
                        else if (cat === 'summaries') matchCat = itemCat.includes('summar') || itemCat.includes('pdf');
                        else if (cat === 'exams') matchCat = itemCat.includes('exam') || itemCat.includes('quiz');
                        return matchGrade && matchCat;
                    });
                }
            } catch (err) {
                console.error("Error loading lessons:", err);
            }

            container.innerHTML = '';

            if (!filtered || filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-placeholder">
                        <i class="fas fa-folder-open"></i>
                        <h3 style="color: #cbd5e1; margin-bottom: 6px;">لا توجد عناصر مضافة حالياً</h3>
                        <p style="font-size: 0.9rem;">سيتم نشر المحتوى لهذا القسم عبر لوحة التحكم قريباً.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const urlLower = (item.url || '').toLowerCase();
                let iconClass = 'fas fa-file-pdf item-icon pdf';
                let actionIcon = 'fa-cloud-download-alt';

                if (cat === 'videos') {
                    actionIcon = 'fa-play';
                    if (urlLower.includes('youtube') || urlLower.includes('youtu.be')) iconClass = 'fab fa-youtube item-icon yt';
                    else if (urlLower.includes('facebook') || urlLower.includes('fb.watch')) iconClass = 'fab fa-facebook-f item-icon fb';
                    else iconClass = 'fas fa-play-circle item-icon';
                } else if (cat === 'exams') {
                    iconClass = 'fas fa-file-signature item-icon exam';
                    actionIcon = 'fa-arrow-left';
                }

                const isArabic = /[\u0600-\u06FF]/.test(item.title);
                const card = document.createElement('a');
                card.href = item.url;
                card.target = '_blank';
                card.className = 'material-card';
                card.innerHTML = `
                    <div class="card-left">
                        <i class="${iconClass}"></i>
                        <div class="title-group">
                            <span class="material-title" style="${isArabic ? 'direction: rtl; text-align: right;' : ''}">${item.title}</span>
                            ${item.notes ? `<span class="material-subtitle">${item.notes}</span>` : ''}
                        </div>
                    </div>
                    <i class="fas ${actionIcon} action-icon"></i>
                `;
                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>

</html>
