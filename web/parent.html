    <style>
        :root { --navy: #0F2A5F; --navy-2: #1E3F8A; }
        body.pp { margin: 0; background: var(--canvas); color: var(--text); font-family: 'IBM Plex Sans Arabic', Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
        .en { font-family: Inter, 'IBM Plex Sans Arabic', sans-serif; }
        .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
        /* top bar */
        .pp-top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
        .pp-top .bar { display: flex; align-items: center; gap: 12px; height: 64px; }
        .pp-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; min-width: 0; }
        .pp-brand img { width: 38px; height: 38px; }
        .pp-brand b { display: block; font-size: 15.5px; white-space: nowrap; }
        .pp-brand small { display: block; color: var(--muted); font-size: 12px; }
        .pp-actions { margin-inline-start: auto; display: flex; gap: 6px; align-items: center; }
        .bell-btn { position: relative; }
        .bell-btn .dot { position: absolute; top: 7px; left: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); display: none; }
        .bell-btn.off .dot { display: block; }
        /* child switch */
        .kids { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 0; scrollbar-width: none; }
        .kids::-webkit-scrollbar { display: none; }
        .kid { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .kid .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: 13px; }
        .kid small { color: var(--muted); font-weight: 500; }
        .kid.on { background: var(--navy); color: #fff; border-color: var(--navy); }
        .kid.on .av { background: rgba(255, 255, 255, .18); color: #fff; } .kid.on small { color: rgba(255, 255, 255, .75); }
        /* greeting + open exams (always first) */
        .greet { margin-top: 18px; }
        .greet h1 { margin: 0; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.35; color: var(--text); }
        .greet .en-hello { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; text-align: right; }
        .xs { margin-top: 14px; display: grid; gap: 12px; }
        .xs-h { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 15px; color: var(--text); margin: 0; }
        .xs-h .n { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
        .xc { border-radius: 20px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; position: relative; overflow: hidden; }
        .xc::before { content: ''; position: absolute; inset: 0 0 0 auto; width: 5px; background: var(--primary); }
        .xc .ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; background: var(--primary-soft); }
        .xc .t { font-weight: 800; font-size: 16px; line-height: 1.4; margin: 0; }
        .xc .dl { color: var(--muted); font-size: 13px; margin-top: 2px; }
        .xc .why { display: inline-block; margin-top: 8px; padding: 5px 12px; border-radius: 14px; line-height: 1.6; font-size: 13px; font-weight: 700; }
        .xc .cd { text-align: center; min-width: 118px; padding: 10px 12px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); }
        .xc .cd b { display: block; font-size: 15px; line-height: 1.35; }
        .xc .cd small { display: block; font-family: Inter, sans-serif; font-size: 12px; opacity: .85; margin-top: 2px; white-space: nowrap; }
        .xc.todo { border-color: var(--danger-line); background: linear-gradient(120deg, var(--danger-soft), var(--surface) 70%); }
        .xc.todo::before { background: var(--danger); }
        .xc.todo .ic { background: var(--danger); color: #fff; }
        .xc.todo .why { background: var(--danger); color: #fff; }
        .xc.todo .cd { background: var(--danger); color: #fff; }
        .xc.todo.soon { animation: xpulse 2.4s ease-in-out infinite; }
        @keyframes xpulse { 50% { box-shadow: 0 0 0 4px var(--danger-soft), var(--shadow-sm); } }
        .xc.prog { border-color: var(--warning); }
        .xc.prog::before, .xc.prog .ic { background: var(--warning); color: #fff; }
        .xc.prog .why { background: var(--warning-soft); color: var(--warning); }
        .xc.done::before { background: var(--success); }
        .xc.done .ic { background: var(--success-soft); }
        .xc.done .why { background: var(--success-soft); color: var(--success); }
        .xc.done .cd { background: var(--canvas); color: var(--muted); }
        .xc.gone { opacity: .6; }
        @media (max-width: 600px) { .xc { grid-template-columns: auto 1fr; } .xc .cd { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: right; } .xc .cd small { margin: 0; } }
        @media (prefers-reduced-motion: reduce) { .xc.todo.soon { animation: none; } }
        /* hero */
        .pp-hero { margin-top: 16px; border-radius: 26px; padding: 26px 24px; color: #fff; position: relative; overflow: hidden;
            background: radial-gradient(120% 140% at 0% 0%, #2F5BEA 0%, transparent 55%), linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%); box-shadow: 0 26px 50px -30px rgba(15, 42, 95, .9); }
        .pp-hero::after { content: ''; position: absolute; inset: auto -60px -80px auto; width: 260px; height: 260px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 0 0 40px rgba(255, 255, 255, .03), 0 0 0 80px rgba(255, 255, 255, .02); pointer-events: none; }
        .pp-hgrid { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; position: relative; z-index: 1; }
        .pp-hero h1 { margin: 0; font-size: clamp(22px, 4.6vw, 32px); line-height: 1.3; }
        .pp-hero .en-hello { margin: 4px 0 0; opacity: .8; font-size: 14.5px; text-align: right; }
        .pp-hero .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .chip-w { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .16); font-size: 13px; font-weight: 600; }
        .ring { position: relative; width: 132px; height: 132px; flex: none; }
        .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
        .ring .lbl b { font-size: 30px; font-family: Inter, sans-serif; line-height: 1; }

        /* KPI */
        .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
        .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px; }
        .kpi .top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
        .kpi .top .icon { width: 18px; height: 18px; }
        .kpi .v { font-size: 26px; font-weight: 800; margin-top: 8px; font-family: Inter, sans-serif; }
        .kpi .v small { font-size: 14px; color: var(--muted); font-weight: 600; }
        .kpi .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
        .pbar { height: 7px; border-radius: 99px; background: var(--surface-3, rgba(15, 23, 42, .08)); overflow: hidden; margin-top: 10px; }
        .pbar i { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
        /* sections */
        .grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-top: 16px; }
        .card2 { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 18px; }
        .card2 h2 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
        .card2 h2 .icon { color: var(--primary); }
        .card2 h2 .side { margin-inline-start: auto; font-size: 12.5px; color: var(--muted); font-weight: 500; }
        .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
        .chart { width: 100%; height: 210px; direction: ltr; }
        .chart .gl { stroke: var(--border); stroke-dasharray: 3 4; }
        .chart text { fill: var(--muted); font-size: 10.5px; font-family: Inter, sans-serif; }
        .ins { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
        .ins li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
        .ins.good li { background: var(--success-soft); } .ins.bad li { background: var(--warning-soft); }
        .ins li .e { font-size: 16px; }
        .ins-h { font-size: 13px; font-weight: 700; margin: 12px 0 8px; color: var(--muted); }
        .missed { display: flex; flex-wrap: wrap; gap: 8px; }
        .mx { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 12px; background: var(--danger-soft); color: var(--danger); font-size: 13px; font-weight: 600; }
        .mx small { color: var(--muted); font-weight: 500; }
        .open-x { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--primary-soft); margin-top: 8px; font-size: 14px; }
        /* history */
        .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2, rgba(15, 23, 42, .05)); border: 1px solid var(--border); }
        .tabs button { padding: 8px 14px; border-radius: 10px; border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; }
        .tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 4px 12px -8px rgba(15, 23, 42, .4); }
        .hist { margin-top: 12px; display: grid; }
        .hrow { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 12px 4px; border-bottom: 1px solid var(--border); align-items: center; }
        .hrow:last-child { border-bottom: 0; }
        .hrow .nm b { display: block; font-size: 14.5px; } .hrow .nm small { color: var(--muted); font-size: 12.5px; }
        .hrow .sc { text-align: left; font-family: Inter, sans-serif; font-weight: 700; direction: ltr; }
        .hrow .sc small { display: block; color: var(--muted); font-weight: 500; font-size: 12px; }
        .hrow .pbar { grid-column: 1 / -1; margin-top: 0; height: 5px; }
        .st { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
        .st.absent, .st.missed { background: var(--danger-soft); color: var(--danger); }
        .st.opened { background: var(--warning-soft); color: var(--warning); }
        .st.open { background: var(--primary-soft); color: var(--primary); }
        /* messages */
        .msg-item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--border); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: start; font: inherit; color: inherit; }
        .msg-item:last-child { border-bottom: 0; }
        .msg-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .msg-item .pv { color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-item .nb { background: var(--danger); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 3px 10px; white-space: nowrap; }
        .msg-item.is-new { background: var(--primary-soft); border-radius: 14px; padding-inline: 10px; }
        .msg-item.is-new b { color: var(--primary); }
        .msg-item.is-new .pv { color: var(--text); font-weight: 600; }
        #messages.has-unread { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft), 0 18px 36px -24px rgba(47, 91, 234, .7); }
        .unread-pill { background: var(--danger); color: #fff; border-radius: 999px; font-size: 12px; font-weight: 700; padding: 3px 10px; animation: pillIn .4s ease; }
        @keyframes pillIn { from { transform: scale(.6); opacity: 0; } }
        .msg-alert { margin-top: 12px; width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: start; padding: 12px 14px; border-radius: 18px;
            border: 1.5px solid var(--primary); background: var(--surface); color: var(--text); font: inherit; cursor: pointer; box-shadow: 0 14px 30px -20px rgba(47, 91, 234, .8); }
        .msg-alert img { width: 42px; height: 42px; border-radius: 50%; }
        .msg-alert b { display: block; font-size: 15px; } .msg-alert span span { display: block; color: var(--muted); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .msg-alert > span:nth-child(2) { min-width: 0; }
        .msg-alert .go { background: var(--primary); color: #fff; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
        .kid { position: relative; } .kdot { position: absolute; top: 2px; left: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); border: 2px solid var(--canvas); }
        [data-theme="dark"] .msg-alert .go, [data-theme="dark"] .unread-pill { color: #fff; }
        .lessons a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; }
        .lessons a:last-child { border-bottom: 0; } .lessons small { color: var(--muted); }
        /* chat panel */
        .chat { position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, .45); display: none; }
        .chat.open { display: block; }
        .chat .panel { position: absolute; inset: auto 0 0 0; height: min(86vh, 760px); background: var(--canvas); border-radius: 24px 24px 0 0; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }

        .chat .ph img { width: 40px; height: 40px; border-radius: 50%; }
        .chat .ph b { display: block; } .chat .ph small { color: var(--muted); font-size: 12.5px; }
        .chat .ph .x { margin-inline-start: auto; }
        .chat .body { overflow-y: auto; padding: 16px; display: grid; gap: 10px; align-content: start; }
        .chat .foot { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
        /* floating WhatsApp + bottom nav */
        .wa-fab { position: fixed; z-index: 40; left: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #16A34A; color: #fff; box-shadow: 0 14px 28px -12px rgba(22, 163, 74, .8); text-decoration: none; }
        .wa-fab .icon { width: 26px; height: 26px; }
        .bnav { position: fixed; z-index: 35; inset: auto 0 0 0; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--border); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
        .bnav a { display: grid; justify-items: center; gap: 2px; padding: 6px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 600; position: relative; }
        .bnav a .icon { width: 22px; height: 22px; }
        .bnav a .nb { position: absolute; top: 2px; left: calc(50% - 22px); background: var(--danger); color: #fff; font-size: 11px; font-weight: 800; border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 5px; }
        @media (min-width: 900px) { .bnav { display: none; } body.pp { padding-bottom: 40px; } .wa-fab { bottom: 24px; } }
        .install-cta { display: flex; }
        html.pwa-installed .install-cta { display: none; }
        .install-cta { margin-top: 16px; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; border: 1px dashed var(--primary); background: var(--primary-soft); }
        .install-cta b { display: block; } .install-cta small { color: var(--muted); }
        .install-cta .btn { margin-inline-start: auto; }
        .foot-note { text-align: center; color: var(--muted); font-size: 12.5px; margin: 26px 0 0; }
        .sec { scroll-margin-top: 80px; }
        .loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
        @media (max-width: 899px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } .pp-hero { padding: 22px 18px; } .ring { width: 104px; height: 104px; } .ring .lbl b { font-size: 24px; } }
        @media (max-width: 420px) { .pp-hgrid { grid-template-columns: 1fr auto; gap: 12px; } .kpi .v { font-size: 22px; } .pp-brand small { display: none; } }
        [data-theme="dark"] .kid.on { background: #2F5BEA; border-color: #2F5BEA; }
    </style>

    <script>

        // ---------- open exams: first card, live countdown ----------

        function left(ms) {
            const m = Math.max(0, Math.floor(ms / 60000)), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mi = m % 60;
            const D = arN(d, 'يوم', 'يومين', 'أيام', 'يوم'), H = arN(h, 'ساعة', 'ساعتين', 'ساعات', 'ساعة'), M = arN(mi, 'دقيقة', 'دقيقتين', 'دقايق', 'دقيقة');

            return { ar: M, en: `Closes in ${mi}m` };
        }
        const fmtDeadline = (ms) => new Date(ms).toLocaleString('ar-EG', { timeZone: 'Africa/Cairo', weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' });
        function paintExams() {

        function tickExams() {

        function chart(tr) {
            const W = 560, H = 210, pl = 30, pr = 12, pt = 12, pb = 26;
            const series = [['center', 'var(--primary)'], ['online', '#F59E0B']].filter(([k]) => tr[k].length);
            if (!series.length) return '<p class="muted" style="margin:30px 0;text-align:center">الرسم هيظهر بعد أول امتحان.</p>';
            const n = Math.max(...series.map(([k]) => tr[k].length));
            const x = (i, len) => pl + (len <= 1 ? (W - pl - pr) / 2 : (i * (W - pl - pr)) / (len - 1));
            const y = (p) => pt + (1 - p / 100) * (H - pt - pb);
            let out = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="تطور الدرجات">`;
            [0, 50, 100].forEach(v => { out += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="2" y="${y(v) + 4}">${v}%</text>`; });
            for (const [k, col] of series) {

            $('chatBody').scrollTop = $('chatBody').scrollHeight;
        }
        const closeChat = () => { $('chat').classList.remove('open'); $('chat').setAttribute('aria-hidden', 'true'); };
        $('chatClose').addEventListener('click', closeChat);
        $('chat').addEventListener('click', (e) => { if (e.target === $('chat')) closeChat(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeChat(); });

        // ---------- sign out ----------
        $('logoutBtn').addEventListener('click', () => Site.sheet({ iconName: 'logout', title: 'تسجيل خروج؟', subtitle: 'هتحتاج رقمك ورقم الطالب عشان تدخل تاني.',
            actions: [{ label: 'تسجيل خروج', cls: 'btn-danger', onClick: async (close) => { close(); try { await fetch('/api/parent?action=logout', { method: 'POST' }); } catch (e) { } try { localStorage.removeItem('parent_signed_in'); } catch (e) { }
                (window.OneSignalDeferred || []).push(async (OS) => { try { await OS.logout(); } catch (e) { } }); setTimeout(() => location.replace('/login.html?as=parent'), 150); } }, { label: 'إلغاء', cls: 'btn-ghost' }] }));

        // ---------- notifications (OneSignal: this phone = "parent-<number>", tagged with each child's grade) ----------
        const permission = () => (typeof Notification !== 'undefined' ? Notification.permission : 'unsupported');
        const paintBell = () => $('bellBtn').classList.toggle('off', permission() !== 'granted');
        function loadOneSignal() {
            window.OneSignalDeferred = window.OneSignalDeferred || [];
            if (!document.querySelector('script[data-onesignal]')) { const sc = document.createElement('script'); sc.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; sc.defer = true; sc.dataset.onesignal = '1'; document.head.appendChild(sc); }
            OneSignalDeferred.push(async (OS) => {
                try {
                    await OS.init({ appId: 'a5d058a6-b45e-46a5-aa86-014309b7c7d2', notifyButton: { enable: false } });
                    if (OS.User.externalId !== ME.alias) await OS.login(ME.alias);
                    const tags = { parent: ME.alias.replace('parent-', '') };
                    ['prep1', 'prep2', 'prep3', 'sec1'].forEach(gr => { if (ME.grades.includes(gr)) tags['pg_' + gr] = '1'; });
                    await OS.User.addTags(tags);
                    const drop = ['prep1', 'prep2', 'prep3', 'sec1'].filter(gr => !ME.grades.includes(gr)).map(gr => 'pg_' + gr);
                    if (drop.length) await OS.User.removeTags(drop);
                    OS.Notifications.addEventListener('permissionChange', paintBell);
                } catch (e) { }
                paintBell();
            });
            paintBell();
        }
        $('bellBtn').addEventListener('click', () => {
            const p = permission();
            const test = async (close) => { close(); try { const r = await api('/api/parent?action=push-test', {}); Site.toast(r.sent || r.viaTag ? 'اتبعت إشعار تجربة — هيوصل خلال ثواني 🔔' : r.configured === false ? 'الإشعارات لسه مش متفعّلة على السيرفر.' : 'الموبايل ده لسه مش متسجّل — اعمل تحديث للصفحة وجرّب تاني.', r.sent || r.viaTag ? 'success' : 'error'); } catch (e) { Site.toast(e.message, 'error'); } };
            if (p === 'granted') return Site.sheet({ iconName: 'bell', tone: 'success', title: 'الإشعارات شغالة ✅', subtitle: 'هيوصلك إشعار لما تنزل درجات، أو امتحان جديد، أو امتحان هيقفل قبل ما ابنك/بنتك يحله، أو رسالة من مس مروة.', actions: [{ label: 'ابعت إشعار تجربة', icon: 'bell', onClick: test }, { label: 'تمام', cls: 'btn-ghost' }] });
            if (p === 'denied') return Site.sheet({ iconName: 'bell', tone: 'danger', title: 'الإشعارات مقفولة', html: '<p class="muted" style="margin:0;line-height:1.8">افتح إعدادات الموبايل ← التطبيقات ← المتصفح أو «ولي الأمر» ← الإشعارات ← سماح، وبعدين ارجع هنا.</p>', actions: [{ label: 'تمام', cls: 'btn-ghost' }] });
            if (p === 'unsupported') return Site.sheet({ iconName: 'bell', title: 'ثبّت التطبيق الأول', html: '<p class="muted" style="margin:0;line-height:1.8">على الآيفون: من Safari دوس <b>مشاركة</b> ← <b>إضافة إلى الشاشة الرئيسية</b>، وافتح «ولي الأمر» من الشاشة الرئيسية، وبعدين فعّل الإشعارات.</p>', actions: [{ label: 'تمام', cls: 'btn-ghost' }] });
            Site.sheet({ iconName: 'bell', title: 'فعّل الإشعارات', subtitle: 'عشان يوصلك أول ما الدرجات تنزل، أو امتحان هيقفل، أو مس مروة تبعتلك.',
                actions: [{ label: 'تفعيل', icon: 'bell', onClick: (close) => { close(); (window.OneSignalDeferred = window.OneSignalDeferred || []).push(async (OS) => { try { await OS.Notifications.requestPermission(); } catch (e) { } paintBell(); }); } }, { label: 'مش دلوقتي', cls: 'btn-ghost' }] });
        });

        boot().catch(e => { if (e.message !== 'signed out') $('app').innerHTML = `<div class="loading"><div style="text-align:center"><p>${esc(e.message)}</p><button class="btn btn-primary" onclick="location.reload()">حاول تاني</button></div></div>`; });
    })();
    </script>
</body>
</html>
