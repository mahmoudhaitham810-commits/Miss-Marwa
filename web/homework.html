            background: linear-gradient(120deg, color-mix(in srgb, var(--primary) 16%, var(--surface)), color-mix(in srgb, var(--accent, #F59E0B) 16%, var(--surface))); }

<body>
    <main class="main" id="main">
        <div class="container" id="root">
            <div class="segmented switch reveal" id="switch"></div>
            <div id="view"><div class="skel" style="height:220px;border-radius:20px"></div></div>
        </div>
    </main>

    <script src="/assets/pwa.js"></script>
    <script src="/assets/student.js?v=20261120a"></script>
    <script src="/assets/hw-kit.js"></script>
    <script>
    (function () {
        if (!window.App) return;
        if (!App.features.homework) { location.replace('/exams.html'); return; }      // feature paused — old links / notifications land on Exams
        const { session, esc, txt, icon, api, url, timeLeft, fmtDate, scoreTone, ring, animateRings, toast, sheet, soon, reveal } = App;
        App.shell({ active: 'exams', title: 'Homework' });
        const $ = (id) => document.getElementById(id);
        const view = $('view');
        $('switch').innerHTML = `<a href="${url('exams.html')}" class="">${icon('clipboard', 'sm')}Exams</a><a href="${url('homework.html')}" class="active" aria-current="page">${icon('file', 'sm')}Homework</a>`;
        $('switch').querySelectorAll('a').forEach(a => a.setAttribute('role', 'button'));
        const toMs = (v) => v ? new Date(String(v).replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(String(v)) ? '' : 'Z')).getTime() : NaN;
        const iso = (v) => new Date(toMs(v)).toISOString();
        const when = (v) => new Date(toMs(v)).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
        const params = () => new URLSearchParams(location.search);
        const go = (q) => { history.pushState({}, '', url('homework.html', q)); route(); };
        window.addEventListener('popstate', route);

        let MODE = 'confirm';
        // ================= list =================
        async function showList() {
            view.innerHTML = `<section class="page-head reveal"><h1 class="h1">Homework <span class="ar" style="font-weight:600;color:var(--muted);font-size:.7em">· الواجبات</span></h1>
                <p class="small">Answer here and see your mark straight away — your AI Assistant explains every mistake 🤖</p></section><div id="hwList"><div class="skel" style="height:180px;border-radius:20px"></div></div>`;
            let d; try { d = await api('/api/hw-student?action=list'); } catch (e) { $('hwList').innerHTML = `<div class="card"><p class="muted">${esc(e.message)}</p></div>`; return; }
            MODE = d.mode;
            const due = d.items.filter(x => x.due).sort((a, b) => toMs(a.deadline) - toMs(b.deadline));
            const done = d.items.filter(x => x.submission).sort((a, b) => toMs(b.submission.submittedAt) - toMs(a.submission.submittedAt));
            const missed = d.items.filter(x => !x.submission && x.state === 'closed');
            const card = (x) => {
                const s = x.submission, late = toMs(x.deadline) < Date.now();
                let right = '';
                const lastDay = !s && !late && toMs(x.deadline) - Date.now() < 864e5;
                if (!s && lastDay && x.answerMode === 'web') right = `<span class="chip danger">${icon('clock', 'sm')}Last day · ${esc(timeLeft(iso(x.deadline)))}</span>`;

            };

                + (done.length ? `<div class="sec-title">Submitted</div><div class="hw-list">${done.map(card).join('')}</div>` : '')
                + (missed.length ? `<div class="sec-title">Missed</div><div class="hw-list">${missed.map(x => `<div class="card hw reveal"><div class="top"><span class="xs muted">Unit ${x.unit} · Lesson ${x.lesson}</span><span class="chip danger">${icon('lock', 'sm')}Closed</span></div><h3>${txt(x.title)}</h3><p class="small muted" style="margin:0">This homework closed before you submitted it.</p></div>`).join('')}</div>` : '');
            $('hwList').addEventListener('click', (e) => { const a = e.target.closest('a[data-id]'); if (a) { e.preventDefault(); go({ id: a.dataset.id }); } });

        // ================= one homework =================
        let H = null, PAGES = [], SUBMITTING = false;
        async function showOne(id) {
            view.innerHTML = '<div class="skel" style="height:260px;border-radius:20px"></div>';
            try { H = await api(`/api/hw-student?action=get&id=${encodeURIComponent(id)}`); } catch (e) { view.innerHTML = `<div class="card"><p>${esc(e.message)}</p><a class="btn btn-soft" href="${url('homework.html')}">Back</a></div>`; return; }
            MODE = H.mode;
            const a = H.assignment, s = H.submission;
            const head = `<section class="page-head reveal"><a class="link" href="${url('homework.html')}" data-back>${icon('arrowLeft', 'sm')}All homework</a>

                <p class="small">Unit ${a.unit} · Lesson ${a.lesson} · ${a.questions} question${a.questions === 1 ? '' : 's'} · ${a.totalScore} marks · due ${esc(when(a.deadline))}${a.durationMin ? ` · ⏱ ${a.durationMin} min` : ''}</p></section>`;
            if (a.answerMode === 'web') return H.canUpload ? renderWebStart(head) : renderWebResult(head);
            if (H.canUpload) return renderUpload(head);

        }

        function renderUpload(head) {
            const a = H.assignment;
            PAGES = [];
            view.innerHTML = head + `
                ${H.reupload ? `<div class="card reveal" style="border:1.5px solid var(--danger);margin-bottom:14px"><b>${icon('alert', 'sm')} Some pages couldn't be read</b><p class="small muted" style="margin:6px 0 0">You can upload your homework one more time before the deadline. Take the photos in good light, straight from above.</p></div>` : ''}

                <div class="tip reveal"><span class="ic">${icon('edit')}</span><div><b class="tt">Write the question number next to every answer ✍️</b>

        async function addPdf(file) {

                    renderPages();
                }
            } catch (e) { toast("Couldn't open this PDF — try exporting it again from CamScanner", 'error'); }
            $('prep').textContent = '';
        }
        async function addPhotos(files) {
            for (let i = 0; i < files.length && PAGES.length < 20; i++) {
                $('prep').textContent = `Preparing photo ${i + 1} of ${files.length}…`;
                try { const r = await HwKit.photoToJpeg(files[i]); PAGES.push({ dataUrl: r.dataUrl, q: HwKit.checkQuality(r.canvas) }); renderPages(); }
                catch (e) { toast(e.message, 'error'); }
            }
            $('prep').textContent = '';
        }
        function renderPages() {
            $('pages').innerHTML = PAGES.map((p, i) => `<div class="pg ${p.q.dark || p.q.blurry ? 'bad' : ''}"><img src="${p.dataUrl}" alt="Page ${i + 1}"><span class="no">${i + 1}</span>
                ${p.q.dark ? '<span class="warn">Too dark — retake?</span>' : p.q.blurry ? '<span class="warn">Looks blurry — retake?</span>' : ''}
                <div class="tools"><button data-t="up" data-i="${i}" aria-label="Move page ${i + 1} up" ${i ? '' : 'disabled'}>${icon('arrowLeft', 'sm')}</button><button data-t="down" data-i="${i}" aria-label="Move page ${i + 1} down" ${i < PAGES.length - 1 ? '' : 'disabled'}>${icon('arrowRight', 'sm')}</button><button data-t="del" data-i="${i}" aria-label="Remove page ${i + 1}">${icon('trash', 'sm')}</button></div></div>`).join('');
            $('submitBar').hidden = !PAGES.length;
            $('submitLabel').textContent = `Submit ${PAGES.length} page${PAGES.length === 1 ? '' : 's'}${H.late ? ' (late)' : ''}`;
        }
        function onPageTool(e) {
            const b = e.target.closest('button[data-t]'); if (!b) return;
            const i = Number(b.dataset.i);
            if (b.dataset.t === 'up' && i > 0) [PAGES[i - 1], PAGES[i]] = [PAGES[i], PAGES[i - 1]];
            if (b.dataset.t === 'down' && i < PAGES.length - 1) [PAGES[i + 1], PAGES[i]] = [PAGES[i], PAGES[i + 1]];
            if (b.dataset.t === 'del') PAGES.splice(i, 1);
            renderPages();
        }
        function confirmSubmit() {
            const bad = PAGES.filter(p => p.q.dark || p.q.blurry).length;
            sheet({
                iconName: bad ? 'alert' : 'send', tone: bad ? 'accent' : undefined,
                title: bad ? `${bad} page${bad === 1 ? '' : 's'} may be hard to read` : `Submit ${PAGES.length} page${PAGES.length === 1 ? '' : 's'}?`,
                subtitle: bad ? 'Blurry or dark pages can lose marks. You can retake them now, or submit anyway.' : 'Check the pages are in order and every answer has its question number.',
                actions: [{ label: bad ? 'Submit anyway' : 'Submit homework', cls: 'btn-primary', onClick: (close) => { close(); submit(); } }, { label: bad ? 'Retake pages' : 'Not yet', cls: 'btn-ghost' }]
            });
        }
        async function submit() {
            if (SUBMITTING) return; SUBMITTING = true;
            const head = view.querySelector('.page-head').outerHTML;
            view.innerHTML = head + markingCard(); reveal(view);
            setStep(0, `0 of ${PAGES.length}`); setBar(3);
            try {
                const st = await api('/api/hw-student?action=start', { method: 'POST', body: { id: H.assignment.id } });
                for (let i = 0; i < PAGES.length; i++) {
                    await api('/api/hw-student?action=page', { method: 'POST', body: { submissionId: st.submissionId, pageNo: i + 1, image: { mime: 'image/jpeg', data: HwKit.b64(PAGES[i].dataUrl) } } });
                    setStep(0, `${i + 1} of ${PAGES.length}`); setBar(5 + (i + 1) / PAGES.length * 25);
                }
                await api('/api/hw-student?action=submit', { method: 'POST', body: { submissionId: st.submissionId } });
                SUBMITTING = false;
                await loop(st.submissionId);
            } catch (e) {
                SUBMITTING = false;
                view.innerHTML = head + `<div class="card reveal in"><b>${icon('alert', 'sm')} ${esc(e.message)}</b><p class="small muted">Your pages were not lost — try again.</p><button class="btn btn-primary" id="retry">${icon('refresh', 'sm')}Try again</button></div>`;
                $('retry').addEventListener('click', () => { view.innerHTML = head; renderUpload(head); });
            }
        }
        const STEPS = [['Uploading your pages', 'download'], ['Reading your answers', 'eye'], ['Checking with the answer key', 'checkCircle'], ['Calculating your score', 'target']];
        function markingCard() {
            return `<div class="card marking reveal"><div class="robot"><span class="orb"></span><span class="core">${icon('sparkles')}</span></div>
                <h2 style="margin:0">Marking your homework…</h2><p class="small muted" style="margin:6px 0 0" id="mkNote">Keep this page open — it only takes a moment.</p>
                <ul class="steps">${STEPS.map(([t, ic], i) => `<li data-s="${i}"><span class="dot">${icon(ic, 'sm')}</span><span>${t}<small></small></span></li>`).join('')}</ul>
                <div class="bar"><span id="mkBar"></span></div></div>`;
        }
        function setStep(k, sub) {
            view.querySelectorAll('.steps li').forEach((li, i) => {
                li.className = i < k ? 'done' : i === k ? 'now' : '';
                li.querySelector('.dot').innerHTML = i < k ? icon('check', 'sm') : icon(STEPS[i][1], 'sm');
                li.querySelector('small').textContent = i === k ? (sub || '') : '';
            });
        }
        const setBar = (p) => { const b = $('mkBar'); if (b) b.style.width = Math.min(100, p) + '%'; };
        async function runMarking(head, subId) { view.innerHTML = head + markingCard(); reveal(view); setStep(1, ''); setBar(35); await loop(subId); }
        async function loop(subId) {
            let pages = 0;
            for (let k = 0; k < 80; k++) {
                let r;
                try { r = await api('/api/hw-student?action=grade', { method: 'POST', body: { submissionId: subId } }); }
                catch (e) { await new Promise(x => setTimeout(x, 2500)); continue; }
                pages = r.pages || pages;
                if (r.stage === 'reading') { setStep(1, `page ${r.page} of ${r.pages}`); setBar(30 + r.page / Math.max(1, r.pages) * 45); }
                if (r.done) {
                    setStep(2, ''); setBar(85); await new Promise(x => setTimeout(x, 450));
                    setStep(3, ''); setBar(100); await new Promise(x => setTimeout(x, 550));
                    H = await api(`/api/hw-student?action=get&id=${H.assignment.id}`);
                    return renderResult(view.querySelector('.page-head').outerHTML, true);
                }
                if (r.queued) {
                    H = await api(`/api/hw-student?action=get&id=${H.assignment.id}`);
                    return renderResult(view.querySelector('.page-head').outerHTML, false, r.reason);
                }
                if (r.stage !== 'reading' && !r.busy) setStep(r.page ? 1 : 2, '');
                if (r.busy || r.retry) await new Promise(x => setTimeout(x, 1500));
            }
            H = await api(`/api/hw-student?action=get&id=${H.assignment.id}`);
            renderResult(view.querySelector('.page-head').outerHTML);
        }

        // ================= answer on the website =================
        const SEC_TITLE = { mcq: 'Choose the correct answer', tf: 'Put (✓) or (✗)', short: 'Complete', essay: 'Answer / give reasons' };
        let ANS = {}, SAVE_T = null, TICK_T = null, SKEW = 0, SUB_ID = null, ENDS = null, PHOTOS = [], WARNED5 = false, SENDING = false;
        const lsKey = () => `hw_ans_${session.id}_${H.assignment.id}`;
        const lsGet = () => { try { return JSON.parse(localStorage.getItem(lsKey()) || 'null'); } catch (e) { return null; } };
        const lsSet = (v) => { try { localStorage.setItem(lsKey(), JSON.stringify(v)); } catch (e) { } };
        const lsDel = () => { try { localStorage.removeItem(lsKey()); } catch (e) { } };
        const answered = (q) => { const x = ANS[q.label]; return !!(x && (String(x.answer || '').trim() || (q.type === 'essay' && PHOTOS.some(p => p.labels.includes(q.label))))); };

        function renderWebStart(head) {
            const a = H.assignment, s = H.submission;
            SKEW = H.now ? toMs(H.now) - Date.now() : 0;
            if (s && s.status === 'uploading') return openSheet(head);
            if (!a.durationMin) return beginSheet(head);
            view.innerHTML = head + `<div class="card start-card reveal"><div class="big-ic">${icon('clock')}</div>
                <h2 style="margin:0 0 6px">${a.durationMin >= 60 ? `${Math.round(a.durationMin / 6) / 10} hour${a.durationMin === 60 ? '' : 's'}` : `${a.durationMin} minutes`} to answer</h2>
                <p class="small muted" style="margin:0 auto;max-width:380px">The timer starts when you press <b>Start</b> and keeps running even if you close the page. Your answers save automatically.</p>
                <p class="small" dir="rtl" style="margin:8px auto 0;max-width:380px">⏱️ الوقت بيبدأ أول ما تدوس Start — وإجاباتك بتتحفظ أوتوماتيك.</p>
                ${H.late ? `<p class="small" style="color:var(--danger);font-weight:700">The deadline has passed — it will be marked “Late”.</p>` : ''}
                <button class="btn btn-primary btn-lg" id="startBtn" style="margin-top:14px">${icon('play', 'sm')}Start</button></div>`;
            reveal(view);
            $('startBtn').addEventListener('click', () => beginSheet(head));
        }
        async function beginSheet(head) {
            try { await api('/api/hw-student?action=start', { method: 'POST', body: { id: H.assignment.id } }); H = await api(`/api/hw-student?action=get&id=${H.assignment.id}`); SKEW = H.now ? toMs(H.now) - Date.now() : 0; openSheet(head); }
            catch (e) { toast(e.message, 'error'); }
        }
        function openSheet(head) {
            const a = H.assignment, s = H.submission, paper = H.paper || [];
            SUB_ID = s.id; ENDS = s.endsAt ? toMs(s.endsAt) : null; WARNED5 = false;
            const local = lsGet();
            ANS = Object.assign({}, H.draft || {}, local && local.sub === s.id ? local.answers : {});
            PHOTOS = H.photos || [];
            const sections = [];
            paper.forEach(q => { const sec = String(q.label).includes('.') ? String(q.label).replace(/\.[^.]+$/, '') : String(q.label); let g = sections.find(x => x.sec === sec); if (!g) sections.push(g = { sec, type: q.type, qs: [] }); g.qs.push(q); });
            view.innerHTML = head + `
                ${isLastDay() ? `<div class="lastday reveal" id="lastDay">${icon('alert')}<div><b dir="rtl">النهاردة آخر يوم لتسليم الواجب — لازم تسلّم النهاردة قبل الميعاد النهائي ⏰</b><p>Today is the last day — submit before ${esc(when(a.deadline))}. Saved answers that are not submitted don't count.</p></div></div>` : ''}
                ${a.instructions ? `<div class="card reveal" style="margin-bottom:14px"><b>Note from Miss Marwa</b><p dir="auto" style="margin:6px 0 0">${txt(a.instructions)}</p></div>` : ''}
                ${!ENDS ? `<div class="save-note reveal">${icon('checkCircle', 'sm')}<div><b>Your progress is saved — you can close and continue later</b><span class="ar">إجاباتك بتتحفظ أوتوماتيك — تقدر تقفل وتكمّل بعدين قبل آخر ميعاد.</span></div></div>` : ''}
                <div class="sheet-bar reveal"><div class="prog"><b id="progTxt"></b> <span class="saved" id="savedTxt"></span><div class="bar"><span id="progBar"></span></div></div>${ENDS ? `<span class="timer" id="timer">${icon('clock', 'sm')}<span id="timerTxt">--:--</span></span>` : ''}</div>
                <div id="sheet">${sections.map(g => `<div class="sec-head reveal"><span class="n">${esc(g.sec)}</span><b>${esc(SEC_TITLE[g.type] || 'Questions')}</b></div>${g.qs.map(qHTML).join('')}`).join('')}</div>
                <div class="submit-bar"><div class="${ENDS ? '' : 'send-row'}">${ENDS ? '' : `<button class="btn btn-soft btn-lg" id="laterBtn">${icon('clock', 'sm')}Save & continue later</button>`}<button class="btn btn-primary btn-block btn-lg" id="sendBtn">${icon('send')}Submit answers${H.late ? ' (late)' : ''}</button></div></div>`;
            reveal(view);
            const sheetEl = $('sheet');
            sheetEl.addEventListener('click', onSheetClick);
            sheetEl.addEventListener('input', onSheetInput);
            sheetEl.addEventListener('change', onSheetFile);
            $('sendBtn').addEventListener('click', confirmSend);
            $('laterBtn') && $('laterBtn').addEventListener('click', saveLater);
            SHEET_OPEN = true;
            progress();
            clearInterval(TICK_T); if (ENDS) { tickTimer(); TICK_T = setInterval(tickTimer, 1000); }
        }
        let SHEET_OPEN = false;
        const isLastDay = () => { const d = toMs(H.assignment.deadline) - Date.now(); return d > 0 && d < 864e5; };
        async function saveLater() {
            const b = $('laterBtn'); b.classList.add('loading'); b.disabled = true;
            try { await saveNow(); } finally { b.classList.remove('loading'); b.disabled = false; }
            const left = toMs(H.assignment.deadline) - Date.now();
            toast(left > 0 ? `Saved ✅ Continue any time before ${when(H.assignment.deadline)}` : 'Saved ✅', 'success');
            SHEET_OPEN = false; go({});
        }
        // last day + not submitted → think twice before leaving
        window.addEventListener('beforeunload', (e) => { if (SHEET_OPEN && H && isLastDay()) { saveNow(); e.preventDefault(); e.returnValue = ''; } });
        document.addEventListener('click', (e) => {
            const a = e.target.closest('a[href]');
            if (!a || !SHEET_OPEN || !H || !isLastDay() || a.target === '_blank' || e.defaultPrevented && !a.hasAttribute('data-back')) return;

            const href = a.getAttribute('href'), back = a.hasAttribute('data-back');

            sheet({ iconName: 'alert', tone: 'accent', title: 'النهاردة آخر يوم لتسليم الواجب ⏰', subtitle: "Your answers are saved, but they only count after you submit. Submit now?",
                actions: [{ label: 'Submit now', cls: 'btn-primary', onClick: (c) => { c(); confirmSend(); } },
                    { label: 'Leave for now', cls: 'btn-ghost', onClick: (c) => { c(); SHEET_OPEN = false; if (back) go({}); else location.href = href; } }] });
        }, true);
        function qHTML(q) {
            const x = ANS[q.label] || {}, L = esc(q.label);
            let body = '';
            if (q.type === 'mcq') {
                body = q.options && q.options.length
                    ? `<div class="opts ${q.options.every(o => o.length < 28) ? 'two' : ''}">${q.options.map((o, k) => { const l = 'abcdef'[k]; return `<button type="button" class="opt ${x.answer === l ? 'on' : ''}" data-q="${L}" data-v="${l}" aria-pressed="${x.answer === l}"><span class="L">${l}</span><span dir="auto">${txt(o)}</span></button>`; }).join('')}</div>`
                    : `<div class="hint">Choose the letter from your booklet</div><div class="letters">${'abcd'.split('').map(l => `<button type="button" class="opt ${x.answer === l ? 'on' : ''}" data-q="${L}" data-v="${l}"><span class="L">${l}</span></button>`).join('')}</div>`;
            } else if (q.type === 'tf') {
                body = `${q.requiresCorrection ? '<div class="hint">Put (✓) or (✗) — and correct the wrong statement</div>' : ''}<div class="tfrow"><button type="button" class="opt t ${x.answer === 'true' ? 'on' : ''}" data-q="${L}" data-v="true">✓ True</button><button type="button" class="opt f ${x.answer === 'false' ? 'on' : ''}" data-q="${L}" data-v="false">✗ False</button></div>

                    <dt>Score</dt><dd>${r.released ? `${r.score} / ${a.totalScore}` : 'Being checked'}</dd><dt>Submitted</dt><dd>${esc(when(s.submittedAt))}${s.late ? ' · late' : ''}</dd></dl>
                <div class="code"><div><span style="opacity:.8;font-size:12px">Receipt code</span><br><b>${esc(s.receipt || '—')}</b></div>
                    <div class="clock"><span class="pulse"></span><span style="opacity:.85;font-size:12px" id="rcDate"></span><b id="rcTime"></b></div></div></div>`;
        }
        function tick() {
            const d = new Date();
            document.querySelectorAll('#rcTime').forEach(el => { el.textContent = d.toLocaleTimeString('en-GB'); });
            document.querySelectorAll('#rcDate').forEach(el => { el.textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); });
        }
        function renderResult(head, fresh = false, queuedWhy = null) {
            const s = H.submission, a = H.assignment, r = H.result;
            clearInterval(clockTimer);
            if (!s) { view.innerHTML = head + `<div class="card"><p class="muted">${esc(H.uploadWhy || 'This homework is closed.')}</p></div>`; return; }
            let top = '';
            if (r && r.released) {
                top = `<div class="card reveal"><div class="res-head">${ring(r.score, a.totalScore, { label: 'score' })}<div><h2>${r.score >= a.totalScore * 0.85 ? 'Excellent work! 🌟' : r.score >= a.totalScore * 0.5 ? 'Good effort 👏' : 'Keep going — you can do it 💪'}</h2>
                    <p class="small muted" style="margin:0">${r.items.filter(i => i.verdict === 'correct').length} of ${r.items.length} questions fully right${r.items.some(i => i.verdict !== 'correct') ? ` · ${r.items.filter(i => i.verdict !== 'correct').length} to revise` : ''}</p></div></div>
                    <div class="res-actions"><button class="btn btn-soft" id="waSum">${icon('whatsapp', 'sm')}Send summary on WhatsApp</button><button class="btn btn-ghost" id="showReceipt">${icon('shield', 'sm')}Show receipt</button></div></div>`;
            } else if (queuedWhy || s.status === 'queued') {
                top = `<div class="card reveal"><b>${icon('checkCircle', 'sm')} Your homework is safely submitted</b><p class="small muted" style="margin:6px 0 0">The marking robot is resting until 2:00 am. You'll get a notification as soon as your homework is marked.</p></div>`;
            } else if (s.status === 'needs_review') {
                top = `<div class="card reveal"><b>${icon('eye', 'sm')} Miss Marwa is checking your pages</b><p class="small muted" style="margin:6px 0 0">${s.unreadable ? 'Some pages were hard to read. ' : ''}You'll get a notification when your mark is ready.</p>
                    ${H.canUpload && H.reupload ? `<button class="btn btn-primary" style="margin-top:10px" id="reup">${icon('refresh', 'sm')}Upload clearer pages (1 chance)</button>` : ''}</div>`;
            } else if (s.status === 'pending' || (r && !r.released)) {
                top = `<div class="card reveal"><b>${icon('hourglass', 'sm')} Marked — waiting for Miss Marwa to confirm</b><p class="small muted" style="margin:6px 0 0">You'll get a notification when your score is ready.</p></div>`;
            }
            const items = r && r.released ? r.items : [];
            const wrong = items.filter(i => i.verdict !== 'correct');
            const qCard = (i) => {
                const mark = i.verdict === 'correct' ? '✅' : i.verdict === 'partial' ? '🟡' : '❌';
                return `<div class="q ${esc(i.verdict)}"><div class="qh"><b>${mark} Question ${esc(i.label)}</b><span class="pts">${i.earned} / ${i.points}</span></div>
                    ${i.question ? `<div class="small muted" dir="auto">${txt(i.question)}</div>` : ''}
                    <div class="row"><span>Your answer</span><span dir="auto">${i.yourAnswer ? txt(i.yourAnswer) : '<i class="muted">nothing found</i>'}${i.yourCorrection ? ' — ' + txt(i.yourCorrection) : ''}</span></div>
                    ${i.verdict !== 'correct' ? `<div class="row"><span>Model answer</span><span class="model" dir="auto">${txt(i.modelAnswer)}</span></div>` : ''}
                    ${i.explanation || i.feedback ? `<div class="why" dir="auto">${i.explanation ? `💡 ${txt(i.explanation)}` : ''}${i.feedback && i.verdict !== 'correct' ? `${i.explanation ? '<br>' : ''}✍️ ${txt(i.feedback)}` : ''}</div>` : ''}</div>`;
            };
            view.innerHTML = head + top
                + (items.length ? `${wrong.length ? `<div class="ai-soon reveal"><div><b>${icon('sparkles', 'sm')} Study with AI <span class="soon-tag">Soon</span></b><p>Your mistakes turned into a short lesson made just for you.</p></div><button class="btn btn-soft btn-sm" id="aiSoon">Coming soon</button></div>` : ''}
                    <div class="sec-title">${wrong.length ? 'Questions to revise' : 'All your answers'}</div><div class="reveal">${(wrong.length ? wrong : items).map(qCard).join('')}</div>
                    ${wrong.length && items.length > wrong.length ? `<details class="reveal" style="margin-top:12px"><summary class="link" style="cursor:pointer">Show the ${items.length - wrong.length} correct answers</summary><div style="margin-top:10px">${items.filter(i => i.verdict === 'correct').map(qCard).join('')}</div></details>` : ''}
                    ${wrong.length ? `<a class="btn btn-ghost btn-block reveal" style="margin-top:14px" href="${url('questions.html', { new: 1, unit: a.unit, lesson: a.lesson })}">${icon('help', 'sm')}Ask Miss Marwa about a question</a>` : ''}` : '')
                + `<div class="sec-title">Your receipt — show it at the door</div><div class="reveal">${receiptHTML()}</div>`;
            reveal(view); animateRings(view);
            tick(); clockTimer = setInterval(tick, 1000);
            $('aiSoon') && $('aiSoon').addEventListener('click', () => soon('Study with AI'));
            $('showReceipt') && $('showReceipt').addEventListener('click', fullReceipt);
            $('waSum') && $('waSum').addEventListener('click', waSummary);
            $('reup') && $('reup').addEventListener('click', () => renderUpload(head));
            if (fresh && r && r.released && r.score >= a.totalScore * 0.85) confetti();
        }
        function fullReceipt() {
            const ov = document.createElement('div'); ov.className = 'receipt-full'; ov.innerHTML = receiptHTML().replace('id="receipt"', '') + '';
            ov.addEventListener('click', () => ov.remove()); document.body.appendChild(ov); tick();
        }
        async function waSummary() {
            const btn = $('waSum'); btn.classList.add('loading'); btn.disabled = true;
            try {
                const r = await api('/api/hw-student?action=report', { method: 'POST', body: { submissionId: H.submission.id } });
                const href = `https://wa.me/?text=${encodeURIComponent(r.text)}`;
                (window.__waOpen || ((h) => { window.open(h, '_blank', 'noopener'); }))(href);
            } catch (e) { toast(e.message, 'error'); }
            finally { btn.classList.remove('loading'); btn.disabled = false; }
        }
        function confetti() {
            const box = document.createElement('div'); box.className = 'confetti';
            const colors = ['#16A34A', '#0EA5E9', '#6366F1', '#F59E0B', '#EF4444'];
            for (let i = 0; i < 70; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = colors[i % colors.length]; p.style.animationDuration = 1.8 + Math.random() * 1.6 + 's'; p.style.animationDelay = Math.random() * .5 + 's'; box.appendChild(p); }
            document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
        }

        function route() {
            SHEET_OPEN = false;
            clearInterval(clockTimer); clearInterval(TICK_T); if (typeof stopThink === 'function') stopThink();
            const id = params().get('id');
            if (id) showOne(id); else showList();
            window.scrollTo(0, 0);
        }
        view.addEventListener('click', (e) => { const b = e.target.closest('[data-back]'); if (b) { e.preventDefault(); go({}); } });
        route();
    })();
    </script>
</body>
</html>
