<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Academy</title>
    <!-- materials.html moved to lessons.html (online exams moved to exams.html). Old links keep working. -->
    <script>
        (function () {
            var p = new URLSearchParams(location.search);
            var cat = (p.get('cat') || '').toLowerCase();
            var q = new URLSearchParams();
            if (p.get('grade')) q.set('grade', p.get('grade'));
            var page = 'lessons.html';
            if (cat === 'exams') page = 'exams.html';
            else if (cat) q.set('cat', cat);
            location.replace('/' + page + (q.toString() ? '?' + q.toString() : ''));
        })();
    </script>
</head>
<body><a href="/lessons.html">Continue to lessons</a></body>
</html>
