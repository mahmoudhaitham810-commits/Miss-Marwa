<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0B1220">
    <meta name="robots" content="noindex, nofollow">
    <script>try { var t = localStorage.getItem('theme'); if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { }</script>
    <script>/* Catch the browser's install offer as early as possible (before any other script) */window.__deferredInstallPrompt=window.__deferredInstallPrompt||null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__deferredInstallPrompt=e;document.documentElement.classList.add('pwa-ready');});window.addEventListener('appinstalled',function(){window.__deferredInstallPrompt=null;});</script>
    <title>Co-Pilot · Science Academy Staff</title>
    <link rel="icon" href="/admin/icon-192.png">
    <link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
    <link rel="manifest" href="/admin/admin-manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/student.css">
    <link rel="stylesheet" href="/assets/site.css">
    <link rel="stylesheet" href="/admin/assets/admin.css">
    <style>
        body.staff .main { padding-bottom: 0; }
        /* the composer is sticky above the phone's bottom nav — leave room under it so the last message is never hidden */
        .cp { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; min-height: calc(100dvh - var(--topbar-h) - 16px); padding-bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom, 0px) + 8px); }
        @media (min-width: 1024px) { .cp { min-height: calc(100dvh - var(--topbar-h) - 24px); padding-bottom: 0; } }

        /* header */
        .cp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .cp-head h1 { font-size: 20px; margin: 0; display: flex; align-items: center; gap: 8px; min-width: 0; }
        .cp-head h1 .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cp-head .grow { flex: 1; min-width: 0; }
        .cp-head .sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .spark { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; color: #fff;
            background: linear-gradient(135deg, var(--primary), #8b5cf6 60%, #ec4899); box-shadow: 0 6px 18px -6px color-mix(in srgb, var(--primary) 70%, transparent); }
        .spark .icon { width: 19px; height: 19px; }

        /* model switcher */
        .models { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--border); }
        .model { border: 0; background: transparent; color: var(--text); border-radius: 12px; padding: 7px 6px; text-align: center; cursor: pointer; font: inherit; line-height: 1.15; position: relative; }
        .model b { display: block; font-size: 13.5px; }
        .model small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .model.on { background: var(--surface); box-shadow: var(--shadow-sm, 0 1px 3px rgba(0,0,0,.08)); }
        .model.on b { color: var(--primary); }
        .model.off { opacity: .55; }
        .model .lock { position: absolute; top: 4px; right: 6px; width: 12px; height: 12px; opacity: .7; }

        /* usage meter */
        .meter { display: flex; gap: 12px; align-items: center; font-size: 11.5px; color: var(--muted); margin: 8px 2px 0; flex-wrap: wrap; }
        .meter .m { display: flex; align-items: center; gap: 6px; min-width: 0; }
        .meter .bar { width: 64px; height: 5px; border-radius: 9px; background: var(--surface-3); overflow: hidden; flex: none; }
        .meter .bar span { display: block; height: 100%; background: var(--primary); border-radius: 9px; transition: width .4s; }
        .meter .bar.warn span { background: var(--warning); } .meter .bar.full span { background: var(--danger); }

        /* messages */
        .msgs { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 16px 0 12px; }
        .msg { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; animation: msgIn .35s cubic-bezier(.22, 1, .36, 1); }
        @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }
        .msg .av { width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--primary), #8b5cf6); }
        .msg .av .icon { width: 16px; height: 16px; }
        .msg .body { min-width: 0; flex: 1; }
        .msg.me { justify-content: flex-end; }
        .msg.me .bubble { background: var(--primary); color: #fff; border-radius: 18px 18px 6px 18px; padding: 10px 14px; max-width: 85%; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.55; }
        .md { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
        .md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
        .md ul, .md ol { margin: 4px 0 8px; padding-inline-start: 22px; } .md li { margin: 2px 0; }
        .md h4 { font-size: 15.5px; margin: 10px 0 4px; }
        .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--surface-3); border-radius: 6px; padding: 1px 5px; }
        .md pre { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; overflow-x: auto; font-size: 13px; direction: ltr; text-align: left; }
        .md [dir="rtl"] { font-family: 'IBM Plex Sans Arabic', Inter, sans-serif; }
        .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
        .meta button { border: 0; background: transparent; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; padding: 2px 4px; border-radius: 6px; font: inherit; }
        .meta button:hover { color: var(--primary); background: var(--primary-soft); }
        .meta .icon { width: 13px; height: 13px; }
        .err { border: 1.5px solid color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-soft); color: var(--text); border-radius: 14px; padding: 10px 12px; font-size: 14px; }
        .err .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .dots span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); margin: 0 2px; animation: bounce 1.2s infinite ease-in-out; }
        .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-6px); opacity: 1; } }

        /* welcome */
        .hello { text-align: center; padding: 18px 6px 4px; }
        .hello .spark { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 10px; }
        .hello .spark .icon { width: 28px; height: 28px; }
        .hello h2 { margin: 0 0 4px; font-size: 21px; }
        .hello p { margin: 0 auto; color: var(--muted); max-width: 440px; font-size: 14px; }
        .chips { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 16px; text-align: start; }
        @media (min-width: 640px) { .chips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .chip-q { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 14px; padding: 11px 12px; font: inherit; font-size: 13.5px; text-align: start; cursor: pointer; display: flex; gap: 8px; align-items: flex-start; }
        .chip-q:hover { border-color: var(--primary); }
        .chip-q .e { font-size: 16px; line-height: 1.2; }
        .soon-list { margin: 18px auto 0; max-width: 520px; text-align: start; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 12px; }
        .soon-list b { color: var(--text); }

        /* composer */
        .composer { position: sticky; bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 5; background: linear-gradient(to top, var(--canvas, var(--bg)) 70%, transparent); padding: 10px 0 6px; }
        @media (min-width: 1024px) { .composer { bottom: 0; padding-bottom: 16px; } }
        .box { display: flex; align-items: flex-end; gap: 6px; padding: 6px; border-radius: 22px; background: var(--surface); border: 1.5px solid var(--border); box-shadow: 0 10px 30px -14px rgba(15, 23, 42, .35); }
        .box:focus-within { border-color: var(--primary); }
        .box textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit; font-size: 16px; line-height: 1.45; padding: 8px 6px 8px 10px; max-height: 160px; }
        .rbtn { width: 42px; height: 42px; border-radius: 15px; border: 0; display: grid; place-items: center; cursor: pointer; flex: none; color: var(--muted); background: transparent; }
        .rbtn:hover { color: var(--primary); background: var(--primary-soft); }
        .rbtn.send { background: var(--primary); color: #fff; }
        .rbtn.send:disabled { opacity: .45; cursor: default; }
        .rbtn.listening { background: var(--danger); color: #fff; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 55%, transparent); } 70% { box-shadow: 0 0 0 12px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
        .lang { font-size: 11px; font-weight: 800; width: 30px; height: 30px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); cursor: pointer; margin-bottom: 6px; flex: none; }
        .hint { font-size: 11px; color: var(--muted); text-align: center; margin-top: 5px; }

        /* chats sheet */
        .th { display: flex; gap: 8px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid transparent; }
        .th:hover { background: var(--surface-2); }
        .th.on { border-color: var(--primary); background: var(--primary-soft); }
        .th .open { flex: 1; min-width: 0; text-align: start; background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; }
        .th .open b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
        .th .open small { display: block; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
        .th .mini { width: 32px; height: 32px; border-radius: 9px; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; }
        .th .mini:hover { background: var(--surface-3); color: var(--text); }

        /* ---------- C1 data cards ---------- */
        .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
        .cards > *, .rows > *, .dc > * { min-width: 0; }
        .dc { border: 1px solid var(--border); background: var(--surface); border-radius: 18px; padding: 14px; min-width: 0; box-shadow: 0 6px 20px -16px rgba(15, 23, 42, .4); }
        .dc h5 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .dc .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 0; }
        .dc .sec { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
        .dc .sec-t { font-size: 12px; font-weight: 800; color: var(--text-2); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
        .dc .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .dc .acts .btn { flex: 1 1 auto; justify-content: center; }
        .shead { display: flex; gap: 12px; align-items: center; }
        .shead .ava { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 18px; background: var(--primary-soft); color: var(--primary); flex: none; }
        .shead .who { min-width: 0; flex: 1; }
        .shead .who b { display: block; font-size: 16.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .shead .big { text-align: end; flex: none; }
        .shead .big b { display: block; font-size: 24px; line-height: 1; }
        .shead .big small { font-size: 11.5px; }
        .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
        .stat { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; min-width: 0; }
        .stat small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
        .stat b { display: block; font-size: 17px; }
        .stat span { display: block; font-size: 11px; color: var(--muted); line-height: 1.35; }
        .warns { display: grid; gap: 6px; margin-top: 10px; }
        .warn { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 7px 10px; border-radius: 10px; background: var(--warning-soft); }
        .warn.danger { background: var(--danger-soft); }
        .res { display: flex; flex-wrap: wrap; gap: 6px; }
        .rchip { display: inline-flex; flex-direction: column; padding: 5px 9px; border-radius: 10px; background: var(--surface-2); font-size: 11.5px; min-width: 0; max-width: 100%; }
        .rchip b { font-size: 13px; }
        .rchip span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
        .rchip.excellent b { color: var(--success); } .rchip.good b { color: var(--primary); } .rchip.average b { color: var(--warning); } .rchip.weak b, .rchip.miss b { color: var(--danger); }
        .line { font-size: 13px; margin: 4px 0; overflow-wrap: anywhere; }
        .line .muted { color: var(--muted); }
        .rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
        .row { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-radius: 10px; min-width: 0; }
        .row:hover { background: var(--surface-2); }
        .row .rk { width: 26px; text-align: center; font-weight: 800; color: var(--muted); flex: none; font-size: 13px; }
        .row .nm { flex: 1; min-width: 0; text-align: start; background: transparent; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
        .row .nm b, .row .nm small, .qrow b, .qrow p { text-align: left; unicode-bidi: plaintext; }
        .row .nm b { display: block; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .row .nm small { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--muted); font-size: 11.5px; overflow: hidden; line-height: 1.35; }
        .row .pc { font-weight: 800; font-size: 14px; flex: none; }
        .row .wa { width: 34px; height: 34px; border-radius: 10px; border: 0; background: transparent; color: #16A34A; display: grid; place-items: center; cursor: pointer; flex: none; }
        .row .wa:hover { background: color-mix(in srgb, #16A34A 12%, transparent); }
        .more { border: 0; background: transparent; color: var(--primary); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 6px 4px; }
        .bitem { display: flex; gap: 10px; align-items: center; padding: 8px 0; min-width: 0; }
        .bitem + .bitem { border-top: 1px solid var(--border); }
        .bitem .e { font-size: 18px; flex: none; width: 26px; text-align: center; }
        .bitem .tx { flex: 1; min-width: 0; font-size: 13.5px; }
        .bitem .tx b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bitem .tx small { color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bitem .go { flex: none; }
        .bands { display: flex; height: 10px; border-radius: 9px; overflow: hidden; background: var(--surface-3); margin: 8px 0 4px; }
        .bands i { display: block; height: 100%; }
        .blegend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11.5px; color: var(--muted); }
        .blegend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-inline-end: 4px; }
        .qrow { display: block; padding: 8px 6px; border-radius: 10px; color: inherit; text-decoration: none; }
        .qrow:hover { background: var(--surface-2); }
        .qrow b { font-size: 13.5px; } .qrow small { color: var(--muted); font-size: 11.5px; }
        .qrow p { margin: 2px 0 0; font-size: 13px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ncard { font-size: 14px; }
        .ncard.warn { background: var(--warning-soft); border-color: transparent; }
        .ai-note { font-size: 11.5px; color: var(--muted); }
        .ucard { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--primary-soft); border-color: transparent; padding: 10px 12px; }
        .ucard .tx { flex: 1 1 200px; font-size: 13.5px; line-height: 1.6; }
        .ucard .btn { flex: none; }
        .hello .brief-wrap { text-align: start; margin-top: 14px; }
        @media (prefers-reduced-motion: reduce) { .msg, .dots span, .rbtn.listening { animation: none; } }
    </style>
</head>
<body class="site staff">
    <main class="main" id="main">
        <div class="cp">
            <div class="cp-head">
                <span class="spark" data-icon="sparkles"></span>
                <div class="grow"><h1><span class="t" id="title">Co-Pilot</span></h1><p class="sub" id="sub">Your private assistant</p></div>
                <button class="icon-btn" id="chatsBtn" aria-label="Saved chats" title="Saved chats"><span data-icon="clock"></span></button>
                <button class="icon-btn" id="newBtn" aria-label="New chat" title="New chat"><span data-icon="plus"></span></button>
            </div>
            <div class="models" id="models" role="radiogroup" aria-label="Model"></div>
            <div class="meter" id="meter"></div>
            <div class="msgs" id="msgs" aria-live="polite"></div>
            <div class="composer">
                <div class="box">
                    <textarea id="input" rows="1" maxlength="4000" dir="auto" placeholder="اكتبي سؤالك… · Ask anything"></textarea>
                    <button class="lang" id="langBtn" title="Voice language" hidden>ع</button>
                    <button class="rbtn" id="micBtn" aria-label="Speak" title="Speak" hidden><span data-icon="mic"></span></button>
                    <button class="rbtn send" id="sendBtn" aria-label="Send" disabled><span data-icon="send"></span></button>
                </div>
                <p class="hint" id="hint">Co-Pilot can make mistakes — check anything important before using it.</p>
            </div>
        </div>
    </main>

    <script src="/assets/pwa.js"></script>
    <script src="/assets/site.js"></script>
    <script src="/admin/assets/admin.js"></script>
    <script>
    (async function () {
        const A = Admin, $ = (id) => document.getElementById(id);
        const { esc, icon, api } = A;
        await A.boot({ active: 'copilot', title: 'Co-Pilot' });
        A.hydrate();

        const qs = new URLSearchParams(location.search);
        let STATUS = null, threadId = parseInt(qs.get('chat'), 10) || null, MSGS = [], sending = false;
        let tier = A.store.get('copilot_tier', 'free');

        // ---------- text rendering: safe markdown subset + clean Arabic/English mixing ----------
        const AR = /[؀-ۿ]/, LAT = /[A-Za-z]/;
        const firstStrong = (s) => { for (const ch of s) { if (AR.test(ch)) return 'rtl'; if (LAT.test(ch)) return 'ltr'; } return 'auto'; };
        // inside an Arabic paragraph, every English run (terms, symbols, equations) is isolated so punctuation never jumps
        const isolate = (escaped, dir) => dir !== 'rtl' ? escaped
            : escaped.replace(/([A-Za-z0-9][A-Za-z0-9 _.,:;'’()\[\]\/+\-−×÷=^%°⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉→&;#]*[A-Za-z0-9)\]⁰¹²³⁴⁵⁶⁷⁸⁹₀₁₂₃₄₅₆₇₈₉%°])|([A-Za-z])/g, (m) => /&[a-z]+;?$|&#\d+;?$/.test(m) ? m : `<bdi dir="ltr">${m}</bdi>`);
        function inline(text, dir) {
            // **bold**, `code`; everything escaped first, English runs isolated in Arabic text
            return text.split(/(`[^`]+`)/).map(part => {
                if (/^`[^`]+`$/.test(part)) return `<code dir="ltr">${esc(part.slice(1, -1))}</code>`;
                return part.split(/(\*\*[^*]+\*\*)/).map(p => {
                    const bold = /^\*\*[^*]+\*\*$/.test(p);
                    const t = isolate(esc(bold ? p.slice(2, -2) : p).replace(/&amp;/g, '&amp;'), dir);
                    return bold ? `<b>${t}</b>` : t;
                }).join('');
            }).join('');
        }
        function md(src) {
            const lines = String(src || '').replace(/\r/g, '').split('\n');
            let html = '', list = null, para = [], code = null;
            const flushPara = () => { if (para.length) { const t = para.join('\n'); const d = firstStrong(t); html += `<p dir="${d}">${inline(t, d).replace(/\n/g, '<br>')}</p>`; para = []; } };
            const flushList = () => { if (list) { html += `<${list.type}>${list.items.map(it => { const d = firstStrong(it); return `<li dir="${d}">${inline(it, d)}</li>`; }).join('')}</${list.type}>`; list = null; } };
            for (const line of lines) {
                if (code !== null) { if (/^```/.test(line.trim())) { html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = null; } else code.push(line); continue; }
                if (/^```/.test(line.trim())) { flushPara(); flushList(); code = []; continue; }
                const h = line.match(/^\s*#{1,6}\s+(.*)$/);
                const ul = line.match(/^\s*[-*•]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
                if (h) { flushPara(); flushList(); const d = firstStrong(h[1]); html += `<h4 dir="${d}">${inline(h[1].replace(/\*\*/g, ''), d)}</h4>`; }
                else if (ul || ol) { flushPara(); const type = ul ? 'ul' : 'ol'; if (!list || list.type !== type) { flushList(); list = { type, items: [] }; } list.items.push((ul || ol)[1]); }
                else if (!line.trim()) { flushPara(); flushList(); }
                else { flushList(); para.push(line); }
            }
            if (code !== null) html += `<pre><code>${esc(code.join('\n'))}</code></pre>`;
            flushPara(); flushList();
            return html;
        }
        window.__copilotMd = md;   // for tests

        // ---------- status, models, meter ----------
        const money = (v) => v >= 0.995 ? `$${v.toFixed(2)}` : v >= 0.01 ? `$${v.toFixed(2)}` : v > 0 ? '<$0.01' : '$0';
        function renderModels() {

        function renderMeter() {
            if (!STATUS) return;

                ${STATUS.paidReady ? `<span class="m" title="Paid AI spend today / this month"><b>Krypton</b><span class="bar ${cls(sf)}"><span style="width:${sf}%"></span></span>${money(s.today)} today · ${money(s.month)} this month</span>` : ''}`;
        }
        async function loadStatus() { try { STATUS = await api('/api/copilot?action=status'); } catch (e) { STATUS = null; } renderModels(); renderMeter(); }
        $('models').addEventListener('click', (e) => {

        });

        // ---------- messages ----------

        // ---------- data cards (exact numbers from the platform — the AI never writes these) ----------

        const CARDS = {};   // "msgIndex:cardIndex" → card (for buttons)
        function cardsHTML(cards, mi) {

            return `<div class="cards">${cards.map((c, ci) => { const k = `${mi}:${ci}`; CARDS[k] = c; return (CARD[c.type] || CARD.note)(c, k); }).join('')}</div>`;
        }
        const rowHTML = (r, k, list, idx, right = '') => `<div class="row"><button class="nm" data-student="${esc(r.studentId)}"><b dir="auto">${esc(r.name)}</b>${r.sub ? `<small dir="auto">${r.sub}</small>` : ''}</button>${right}${r.parentPhone ? `<button class="wa" data-wa-row="${k}|${list}|${idx}" aria-label="WhatsApp parent" title="WhatsApp parent">${icon('whatsapp')}</button>` : ''}</div>`;
        function listBlock(rows, k, list, opts = {}) {

                const sub = r.reasons ? r.reasons.map(x => esc(x.text)).join(' · ') : r.note ? esc(r.note) : r.gradeLabel ? `${esc(r.gradeLabel)}${r.branchLabel ? ' · ' + esc(r.branchLabel) : ''}` : '';
                const right = r.pct !== undefined && r.pct !== null ? `<span class="pc lvl ${lvl(r.pct)}">${pc(r.pct)}</span>` : '';
                const rank = r.rank ? `<span class="rk">#${r.rank}</span>` : '';
                return `<div ${i >= limit ? 'hidden data-extra' : ''}>${rank ? rowHTML({ ...r, sub }, k, list, i, right).replace('<div class="row">', `<div class="row">${rank}`) : rowHTML({ ...r, sub }, k, list, i, right)}</div>`;

        }
        const CARD = {
            upgrade: (c, k) => {
                const ready = !STATUS || (STATUS.tiers || []).some(t => t.tier === 'pro' && t.ready);
                const mi = Number(String(k).split(':')[0]), next = MSGS[mi + 1];
                if (next && next.role === 'assistant' && next.tier && next.tier !== 'free') return `<div class="dc ucard"><span class="tx">✅ Krypton answered this below 👇</span></div>`;
                return `<div class="dc ucard"><span class="tx" dir="rtl">${md(c.text).replace(/^<p[^>]*>|<\/p>$/g, '')}</span><button class="btn btn-ai btn-sm" data-upgrade="${k}">${icon(ready ? 'sparkles' : 'lock', 'sm')}${ready ? 'Ask Krypton' : 'Krypton (not connected)'}</button></div>`;
            },
            note: (c) => `<div class="dc ncard ${c.tone === 'warn' ? 'warn' : ''}" dir="auto">${esc(c.text || '')}</div>`,
            student(c, k) {
                const st = c.student, sm = c.summary;
                const recent = c.recent.map(r => { const miss = r.status !== 'taken'; return `<span class="rchip ${miss ? 'miss' : lvl(r.pct)}"><b>${miss ? (r.status === 'absent' ? 'Absent' : 'Missed') : pc(r.pct)}</b><span dir="auto">${esc(r.name)}</span></span>`; }).join('');
                const warns = [...c.reasons.map(r => `<div class="warn">⚠️ <span>${esc(r.text)}</span></div>`), ...c.flags.map(f => `<div class="warn ${f.level === 'danger' ? 'danger' : ''}">🔎 <span>${esc(f.exam)}: ${esc(f.text)}</span></div>`)].join('');
                return `<div class="dc scard" data-id="${esc(st.id)}">
                    <div class="shead"><span class="ava">${esc(String(st.name).charAt(0).toUpperCase())}</span><div class="who"><b dir="auto">${esc(st.name)}</b><span class="sub">${esc(st.gradeLabel)} · ${esc(st.branchLabel)}${st.group ? ' · ' + esc(st.group) : ''} · ${esc(st.id)}</span></div>
                    <div class="big"><b class="lvl ${lvl(sm.combinedPct)}">${pc(sm.combinedPct)}</b><small class="lvl ${sm.level || ''}">${esc(sm.level ? A.LEVEL_LABEL[sm.level] : 'Not enough exams')}</small></div></div>
                    <div class="stats"><div class="stat"><small>Center</small><b>${pc(sm.centerPct)}</b><span>${sm.centerTaken} exams · ${sm.centerAbsent} absent</span></div>
                        <div class="stat"><small>Online</small><b>${pc(sm.onlinePct)}</b><span>${sm.onlineTaken} done · ${sm.onlineMissed} missed</span></div>
                        <div class="stat"><small>Rank</small><b>${sm.combinedRank ? '#' + sm.combinedRank : '—'}</b><span>${sm.combinedRank ? 'of ' + sm.gradeSize : 'not ranked yet'}</span></div></div>
                    ${warns ? `<div class="warns">${warns}</div>` : ''}
                    ${recent ? `<div class="sec"><p class="sec-t">Latest results</p><div class="res">${recent}</div></div>` : ''}
                    ${c.missedOnline.length || c.absences.length || c.openNow.length ? `<div class="sec">
                        ${c.openNow.length ? `<p class="line">⏳ <b>Not done yet:</b> <span dir="auto">${c.openNow.map(o => esc(o.name)).join('، ')}</span></p>` : ''}
                        ${c.missedOnline.length ? `<p class="line">📵 <b>Missed online:</b> <span dir="auto">${c.missedOnline.map(o => esc(o.name)).join('، ')}</span></p>` : ''}

                        ${c.questions.recent.slice(0, 3).map(q => `<a class="qrow" href="/admin/inbox.html?q=${q.id}"><b>Unit ${q.unit} · Lesson ${q.lesson}</b> <small>${esc(q.status)} · ${ago(q.at)}</small><p dir="auto">${esc(q.text) || '📷 / 🎤'}</p></a>`).join('') || '<p class="line muted">No questions yet</p>'}</div>
                    <div class="acts"><a class="btn btn-soft btn-sm" href="/admin/student.html?id=${encodeURIComponent(st.id)}">${icon('user', 'sm')}Open profile</a>
                        ${st.parentPhone ? `<button class="btn btn-wa btn-sm" data-wa="parent" data-k="${k}">${icon('whatsapp', 'sm')}Parent</button>` : ''}
                        ${st.phone ? `<button class="btn btn-ghost btn-sm" data-wa="student" data-k="${k}">${icon('whatsapp', 'sm')}Student</button>` : ''}</div></div>`;
            },
            pick: (c, k) => `<div class="dc pcard"><h5>👥 Which one?</h5><p class="sub">${c.total} students match — tap the one you mean</p><div class="rows" style="margin-top:8px">${c.rows.map(r => `<div class="row"><button class="nm" data-student="${esc(r.studentId)}"><b dir="auto">${esc(r.name)}</b><small>${esc(r.gradeLabel)}${r.branchLabel ? ' · ' + esc(r.branchLabel) : ''} · ${esc(r.studentId)}</small></button>${icon('chevronRight', 'sm')}</div>`).join('')}</div></div>`,
            list(c, k) {

                    ${c.extra && c.extra.rows && c.extra.rows.length ? `<div class="sec"><p class="sec-t">${esc(c.extra.title)}</p>${listBlock(c.extra.rows, k, 'extra.rows', { limit: 5 })}</div>` : ''}
                    <div class="acts"><a class="btn btn-ghost btn-sm" href="/admin/analytics.html">${icon('chart', 'sm')}Open analytics</a></div></div>`;
            },
            inbox: (c) => `<div class="dc icard"><h5>🙋 ${c.total} question${c.total === 1 ? '' : 's'} waiting</h5><p class="sub">${Object.entries(c.waiting).filter(([, v]) => v).map(([g, v]) => `${GL[g]}: ${v}`).join(' · ') || 'All answered 🎉'}</p>
                ${c.sections.map(sct => sct.rows.length ? `<div class="sec"><p class="sec-t">${esc(sct.gradeLabel)} · oldest first</p>${sct.rows.map(q => `<a class="qrow" href="/admin/inbox.html?q=${q.id}"><b dir="auto">${esc(q.name)}</b> <small>Unit ${q.unit} · Lesson ${q.lesson} · waiting ${ago(q.waitingSince)}</small><p dir="auto">${esc(q.text) || '📷 / 🎤'}</p></a>`).join('')}</div>` : '').join('')}
                <div class="acts"><a class="btn btn-soft btn-sm" href="/admin/inbox.html">${icon('inbox', 'sm')}Open inbox</a></div></div>`,
            exams: (c) => `<div class="dc xcard"><h5>📊 Exams · ${esc(c.gradeLabel)}</h5>
                ${c.online.length ? `<div class="sec" style="border:0;padding-top:0"><p class="sec-t">Online</p>${c.online.map(e => `<div class="bitem"><span class="e">${e.closed ? '✅' : '⏳'}</span><div class="tx"><b dir="auto">${esc(e.name)}</b><small>${e.completed}/${e.eligible} done · avg ${pc(e.avg)} · ${e.notTaken} ${e.closed ? 'missed' : 'not yet'}</small></div><button class="btn btn-soft btn-sm go" data-ctx='${esc(JSON.stringify({ type: 'exam', id: e.id }))}'>Details</button></div>`).join('')}</div>` : ''}
                ${c.center.length ? `<div class="sec"><p class="sec-t">Center</p>${c.center.map(e => `<div class="bitem"><span class="e">📝</span><div class="tx"><b dir="auto">${esc(e.name)}</b><small>${esc(e.date)} · ${e.completed} marked · avg ${pc(e.avg)} · ${e.absent} absent</small></div></div>`).join('')}</div>` : ''}</div>`,
            exam(c, k) {
                const b = c.bands, tot = Math.max(1, b.excellent + b.good + b.average + b.weak);
                const col = { excellent: 'var(--success)', good: 'var(--primary)', average: 'var(--warning)', weak: 'var(--danger)' };
                return `<div class="dc ecard"><h5>📊 ${esc(c.exam.title)}</h5><p class="sub">${esc(c.exam.gradeLabel)} · ${c.exam.total} marks · ${c.exam.closed ? 'closed' : 'open until ' + esc(A.fmtDate ? A.fmtDate(c.exam.expiresAt) : c.exam.expiresAt)}</p>
                    <div class="stats"><div class="stat"><small>Submitted</small><b>${c.completed}/${c.eligible}</b></div><div class="stat"><small>Average</small><b class="lvl ${lvl(c.avg)}">${pc(c.avg)}</b></div><div class="stat"><small>${c.exam.closed ? 'Missed' : 'Not yet'}</small><b>${c.missing.length}</b></div></div>
                    <div class="bands">${Object.keys(col).map(x => b[x] ? `<i style="width:${b[x] / tot * 100}%;background:${col[x]}"></i>` : '').join('')}</div>

                    ${c.top.length ? `<div class="sec"><p class="sec-t">Top</p>${listBlock(c.top, k, 'top', { limit: 5 })}</div>` : ''}
                    ${c.low.length ? `<div class="sec"><p class="sec-t">Under 60%</p>${listBlock(c.low, k, 'low', { limit: 5, waAll: true })}</div>` : ''}
                    ${c.missing.length ? `<div class="sec"><p class="sec-t">${c.exam.closed ? 'Missed it' : 'Not submitted yet'}</p>${listBlock(c.missing, k, 'missing', { limit: 6, waAll: true })}</div>` : ''}
                    <div class="acts"><a class="btn btn-soft btn-sm" href="/admin/results.html?exam=${encodeURIComponent(c.exam.id)}">${icon('chart', 'sm')}Open results</a></div></div>`;
            },
            brief(c) {
                const items = [];
                c.closing.forEach(e => items.push(`<div class="bitem"><span class="e">⏰</span><div class="tx"><b dir="auto">${esc(e.name)} · ${esc(e.gradeLabel)}</b><small>Closes ${esc(A.timeLeft ? A.timeLeft(e.expiresAt) : '')} · ${e.completed}/${e.eligible} done · ${e.left} not yet</small></div><button class="btn btn-soft btn-sm go" data-ctx='${esc(JSON.stringify({ type: 'exam', id: e.id }))}'>Who?</button></div>`));
                c.closed.forEach(e => items.push(`<div class="bitem"><span class="e">✅</span><div class="tx"><b dir="auto">${esc(e.name)} · ${esc(e.gradeLabel)}</b><small>Closed · ${e.completed}/${e.eligible} took it · ${e.left} missed</small></div><button class="btn btn-soft btn-sm go" data-ctx='${esc(JSON.stringify({ type: 'exam', id: e.id }))}'>Results</button></div>`));
                if (c.waitingTotal) items.push(`<div class="bitem"><span class="e">🙋</span><div class="tx"><b>${c.waitingTotal} question${c.waitingTotal === 1 ? '' : 's'} waiting</b><small>${Object.entries(c.waiting).filter(([, v]) => v).map(([g, v]) => `${GL[g]}: ${v}`).join(' · ')}${c.oldest ? ` · oldest: ${esc(c.oldest.name)}, ${ago(c.oldest.since)}` : ''}</small></div><button class="btn btn-soft btn-sm go" data-ctx='${esc(JSON.stringify({ type: 'inbox' }))}'>Show</button></div>`);
                c.attention.filter(a => a.count).forEach(a => items.push(`<div class="bitem"><span class="e">⚠️</span><div class="tx"><b>${a.count} need attention · ${esc(a.gradeLabel)}</b><small dir="auto">${a.names.map(esc).join('، ')}${a.count > a.names.length ? '…' : ''}</small></div><button class="btn btn-soft btn-sm go" data-ctx='${esc(JSON.stringify({ type: 'attention', grade: a.grade }))}'>Who?</button></div>`));
                if (c.newSignups) items.push(`<div class="bitem"><span class="e">👋</span><div class="tx"><b>${c.newSignups} new sign-up${c.newSignups === 1 ? '' : 's'} this week</b></div></div>`);
                return `<div class="dc brief"><h5>☀️ Today at a glance</h5><p class="sub">${new Date(c.date).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
                    <div style="margin-top:6px">${items.join('') || '<p class="line">Everything is calm today ✨ No exams closing, no questions waiting.</p>'}</div></div>`;

        };

        // ---------- WhatsApp (her house format; she reviews and presses Send in WhatsApp) ----------
        const HELLO = 'السلام عليكم — تيم مس مروة 👋', BYE = 'برجاء المتابعة.';
        const fem = (r) => r && r.gender === 'female';
        const REASON_AR = { falling: (f) => `${f ? 'درجاتها' : 'درجاته'} نزلت في آخر امتحانين`, missing: (f) => `${f ? 'فاتها' : 'فاته'} أكتر من امتحان الفترة اللي فاتت`, weak: (f) => `متوسط ${f ? 'درجاتها' : 'درجاته'} أقل من 50%` };
        function waTextFor(card, list, r) {
            const name = r.name;
            if (card.type === 'list' && card.kind === 'attention') {
                const rs = (r.reasons || []).map(x => REASON_AR[x.code] && REASON_AR[x.code](fem(r))).filter(Boolean);
                return `${HELLO}\nبنتابع مع حضرتك مستوى ${name} في العلوم${rs.length ? ' — لاحظنا إن ' + rs.join(' وإن ') : ''}${r.pct != null ? ` (المتوسط الحالي ${pc(r.pct)})` : ''}.\n${BYE}`;
            }
            if (card.type === 'list' && card.kind === 'absent') {
                const sec = list === 'rows' ? card.subtitle : list.startsWith('sections.') ? card.sections[Number(list.split('.')[1])].title : null;
                return `${HELLO}\nبنبلغ حضرتك إن ${name} ${list === 'extra.rows' ? `${fem(r) ? 'غابت' : 'غاب'} عن أكتر من امتحان في السنتر مؤخراً (${r.note.replace('Absent ', '').replace(' of last ', ' من آخر ')})` : `${fem(r) ? 'كانت غايبة' : 'كان غايب'} في امتحان ${sec ? sec.split(' · ')[0] : 'السنتر'}${sec && sec.includes(' · ') ? ' يوم ' + sec.split(' · ')[1] : ''}`}.\n${BYE}`;
            }
            if (card.type === 'list' && card.kind === 'top') return `${HELLO}\nبنهنّي حضرتك — ${name} من الأوائل في ${card.gradeLabel} في العلوم 🎉${r.pct != null ? ` بمتوسط ${pc(r.pct)}` : ''}.\n${BYE}`;
            if (card.type === 'exam') {
                if (list === 'missing') return card.exam.closed ? `${HELLO}\nبنبلغ حضرتك إن ${name} ${fem(r) ? 'ماحلّتش' : 'ماحلّش'} امتحان «${card.exam.title}» الأونلاين، والامتحان اتقفل.\n${BYE}` : `${HELLO}\nبنفكّر حضرتك إن ${name} لسه ${fem(r) ? 'ماحلّتش' : 'ماحلّش'} امتحان «${card.exam.title}» الأونلاين، وآخر ميعاد ${A.fmtDate ? A.fmtDate(card.exam.expiresAt) : card.exam.expiresAt}.\n${BYE}`;
                return `${HELLO}\nنتيجة ${name} في امتحان «${card.exam.title}»: ${r.score}/${card.exam.total} (${pc(r.pct)}).\n${BYE}`;
            }
            return `${HELLO}\nبخصوص ${name}.\n${BYE}`;
        }
        function waStudent(card, who) {
            const st = card.student, sm = card.summary, f = st.gender === 'female';
            const lines = [];
            if (sm.combinedPct != null) lines.push(`• المتوسط في العلوم: ${pc(sm.combinedPct)}${sm.combinedRank ? ` (الترتيب ${sm.combinedRank} من ${sm.gradeSize})` : ''}`);
            const last = card.recent.find(r => r.status === 'taken'); if (last) lines.push(`• آخر امتحان (${last.name}): ${pc(last.pct)}`);
            if (card.missedOnline.length) lines.push(`• امتحانات أونلاين ${f ? 'فاتتها' : 'فاتته'}: ${card.missedOnline.map(m => m.name).join('، ')}`);
            if (card.absences.length) lines.push(`• ${f ? 'غابت' : 'غاب'} عن: ${card.absences.map(a => a.name).join('، ')}`);
            if (card.openNow.length) lines.push(`• لسه ${f ? 'ماحلّتش' : 'ماحلّش'}: ${card.openNow.map(o => o.name).join('، ')}`);
            const body = who === 'parent' ? `بنطمّن حضرتك على مستوى ${st.name} في العلوم:` : `أهلاً يا ${st.name.split(' ')[0]}، ده ملخص مستواك في العلوم:`;
            return `${HELLO}\n${body}\n${lines.join('\n')}\n${BYE}`;
        }
        const getList = (card, path) => path.split('.').reduce((o, k) => o && o[k], card) || [];
        function waOpen(list, makeText, title) { A.sender({ list, makeText, title, kind: 'other' }); }

        function msgHTML(m, i) {
            if (m.role === 'user') return `<div class="msg me"><div class="bubble" dir="auto">${esc(m.text)}</div></div>`;
            if (m.role === 'error') {
                const other = m.tier === 'free' ? (STATUS && STATUS.paidReady ? 'pro' : null) : 'free';
                return `<div class="msg"><span class="av">${icon('sparkles')}</span><div class="body"><div class="err" dir="auto">${esc(m.text)}
                    <div class="acts">${i === MSGS.length - 1 ? `<button class="btn btn-soft btn-sm" data-retry>${icon('refresh', 'sm')}Try again</button>${other ? `<button class="btn btn-ghost btn-sm" data-retry="${other}">Use ${esc((STATUS && STATUS.brands[other] || {}).name || other)}</button>` : ''}` : ''}</div></div></div></div>`;
            }
            if (m.role === 'typing') return `<div class="msg" id="typing"><span class="av">${icon('sparkles')}</span><div class="body"><span class="dots"><span></span><span></span><span></span></span></div></div>`;
            const secs = m.ms ? `${(m.ms / 1000).toFixed(1)} s` : '';
            const cost = m.costUsd != null ? ` · ${m.costUsd < 0.001 ? '<$0.001' : '$' + m.costUsd.toFixed(3)}` : m.neurons != null ? ` · ${Math.round(m.neurons)} free units` : '';
            return `<div class="msg"><span class="av">${icon('sparkles')}</span><div class="body"><div class="md">${md(m.text)}</div>${cardsHTML(m.cards, i)}
                <div class="meta"><span>${m.error ? 'Data only' : esc(m.brand || '')}${secs ? ' · ' + secs : ''}${cost}</span><button data-copy="${i}" title="Copy">${icon('copy2')}Copy</button></div></div></div>`;
        }
        function render(scroll = true) {
            $('msgs').innerHTML = MSGS.length ? MSGS.map(msgHTML).join('') : welcome();
            if (scroll) requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
        }
        $('msgs').addEventListener('click', async (e) => {
            const c = e.target.closest('[data-chip]'); if (c) { $('input').value = c.dataset.chip; autosize(); $('input').focus(); updateSend(); return; }
            const up = e.target.closest('[data-upgrade]');
            if (up) {
                const t = STATUS && STATUS.tiers.find(x => x.tier === 'pro');
                if (t && !t.ready) { Site.sheet({ iconName: 'lock', title: "Krypton isn't connected yet", subtitle: 'Add the ANTHROPIC_API_KEY secret in Cloudflare (Settings → Variables and Secrets), then redeploy.', actions: [{ label: 'OK', cls: 'btn-ghost' }] }); return; }
                const mi = Number(up.dataset.upgrade.split(':')[0]);
                const q = MSGS.slice(0, mi).reverse().find(m => m.role === 'user');
                if (q) { tier = 'pro'; A.store.set('copilot_tier', tier); renderModels(); send(q.text, false, null, true); }
                return;
            }
            const stu = e.target.closest('[data-student]'); if (stu) { send('', false, { type: 'student', id: stu.dataset.student }); return; }
            const cx = e.target.closest('[data-ctx]'); if (cx) { try { send('', false, JSON.parse(cx.dataset.ctx)); } catch (x) { } return; }
            const mo = e.target.closest('[data-more]'); if (mo) { mo.previousElementSibling.querySelectorAll('[data-extra]').forEach(el => el.hidden = false); mo.remove(); return; }
            const wa = e.target.closest('[data-wa]');
            if (wa) { const card = CARDS[wa.dataset.k]; const st = card.student; waOpen([{ studentId: st.id, firstName: st.name, lastName: '', parentPhone: wa.dataset.wa === 'parent' ? st.parentPhone : st.phone }], () => waStudent(card, wa.dataset.wa), wa.dataset.wa === 'parent' ? `WhatsApp · ${st.name}'s parent` : `WhatsApp · ${st.name}`); return; }
            const wr = e.target.closest('[data-wa-row]');
            if (wr) { const [k, path, idx] = wr.dataset.waRow.split('|'); const card = CARDS[k]; const r = getList(card, path)[Number(idx)]; waOpen([{ ...r, firstName: r.name, lastName: '' }], () => waTextFor(card, path, r), `WhatsApp · ${r.name}'s parent`); return; }
            const wl = e.target.closest('[data-wa-all]');
            if (wl) { const [k, path] = wl.dataset.waAll.split('|'); const card = CARDS[k]; const rows = getList(card, path).filter(r => r.parentPhone); waOpen(rows.map(r => ({ ...r, firstName: r.name, lastName: '' })), (s2) => waTextFor(card, path, rows.find(r => r.studentId === s2.studentId)), `WhatsApp · ${rows.length} parents`); return; }
            const cp = e.target.closest('[data-copy]');
            if (cp) { try { await navigator.clipboard.writeText(MSGS[Number(cp.dataset.copy)].text); Site.toast('Copied', 'success'); } catch (x) { Site.toast('Copy failed', 'error'); } return; }
            const r = e.target.closest('[data-retry]');
            if (r) { if (r.dataset.retry) { tier = r.dataset.retry; A.store.set('copilot_tier', tier); renderModels(); } const lastUser = [...MSGS].reverse().find(m => m.role === 'user'); if (lastUser) send(lastUser.ctx ? '' : lastUser.text, true, lastUser.ctx || null); }
        });

        async function send(text, resend = false, context = null, again = false) {
            text = String(text || '').trim(); if ((!text && !context) || sending) return;
            sending = true; updateSend();
            if (resend) MSGS = MSGS.filter(m => m.role !== 'error'); else if (!again) MSGS.push({ role: 'user', text: text || '…', ctx: context });
            MSGS.push({ role: 'typing' });
            render();
            try {
                const r = await api('/api/copilot?action=send', { body: { threadId, text, tier, resend, context, again } });
                threadId = r.threadId; setChatUrl(); setTitle(r.title);
                const u = [...MSGS].reverse().find(m => m.role === 'user'); if (u && r.user && !again) u.text = r.user.text;
                MSGS = MSGS.filter(m => m.role !== 'typing'); MSGS.push(r.reply);
                if (r.usage) { STATUS = { ...STATUS, ...r.usage }; renderMeter(); }
            } catch (err) {
                const d = err.data || {};
                if (d.threadId) { threadId = d.threadId; setChatUrl(); setTitle(d.title); }
                if (d.usage && STATUS) { STATUS = { ...STATUS, ...d.usage }; renderMeter(); }
                const u = [...MSGS].reverse().find(m => m.role === 'user'); if (u && d.user) u.text = d.user.text;
                MSGS = MSGS.filter(m => m.role !== 'typing'); MSGS.push({ role: 'error', text: err.message, tier, code: d.code });
            }
            sending = false; updateSend(); render();
        }
        function setChatUrl() { history.replaceState(null, '', location.pathname + (threadId ? '?chat=' + threadId : '')); }
        function setTitle(t) { $('title').textContent = t || 'Co-Pilot'; $('sub').textContent = threadId ? 'Saved chat' : 'Your private assistant'; }
        async function openChat(id) {
            threadId = id; setChatUrl();
            MSGS = []; $('msgs').innerHTML = '<div class="skel" style="height:180px;border-radius:16px"></div>';
            try { const d = await api(`/api/copilot?action=thread&id=${id}`); MSGS = d.messages; setTitle(d.thread.title); }
            catch (e) { threadId = null; setChatUrl(); setTitle(); Site.toast(e.message, 'error'); }
            render();
        }
        function newChat() { threadId = null; MSGS = []; setChatUrl(); setTitle(); render(false); loadBrief(); }
        $('newBtn').addEventListener('click', newChat);

        // ---------- saved chats ----------
        $('chatsBtn').addEventListener('click', async () => {
            let list = [];
            try { list = (await api('/api/copilot?action=threads')).threads; } catch (e) { Site.toast(e.message, 'error'); return; }
            const html = list.length ? `<div class="stack" style="gap:2px;max-height:60vh;overflow:auto" id="thList">${list.map(t => `<div class="th ${t.id === threadId ? 'on' : ''}" data-th="${t.id}">
                <button class="open" data-open="${t.id}"><b dir="auto">${esc(t.title)}</b><small dir="auto">${esc(t.last || '')}</small></button>
                <button class="mini" data-rename="${t.id}" aria-label="Rename">${icon('edit', 'sm')}</button><button class="mini" data-del="${t.id}" aria-label="Delete">${icon('trash', 'sm')}</button></div>`).join('')}</div>`
                : '<p class="muted" style="margin:0">No saved chats yet — start one below.</p>';
            const close = Site.sheet({ iconName: 'clock', title: 'Saved chats', html, actions: [{ label: 'New chat', cls: 'btn-primary', onClick: (c) => { c(); newChat(); } }] });
            const box = document.getElementById('thList'); if (!box) return;
            box.addEventListener('click', async (e) => {
                const o = e.target.closest('[data-open]'); if (o) { close(); openChat(Number(o.dataset.open)); return; }
                const rn = e.target.closest('[data-rename]');
                if (rn) { const t = list.find(x => x.id === Number(rn.dataset.rename)); const name = prompt('Name this chat', t.title); if (name && name.trim()) { try { await api('/api/copilot?action=rename', { body: { id: t.id, title: name } }); t.title = name.trim(); rn.closest('.th').querySelector('b').textContent = t.title; if (t.id === threadId) setTitle(t.title); } catch (x) { Site.toast(x.message, 'error'); } } return; }
                const dl = e.target.closest('[data-del]');
                if (dl) { const id = Number(dl.dataset.del); try { await api('/api/copilot?action=delete', { body: { id } }); dl.closest('.th').remove(); if (id === threadId) newChat(); Site.toast('Chat deleted', 'success'); } catch (x) { Site.toast(x.message, 'error'); } }
            });
        });

        // ---------- composer ----------
        const input = $('input');
        function autosize() { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; }
        function updateSend() { $('sendBtn').disabled = sending || !input.value.trim(); }
        input.addEventListener('input', () => { autosize(); updateSend(); });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover: hover) and (pointer: fine)').matches) { e.preventDefault(); go(); }
        });
        function go() { const t = input.value; if (!t.trim() || sending) return; input.value = ''; autosize(); updateSend(); send(t); }
        $('sendBtn').addEventListener('click', go);

        // ---------- voice (the phone's own speech recognition — free) ----------
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec = null, listening = false, voiceLang = A.store.get('copilot_voice', 'ar-EG');
        if (SR) {
            $('micBtn').hidden = false; $('langBtn').hidden = false;
            const setLang = () => { $('langBtn').textContent = voiceLang === 'ar-EG' ? 'ع' : 'EN'; $('langBtn').title = voiceLang === 'ar-EG' ? 'Speaking Arabic — tap for English' : 'Speaking English — tap for Arabic'; };
            setLang();
            $('langBtn').addEventListener('click', () => { voiceLang = voiceLang === 'ar-EG' ? 'en-US' : 'ar-EG'; A.store.set('copilot_voice', voiceLang); setLang(); });
            $('micBtn').addEventListener('click', () => {
                if (listening) { rec && rec.stop(); return; }
                rec = new SR(); rec.lang = voiceLang; rec.interimResults = true; rec.continuous = false;
                const before = input.value ? input.value.replace(/\s*$/, ' ') : '';
                rec.onresult = (ev) => { let t = ''; for (const r of ev.results) t += r[0].transcript; input.value = before + t; autosize(); updateSend(); };
                rec.onerror = (ev) => { if (ev.error === 'not-allowed') Site.toast('Allow the microphone to use voice', 'error'); };
                rec.onend = () => { listening = false; $('micBtn').classList.remove('listening'); input.focus(); };
                try { rec.start(); listening = true; $('micBtn').classList.add('listening'); } catch (e) { Site.toast('Voice is not available here', 'error'); }
            });
        }

        // ---------- start ----------
        await loadStatus();
        // ✨ buttons on other pages open the Co-Pilot with ?ctx=student:ID | exam:ID | inbox:grade | brief
        const ctxParam = qs.get('ctx');
        if (ctxParam) {
            const [type, ...rest] = ctxParam.split(':'); const val = rest.join(':');
            const context = type === 'inbox' ? { type, grade: val || null } : type === 'brief' ? { type } : { type, id: val };
            threadId = null; MSGS = []; history.replaceState(null, '', location.pathname);
            send('', false, context);
        } else if (threadId) await openChat(threadId); else { render(false); loadBrief(); }
        autosize(); updateSend();
    })();
    </script>
</body>
</html>
