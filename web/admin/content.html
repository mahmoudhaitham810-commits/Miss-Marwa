<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B1220">
    <meta name="robots" content="noindex, nofollow">
    <script>try { var t = localStorage.getItem('theme'); if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { }</script>
    <script>/* Catch the browser's install offer as early as possible (before any other script) */window.__deferredInstallPrompt=window.__deferredInstallPrompt||null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__deferredInstallPrompt=e;document.documentElement.classList.add('pwa-ready');});window.addEventListener('appinstalled',function(){window.__deferredInstallPrompt=null;});</script>
    <title>Lessons & files · Science Academy Staff</title>
    <link rel="icon" href="/admin/icon-192.png">
    <link rel="apple-touch-icon" href="/admin/apple-touch-icon.png">
    <link rel="manifest" href="/admin/admin-manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/student.css">
    <link rel="stylesheet" href="/assets/site.css">
    <link rel="stylesheet" href="/admin/assets/admin.css">
    <style>
        .ai-tag { display: block; width: fit-content; max-width: 100%; margin-top: 6px; padding: 4px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; line-height: 1.4; }
        .ai-tag.ok { background: var(--success-soft); color: var(--success); }
        .ai-tag.scan { background: var(--warning-soft); color: var(--notice-warning-text, #92400e); }
        .ai-tag.none { background: var(--surface-2); color: var(--muted); }
        button.ai-tag { border: 0; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; text-align: start; }
        button.ai-tag:hover { filter: brightness(1.05); text-decoration: underline; }
        .pdf-pick { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1.5px dashed var(--border); border-radius: 14px; cursor: pointer; }
        .pdf-pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        .pdf-pick:focus-within { border-color: var(--primary); }
    </style>
</head>
<body class="site staff">
    <main class="main" id="main">
        <div class="container">
            <div class="page-head">
                <div><h1>Lessons & files</h1><p id="countLine">Videos, summaries and exam papers students see in their grade.</p></div>
                <button class="btn btn-primary" id="addBtn" hidden><span data-icon="plus" style="display:contents"></span>Add a lesson</button>
            </div>
            <div class="toolbar sticky-bar">
                <div class="input" style="flex:1;min-width:220px"><span data-icon="search" style="display:contents"></span>
                    <input id="q" placeholder="Search title or notes…" autocomplete="off" style="height:44px"></div>
                <select class="pick" id="gradePick" aria-label="Grade" data-ui="pills"></select>
                <div class="segmented" id="catSeg" aria-label="Type">
                    <button data-value="all">All</button><button data-value="videos">Videos</button><button data-value="summaries">Summaries</button><button data-value="exams">Exam papers</button>
                </div>
            </div>
            <div id="list"></div>
        </div>
    </main>

    <script src="/assets/pwa.js"></script>
    <script src="/assets/site.js"></script>
    <script src="/admin/assets/admin.js"></script>
    <script>
    (async function () {
        const A = Admin, $ = (id) => document.getElementById(id);
        const { esc, icon, api } = A;
        await A.boot({ active: 'content', title: 'Lessons & files' });
        A.hydrate();
        const qs = new URLSearchParams(location.search);
        let grade = qs.get('grade') || 'all', cat = 'all', L = [], PDF = {};
        const CAT = { videos: { label: 'Video', ic: 'video' }, summaries: { label: 'Summary', ic: 'book' }, exams: { label: 'Exam paper', ic: 'file' } };

        A.gradeSelect($('gradePick'), grade, (v) => { grade = v; render(); }, { all: true });
        A.segmented($('catSeg'), cat, (v) => { cat = v; render(); });
        $('q').addEventListener('input', render);
        if (A.can('lessons.create')) { $('addBtn').hidden = false; $('addBtn').addEventListener('click', addLesson); }

        async function load() {
            $('list').innerHTML = '<div class="skel" style="height:260px;border-radius:18px"></div>';
            try { L = await api('/api/lessons'); } catch (err) { $('list').innerHTML = `<div class="notice danger">${esc(err.message)}</div>`; return; }
            try { PDF = Object.fromEntries(((await api('/api/lesson-pdf?action=list')).files || []).map(f => [f.lessonId, f])); } catch (e) { PDF = {}; }
            L.forEach(l => { l.grade = String(l.grade || '').toLowerCase(); l.category = String(l.category || '').toLowerCase(); });
            // Newest upload first (server upload order; the ITEM-<time> id as a fallback)
            const key = (i) => Number(i._order) || Number(String(i.id || '').replace(/\D/g, '').slice(0, 15)) || 0;
            L.sort((a, b) => key(b) - key(a));
            render();
        }
        function render() {
            const q = $('q').value.trim().toLowerCase();
            const inGrade = L.filter(l => grade === 'all' || l.grade === grade);
            const list = inGrade.filter(l => (cat === 'all' || l.category === cat) && (!q || `${l.title} ${l.notes || ''}`.toLowerCase().includes(q)));
            const n = (c) => inGrade.filter(l => l.category === c).length;
            $('countLine').innerHTML = `<b>${n('videos')}</b> videos · <b>${n('summaries')}</b> summaries · <b>${n('exams')}</b> exam papers${grade === 'all' ? '' : ' in ' + esc(A.GRADES[grade])}`;
            if (!list.length) {
                $('list').innerHTML = `<div class="card empty-state"><div class="bubble">${icon('book', 'lg')}</div><h3>Nothing here yet</h3><p>${L.length ? 'Try another grade, type or search.' : 'Add the first lesson for your students.'}</p></div>`;
                return;
            }
            $('list').innerHTML = `<div class="lessons">${list.map((l, i) => {
                const c = CAT[l.category] || { label: l.category, ic: 'file' };
                return `<div class="lesson ${esc(l.category)} fade-up" style="--i:${Math.min(i, 14)}">
                    <div class="lic">${icon(c.ic)}</div>
                    <div class="lbody"><b dir="auto">${esc(l.title)}</b>
                        <div class="small">${esc(A.GRADES[l.grade] || l.grade)} · ${esc(c.label)} · ${esc(A.fmtDate(l.created_at || l.createdAt))}</div>
                        ${l.notes ? `<div class="small" dir="auto" style="margin-top:4px">${esc(l.notes)}</div>` : ''}
                        ${aiTag(l)}</div>
                    <div class="lactions">
                        ${l.category === 'summaries' && A.can('lessons.create') ? `<button class="icon-btn" data-pdf="${esc(l.id)}" title="${PDF[l.id] ? 'Replace the PDF' : 'Attach the PDF so Assistant Pro can summarize it'}" aria-label="Attach PDF">${icon('file', 'sm')}</button>` : ''}
                        <a class="icon-btn" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener" title="Open link" aria-label="Open link">${icon('link', 'sm')}</a>
                        ${A.can('lessons.delete') ? `<button class="icon-btn danger-text" data-del="${esc(l.id)}" title="Delete" aria-label="Delete">${icon('trash', 'sm')}</button>` : ''}
                    </div></div>`;
            }).join('')}</div>`;
        }
        // Assistant Pro can only summarize summaries whose PDF is on the platform (a Drive link can't be read)
        function aiTag(l) {
            if (l.category !== 'summaries') return '';
            const f = PDF[l.id];
            if (!f) return `<span class="ai-tag none" title="Attach the PDF (file button) so Assistant Pro can summarize it">No PDF — AI can't read it</span>`;
            return f.readable ? `<span class="ai-tag ok" title="Assistant Pro can summarize this with the students">✨ AI ready · ${f.pages} page${f.pages === 1 ? '' : 's'}</span>`
                : A.can('lessons.create') ? `<button type="button" class="ai-tag scan" data-ocr="${esc(l.id)}" title="This PDF is photos only — press to let the AI read its pages">📷 Scanned — ✨ press to read it with AI</button>`
                : `<span class="ai-tag scan" title="This PDF is photos only — Assistant Pro can't read it">📷 Scanned — no text</span>`;
        }
        // ---------- PDF → text in this browser (pdf.js, free) + upload ----------
        let pdfLib = null;
        const loadPdf = () => pdfLib || (pdfLib = (window.__pdfjsLib ? Promise.resolve(window.__pdfjsLib) : import('/assets/vendor/pdfjs/pdf.min.js').then(m => { m.GlobalWorkerOptions.workerSrc = '/assets/vendor/pdfjs/pdf.worker.min.js'; return m; })));
        async function openPdf(bytes) { const lib = await loadPdf(); return lib.getDocument({ data: bytes, isEvalSupported: false }).promise; }
        async function pdfPages(doc, onStep) {
            const pages = [];
            for (let n = 1; n <= Math.min(doc.numPages, 400); n++) {
                const tc = await (await doc.getPage(n)).getTextContent();
                pages.push(tc.items.map(it => (it.str || '') + (it.hasEOL ? '\n' : ' ')).join('').replace(/ +\n/g, '\n').trim());
                if (onStep) onStep(n, doc.numPages);
            }
            return pages;
        }
        // 28 Nov 2026: a scanned / photo page has no text → AI vision reads it (page → JPEG ~1500 px → /api/lesson-pdf?action=ocr).
        // 3 pages at a time, each with up to 3 tries and a time limit; one stuck page can't freeze the upload.
        const SCANNED = (t) => String(t || '').replace(/\s+/g, '').length < 40;
        async function ocrPages(lessonId, doc, pages, onStep) {
            const todo = pages.map((t, i) => SCANNED(t) ? i + 1 : 0).filter(Boolean).slice(0, 80);
            if (!todo.length) return { read: 0, skipped: [], spent: 0 };
            let done = 0, spent = 0, stop = null; const skipped = [];
            const one = async (n) => {
                const page = await doc.getPage(n);
                const v1 = page.getViewport({ scale: 1 }), k = 1500 / Math.max(v1.width, v1.height), vp = page.getViewport({ scale: k });
                const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
                const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
                await page.render({ canvasContext: g, viewport: vp }).promise;
                const b64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
                for (let t = 1; t <= 3; t++) {
                    if (stop) return;
                    try { const r = await api('/api/lesson-pdf?action=ocr', { body: { lessonId, n, image: { mime: 'image/jpeg', b64 } }, timeout: 120000 }); pages[n - 1] = r.text || ''; spent += r.costUsd || 0; return; }
                    catch (err) {
                        if (err.status === 403 || err.status === 503 || (err.data && err.data.code)) { stop = err; return; }   // not allowed / AI off / AI limit → stop
                        if (t === 3) { skipped.push(n); return; }
                        await new Promise(res => setTimeout(res, 2500 * t));
                    }
                }
            };
            const queue = todo.slice();
            const worker = async () => { while (queue.length && !stop) { const n = queue.shift(); await one(n); done++; if (onStep) onStep(`AI is reading the scanned pages… ${done} of ${todo.length}`); } };
            if (onStep) onStep(`AI is reading the scanned pages… 0 of ${todo.length}`);
            await Promise.all([worker(), worker(), worker()]);
            return { read: todo.length - skipped.length - (stop ? queue.length : 0), skipped, spent, stop, total: todo.length };
        }
        async function uploadPdf(lessonId, file, onStep) {
            if (!file || !/pdf$/i.test(file.type || file.name)) throw new Error('Choose a PDF file');
            if (file.size > 30 * 1024 * 1024) throw new Error('The PDF must be smaller than 30 MB');
            let pages = [], ocr = null;
            try {
                const doc = await openPdf(new Uint8Array(await file.arrayBuffer()));
                pages = await pdfPages(doc, (n, t) => onStep && onStep(`Reading page ${n} of ${t}…`));
                ocr = await ocrPages(lessonId, doc, pages, onStep);
            } catch (e) { /* the file is still uploaded; its text can be read later */ }
            if (onStep) onStep('Uploading…');
            const fd = new FormData(); fd.append('lessonId', lessonId); fd.append('file', file, file.name); fd.append('text', JSON.stringify(pages));
            const res = await fetch('/api/lesson-pdf?action=upload', { method: 'POST', body: fd, credentials: 'same-origin' });
            const d = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(d.error || 'Upload failed');
            return { ...d, ocr };
        }
        // a scanned PDF that's already on the platform → read it with AI now (no re-upload)
        async function readScanned(l, tag) {
            const f = PDF[l.id]; if (!f || tag.dataset.busy) return;
            tag.dataset.busy = '1';
            const say = (t) => { tag.textContent = t; };
            try {
                say('Opening the PDF…');
                const res = await fetch('/api/lesson-pdf?action=file&id=' + encodeURIComponent(l.id), { credentials: 'same-origin' });
                if (!res.ok) throw new Error('Could not open the PDF');
                const doc = await openPdf(new Uint8Array(await res.arrayBuffer()));
                const pages = await pdfPages(doc, (n, t) => say(`Reading page ${n} of ${t}…`));
                const ocr = await ocrPages(l.id, doc, pages, say);
                if (ocr.stop) throw ocr.stop;
                say('Saving…');
                const d = await api('/api/lesson-pdf?action=text', { body: { lessonId: l.id, pages } });
                PDF[l.id] = { ...f, readable: d.readable, chars: d.chars };
                Site.toast(d.readable ? `✨ AI read ${ocr.read} page${ocr.read === 1 ? '' : 's'} — Assistant Pro can use this summary now` + (ocr.skipped.length ? ` (${ocr.skipped.length} skipped — press again for them)` : '') : 'The AI found no text on these pages', d.readable ? 'success' : 'info');
            } catch (e) { Site.toast((e.message || 'Stopped') + ' — press the tag to try again', 'error'); }
            delete tag.dataset.busy; render();
        }
        const ocrNote = (d) => !d.ocr || !d.ocr.total ? '' : d.ocr.stop ? ` — the AI couldn't read the scanned pages (${d.ocr.stop.message || 'AI off'})` : ` — AI read ${d.ocr.read} scanned page${d.ocr.read === 1 ? '' : 's'}`;
        function attachPdf(l) {
            const has = !!PDF[l.id];
            Site.sheet({
                iconName: 'file', title: has ? 'Replace the PDF' : 'Attach the PDF', subtitle: `${l.title} — Assistant Pro will summarize it and answer questions from it.${has ? ' Old AI summaries of it are dropped.' : ''}`,
                html: `<label class="pdf-pick" for="apf">${icon('file')}<span id="apfName">Choose the PDF…</span><input type="file" id="apf" accept="application/pdf,.pdf"></label>
                    <p class="small muted" style="margin:8px 0 0">${l.url && !/lesson-pdf/.test(l.url) ? 'Students still open your current link; the PDF is only for Assistant Pro.' : ''}</p>
                    <p class="small" id="apfMsg" style="margin:8px 0 0"></p>`,
                actions: [{ label: 'Upload', icon: 'check', onClick: async (close) => {
                    const btn = [...document.querySelectorAll('.overlay .sheet-actions [data-i="0"]')].pop();
                    const f = document.getElementById('apf').files[0], msg = (t, bad) => { const m = document.getElementById('apfMsg'); m.textContent = t; m.style.color = bad ? 'var(--danger)' : ''; };
                    if (!f) return msg('Choose a PDF first.', true);
                    if (btn.disabled) return; btn.disabled = true;
                    try { const d = await uploadPdf(l.id, f, (t) => msg(t)); close(); Site.toast(d.readable ? `PDF attached ✅ (${d.pages} pages)${ocrNote(d)}` : `PDF attached — but no text could be read${ocrNote(d)}`, d.readable ? 'success' : 'info'); load(); }
                    catch (e) { msg(e.message, true); btn.disabled = false; }
                } }, { label: 'Cancel', cls: 'btn-ghost' }]
            });
            document.getElementById('apf').addEventListener('change', (e) => { document.getElementById('apfName').textContent = e.target.files[0] ? e.target.files[0].name : 'Choose the PDF…'; });
        }
        const safeUrl = (u) => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '#';
        $('list').addEventListener('click', (e) => {
            const o = e.target.closest('[data-ocr]'); if (o) { const l = L.find(x => x.id === o.dataset.ocr); if (l) readScanned(l, o); return; }
            const p = e.target.closest('[data-pdf]'); if (p) { const l = L.find(x => x.id === p.dataset.pdf); if (l) attachPdf(l); return; }
            const b = e.target.closest('[data-del]'); if (!b) return;
            const l = L.find(x => x.id === b.dataset.del); if (!l) return;
            Site.sheet({
                iconName: 'alert', title: 'Delete this lesson?', subtitle: `${l.title} — students won't see it any more. A copy is kept in the activity log.`,
                actions: [{ label: 'Delete', cls: 'btn-danger', onClick: async (close) => {
                    try { await api('/api/lessons?id=' + encodeURIComponent(l.id), { method: 'DELETE' }); L = L.filter(x => x !== l); close(); render(); Site.toast('Lesson deleted', 'success'); }
                    catch (err) { Site.toast(err.message, 'error'); }
                } }, { label: 'Cancel', cls: 'btn-ghost' }]
            });
        });

        function addLesson() {
            let busy = false;
            Site.sheet({
                iconName: 'book', title: 'Add a lesson', subtitle: 'Students of that grade get a notification.',
                html: `<div class="form-grid">
                    <div class="field full"><label for="lt">Title</label><input class="fin" id="lt" dir="auto" maxlength="150" placeholder="e.g. Unit 2 — Lesson 3 explanation"></div>
                    <div class="field"><label for="lg">Grade</label><select class="pick" id="lg" style="width:100%">${Object.entries(A.GRADES).map(([k, v]) => `<option value="${k}" ${k === (grade === 'all' ? 'prep1' : grade) ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
                    <div class="field"><label for="lc">Type</label><select class="pick" id="lc" style="width:100%"><option value="videos">Video</option><option value="summaries">Summary</option><option value="exams">Exam paper</option></select></div>
                    <div class="field full"><label for="lu">Link <small>(YouTube, Google Drive…)</small></label><input class="fin" id="lu" type="url" inputmode="url" placeholder="https://"></div>
                    <div class="field full" id="lpdfF" hidden><label for="lpdf">…or upload the PDF <small>(summaries — Assistant Pro can summarize it with the students)</small></label>
                        <label class="pdf-pick" for="lpdf">${icon('file')}<span id="lpdfName">Choose a PDF…</span><input type="file" id="lpdf" accept="application/pdf,.pdf"></label></div>
                    <div class="field full"><label for="ln">Notes <small>(optional — unit, lesson…)</small></label><input class="fin" id="ln" dir="auto" maxlength="300"></div>
                    <p class="small full" id="lerr" style="color:var(--danger);margin:0"></p></div>`,
                actions: [{ label: 'Publish', icon: 'check', onClick: async (close) => {
                    if (busy) return;
                    const v = (id) => document.getElementById(id).value.trim();
                    const body = { id: 'ITEM-' + Date.now(), title: v('lt'), grade: v('lg'), category: v('lc'), url: v('lu'), notes: v('ln') };
                    const err = (m, ok) => { const e = document.getElementById('lerr'); e.textContent = m; e.style.color = ok ? 'var(--muted)' : 'var(--danger)'; };
                    const pdf = body.category === 'summaries' ? document.getElementById('lpdf').files[0] : null;
                    if (!body.title) return err('Write a title.');
                    if (!pdf && !/^https?:\/\/\S+$/i.test(body.url)) return err('The link must start with https:// — or upload the PDF.');
                    busy = true;
                    try {
                        let up = null;
                        if (pdf) { up = await uploadPdf(body.id, pdf, (t) => err(t, true)); if (!body.url) body.url = up.url; }   // the file first: no broken link if it fails
                        await api('/api/lessons', { body });
                        close(); Site.toast('Published ✅' + (up ? ocrNote(up) : ''), 'success'); load();
                    } catch (e) { err(e.message); }
                    finally { busy = false; }
                } }, { label: 'Cancel', cls: 'btn-ghost' }]
            });
            const showPdf = () => { document.getElementById('lpdfF').hidden = document.getElementById('lc').value !== 'summaries'; };
            document.getElementById('lc').addEventListener('change', showPdf); showPdf();
            document.getElementById('lpdf').addEventListener('change', (e) => { document.getElementById('lpdfName').textContent = e.target.files[0] ? e.target.files[0].name : 'Choose a PDF…'; });
            setTimeout(() => document.getElementById('lt')?.focus(), 250);
        }
        await load();
        if (qs.get('new') === '1' && A.can('lessons.create')) addLesson();
    })();
    </script>
</body>
</html>
