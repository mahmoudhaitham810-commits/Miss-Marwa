<head>

    <meta name="theme-color" content="#F4F7FC">
    <script>try { var t = localStorage.getItem('theme'); if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { }</script>
    <script>/* Catch the browser's install offer as early as possible (before any other script) */window.__deferredInstallPrompt=window.__deferredInstallPrompt||null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__deferredInstallPrompt=e;document.documentElement.classList.add('pwa-ready');});window.addEventListener('appinstalled',function(){window.__deferredInstallPrompt=null;});</script>
    <!-- English exam: never let the browser auto-translate it -->
    <meta name="google" content="notranslate">
    <script src="/assets/no-translate.js"></script>
    <title>Exam · Science Academy</title>
    <link rel="icon" href="/assets/img/logo-96.png">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/student.css">
    <style>
        body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        /* Anti-sharing: a faint watermark with the student's name + code over the exam */
        .wm { position: fixed; inset: 0; z-index: 35; pointer-events: none; overflow: hidden; opacity: .07; }
        [data-theme="dark"] .wm { opacity: .09; }
        .wm span { position: absolute; white-space: nowrap; font-weight: 700; font-size: 14px; color: var(--text); transform: rotate(-24deg); transform-origin: left top; }
        .wm .wm-move { font-size: 22px; opacity: 1.6; animation: wmDrift 26s linear infinite alternate; }
        @keyframes wmDrift { from { left: 4%; top: 18%; } 25% { left: 46%; top: 72%; } 50% { left: 62%; top: 22%; } 75% { left: 10%; top: 60%; } to { left: 52%; top: 44%; } }
        /* Hidden while the window is not in focus (screenshot tools, other apps) */
        .away-shield { position: fixed; inset: 0; z-index: 70; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--canvas); }
        body.away .away-shield { display: flex; }
        body.away #root { visibility: hidden; }
        @media print { body * { visibility: hidden !important; } body::after { content: "Printing is turned off during exams."; visibility: visible; position: fixed; top: 40%; left: 0; right: 0; text-align: center; font: 600 18px sans-serif; } }
        .xbar {
            position: sticky; top: 0; z-index: 40; background: var(--glass);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
        }
        .xbar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
        .xbar img { width: 34px; height: 34px; flex-shrink: 0; }
        [data-theme="dark"] .xbar img { background: #fff; border-radius: 50%; padding: 2px; }
        .xbar .ttl { flex: 1; min-width: 0; }
        .xbar .ttl strong { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .xbar .ttl span { font-size: 12px; color: var(--muted); }
        .timer { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: 15px; }
        .timer.warn { background: var(--warning-soft); color: var(--warning); }
        .timer.danger { background: var(--danger-soft); color: var(--danger); animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: .65; } }
        .xwrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 120px; }
        .xgrid { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
        @media (min-width: 1024px) { .xgrid { grid-template-columns: minmax(0, 1fr) 320px; } .strip { display: none !important; } .xwrap { padding-bottom: 40px; } }
        @media (max-width: 1023px) { .side { display: none; } }
        .prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13.5px; }
        .strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 12px 2px 6px; }
        .strip::-webkit-scrollbar { display: none; }
        .qn { width: 38px; height: 38px; flex-shrink: 0; border-radius: 10px; font-weight: 700; font-size: 13.5px; background: var(--surface); border: 1px solid var(--border); color: var(--text-2); position: relative; transition: transform .12s, background .15s; }
        .qn.answered { background: var(--success-soft); border-color: var(--success-line); color: var(--success); }
        .qn.flagged::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }
        .qn.current { background: var(--primary); border-color: var(--primary); color: #fff; transform: scale(1.06); }
        .qgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .qgrid .qn { width: auto; height: 42px; }
        .qcard { padding: 22px; }
        @media (min-width: 768px) { .qcard { padding: 28px; } }
        .qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
        .flag-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 13px; }
        .flag-btn.on { background: var(--accent-soft); color: var(--accent); }
        .flag-btn.on .icon { fill: currentColor; }
        .qtext { font-size: 19px; line-height: 1.6; font-weight: 600; margin: 0 0 20px; white-space: pre-wrap; }
        @media (min-width: 768px) { .qtext { font-size: 21px; } }
        .opts { display: flex; flex-direction: column; gap: 10px; }
        .opt { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 2px solid transparent; cursor: pointer; text-align: left; width: 100%; transition: background .15s, border-color .15s, transform .1s; }
        .opt:hover { background: var(--surface-3); }
        .opt:active { transform: scale(.99); }
        .opt .letter { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--text-2); flex-shrink: 0; box-shadow: var(--shadow-sm); }
        .opt .otext { flex: 1; font-size: 16px; font-weight: 500; }
        .opt.sel { background: var(--primary-soft); border-color: var(--primary); }
        .opt.sel .letter { background: var(--primary); color: #fff; }
        .qnav { display: flex; gap: 10px; margin-top: 22px; }
        .qnav .btn { flex: 1; }
        .qnav .next { flex: 2; }
        .kbd-hint { margin-top: 14px; font-size: 12px; color: var(--faint); display: none; }
        @media (min-width: 1024px) { .kbd-hint { display: block; } }
        .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin: 12px 0; }
        .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
        .sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
        .sum { padding: 12px; border-radius: 14px; background: var(--surface-2); text-align: center; }
        .sum b { display: block; font-size: 22px; font-weight: 800; }
        .sum span { font-size: 12px; color: var(--muted); font-weight: 600; }
        .result { text-align: center; max-width: 520px; margin: 24px auto; padding: 32px 24px; }
        .result .ring { margin: 0 auto 16px; }
        .result h2 { margin: 0 0 6px; font-size: 22px; }
        .result p { margin: 0 0 6px; color: var(--text-2); }
        .result .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
        .warn-banner { margin-bottom: 14px; }
    </style>
</head>
<body class="notranslate" translate="no">
    <header class="xbar">
        <div class="xbar-in">
            <img src="/assets/img/logo-96.png" alt="Science Academy" width="34" height="34">
            <div class="ttl"><strong id="xTitle" dir="auto">Loading exam…</strong><span>Science Academy · Miss Marwa</span></div>
            <div class="timer hidden" id="timer">
                <svg class="icon sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span class="num" id="timerText">00:00</span>
            </div>
        </div>
    </header>
    <main class="xwrap" id="root" translate="no">
        <div class="card" style="max-width:640px;margin:30px auto"><div class="skel" style="height:22px;width:50%;margin-bottom:18px"></div><div class="skel" style="height:56px;margin-bottom:10px"></div><div class="skel" style="height:56px;margin-bottom:10px"></div><div class="skel" style="height:56px"></div></div>
    </main>

    <script src="/assets/pwa.js"></script>
    <script src="/assets/student.js?v=20261120a"></script>
    <script>
    (function () {
        if (!window.App) return;
        const { session, esc, icon, url, ring, scoreTone } = App;

        const examId = new URLSearchParams(location.search).get('id');
        if (!examId) { location.replace(url('exams.html')); return; }

        const root = document.getElementById('root');
        let questions = [], answers = [], current = 0;
        const flagged = new Set();
        let inExam = false;            // true while the student is answering
        let isSubmitting = false;
        let timeIsUp = false;
        let timerInterval = null;
        let tabSwitchCount = 0;
        let autoReason = null; // 'left-page' | 'time-up' — saved with the submission for the staff portal
        let pendingWarning = false;
        const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

        // ==================== Anti-sharing: watermark + hide when the window loses focus ====================
        // Web pages can't block screenshots. Instead: every screenshot carries the student's name
        // and code, and the questions disappear while another app/tool has the focus.
        let wmTimer = null;
        function watermark(on) {
            document.querySelector('.wm')?.remove();
            clearInterval(wmTimer);
            if (!on) return;
            const wm = document.createElement('div');
            wm.className = 'wm'; wm.setAttribute('aria-hidden', 'true');
            document.body.appendChild(wm);
            const draw = () => {
                const t = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                const label = `${session.firstName || ''} ${session.lastName || ''} · ${session.id} · ${t}`;
                const stepX = 300, stepY = 130, cols = Math.ceil(innerWidth / stepX) + 2, rows = Math.ceil(innerHeight / stepY) + 3;
                let html = '';
                for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) html += `<span style="left:${c * stepX - (r % 2) * 150 - 60}px;top:${r * stepY}px" dir="auto">${esc(label)}</span>`;
                wm.innerHTML = html + `<span class="wm-move" dir="auto">${esc(label)}</span>`;
            };
            draw();
            wmTimer = setInterval(draw, 60000);
            window.addEventListener('resize', draw);
        }
        const shield = document.createElement('div');
        shield.className = 'away-shield';
        shield.innerHTML = `<div><div class="empty" style="padding:0"><div class="bubble">${App.icon('eye')}</div></div><h2 style="margin:0 0 6px">Exam hidden</h2><p class="muted" style="margin:0">The questions are hidden while this window isn't active.<br>Tap here to continue.</p></div>`;
        shield.addEventListener('click', () => { document.body.classList.remove('away'); window.focus(); });
        document.body.appendChild(shield);
        window.addEventListener('blur', () => { if (inExam) document.body.classList.add('away'); });
        window.addEventListener('focus', () => document.body.classList.remove('away'));

        // ==================== Anti-cheat ====================
        document.addEventListener('contextmenu', (e) => { if (inExam) e.preventDefault(); });
        document.addEventListener('copy', (e) => { if (inExam) e.preventDefault(); });
        document.addEventListener('cut', (e) => { if (inExam) e.preventDefault(); });
        document.addEventListener('keydown', (e) => {
            if (!inExam) return;
            const key = (e.key || '').toLowerCase();
            const ctrl = e.ctrlKey || e.metaKey;
            if (key === 'f12') { e.preventDefault(); return; }
            if (ctrl && e.shiftKey && ['i', 'j', 'c'].includes(key)) { e.preventDefault(); return; }
            if (ctrl && ['c', 'x', 'v', 'p', 's', 'u'].includes(key)) { e.preventDefault(); return; }
            if (key === 'printscreen') navigator.clipboard?.writeText('').catch(() => { });
            if (document.querySelector('.overlay') || ctrl || e.altKey) return;
            // Shortcuts: 1–6 pick an answer, arrows move between questions
            if (/^[1-6]$/.test(key)) { const i = Number(key) - 1; if (questions[current] && i < questions[current].options.length) choose(i); }
            if (key === 'arrowright') go(current + 1);
            if (key === 'arrowleft') go(current - 1);
        });
        window.addEventListener('beforeunload', (e) => { if (inExam) { e.preventDefault(); e.returnValue = ''; } });
        // Leaving the page: first time = warning, second time = automatic submission (same rule as before)
        document.addEventListener('visibilitychange', () => {
            if (!inExam) return;
            if (document.hidden) {
                tabSwitchCount++;
                // Record every time the student leaves the page — saved even if they never come back
                try { fetch('/api/exams?action=leave', { method: 'POST', keepalive: true, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ examId }) }).catch(() => { }); } catch (e) { }
                if (tabSwitchCount >= 2) autoReason = 'left-page';
                if (tabSwitchCount >= 2) {
                    submitAnswers(true, 'You left the exam page more than once, so it was submitted automatically with your current answers.');
                } else {
                    pendingWarning = true;
                }
            } else if (pendingWarning) {
                pendingWarning = false;
                App.sheet({
                    iconName: 'alert', tone: 'danger', title: 'Stay on the exam page',
                    subtitle: 'Leaving the exam page is not allowed.',
                    html: `<p class="muted" style="margin:0">This is your first warning. If you leave the page again, your exam will be submitted automatically with your current answers.</p>`,
                    actions: [{ label: 'Back to my exam', cls: 'btn-primary' }]
                });
                showBanner();
            }
        });

        // ==================== Timer ====================
        const pad = (n) => String(Math.max(0, Math.floor(n))).padStart(2, '0');
        function startTimer(minutes) {
            const endAt = Date.now() + minutes * 60 * 1000;
            const el = document.getElementById('timer'), t = document.getElementById('timerText');
            el.classList.remove('hidden');
            const tick = () => {
                const left = Math.round((endAt - Date.now()) / 1000);
                t.textContent = `${pad(left / 60)}:${pad(left % 60)}`;
                el.classList.toggle('warn', left <= 300 && left > 60);
                el.classList.toggle('danger', left <= 60);
                if (left <= 0) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    timeIsUp = true;
                    autoReason = autoReason || 'time-up';
                    submitAnswers(true, "Time's up — your exam was submitted automatically with your current answers.");
                }
            };
            tick();
            timerInterval = setInterval(tick, 1000);
        }
        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            document.getElementById('timer').classList.add('hidden');
        }

        // ==================== Exam UI ====================
        function renderExam() {
            root.innerHTML = `
                <div class="xgrid">
                    <section>
                        <div class="reveal">
                            <div class="prog-row"><b id="qPos"></b><span class="muted num" id="qDone"></span></div>
                            <div class="progress"><i id="qBar"></i></div>
                            <div class="strip" id="strip"></div>
                        </div>
                        <div id="banner"></div>
                        <article class="card qcard reveal notranslate" translate="no" id="qcard"></article>
                    </section>
                    <aside class="side">
                        <div class="card reveal">
                            <div class="card-head"><h2 class="card-title">${icon('grid')}Questions</h2><span class="xs muted">Tap to jump</span></div>
                            <div class="qgrid" id="sideGrid"></div>
                            <div class="legend"><span><i style="background:var(--success-soft);border:1px solid var(--success-line)"></i>Answered</span><span><i style="background:var(--accent)"></i>Flagged</span><span><i style="background:var(--surface);border:1px solid var(--border)"></i>Not answered</span></div>
                            <button class="btn btn-primary btn-block" id="sideSubmit">${icon('send')}Review &amp; submit</button>
                            <p class="xs muted" style="margin:12px 0 0">Stay on this page until you submit. Leaving twice submits your exam automatically.</p>
                        </div>
                    </aside>
                </div>`;
            document.getElementById('sideSubmit').addEventListener('click', openSubmitSheet);
            root.querySelector('.xgrid').addEventListener('click', (e) => {
                const n = e.target.closest('[data-q]'); if (n) go(Number(n.dataset.q));
            });
            renderQuestion(false);
            App.reveal(root);
        }

        function showBanner() {
            const b = document.getElementById('banner');
            if (b) b.innerHTML = `<div class="notice danger warn-banner">${icon('alert')}<div><b>Warning:</b> you left the exam page once. Leaving again will submit your exam automatically.</div></div>`;
        }

        function navHtml() {
            return questions.map((_, i) => {
                const cls = [answers[i] >= 0 ? 'answered' : '', flagged.has(i) ? 'flagged' : '', i === current ? 'current' : ''].join(' ');
                return `<button class="qn num ${cls}" data-q="${i}" aria-label="Question ${i + 1}${answers[i] >= 0 ? ', answered' : ''}${flagged.has(i) ? ', flagged' : ''}">${i + 1}</button>`;
            }).join('');
        }

        // When a browser translation is switched off again, redraw the question in its original English
        window.__onTranslationCleared = () => { if (questions && questions.length && document.getElementById('qcard')) renderQuestion(false); };
        function renderQuestion(animate = true) {
            const q = questions[current];
            const answered = answers.filter(a => a >= 0).length;
            document.getElementById('qPos').textContent = `Question ${current + 1} of ${questions.length}`;
            document.getElementById('qDone').textContent = `${answered}/${questions.length} answered`;
            document.getElementById('qBar').style.width = `${(answered / questions.length) * 100}%`;
            document.getElementById('strip').innerHTML = navHtml();
            document.getElementById('sideGrid').innerHTML = navHtml();
            const cur = document.querySelector('#strip .current');
            if (cur) {
                const strip = document.getElementById('strip');
                strip.scrollTo({ left: cur.offsetLeft - strip.clientWidth / 2 + cur.clientWidth / 2, behavior: animate ? 'smooth' : 'auto' });
            }

            const last = current === questions.length - 1;
            const card = document.getElementById('qcard');
            card.innerHTML = `
                <div class="qhead">
                    <span class="chip primary">Question ${current + 1}</span>
                    <button class="flag-btn ${flagged.has(current) ? 'on' : ''}" id="flagBtn" aria-pressed="${flagged.has(current)}">${icon('flag', 'sm')}${flagged.has(current) ? 'Flagged' : 'Flag for review'}</button>
                </div>
                <p class="qtext notranslate" translate="no" dir="auto">${esc(q.question)}</p>
                <div class="opts notranslate" translate="no" role="radiogroup" aria-label="Answer options">
                    ${(q.options || []).map((o, i) => `<button class="opt ${answers[current] === i ? 'sel' : ''}" role="radio" aria-checked="${answers[current] === i}" data-o="${i}">
                        <span class="letter">${LETTERS[i] || i + 1}</span><span class="otext notranslate" translate="no" dir="auto">${esc(o)}</span></button>`).join('')}
                </div>
                <div class="qnav">
                    <button class="btn btn-ghost" id="prevBtn" ${current === 0 ? 'disabled' : ''}>${icon('arrowLeft')}Back</button>
                    <button class="btn btn-primary next" id="nextBtn">${last ? `${icon('send')}Review &amp; submit` : `Next${icon('arrowRight')}`}</button>
                </div>
                <p class="kbd-hint">Tip: press 1–4 to choose an answer and ← → to move between questions.</p>`;
            if (animate && card.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
                card.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.22,.61,.36,1)' });
            }
            card.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => choose(Number(b.dataset.o))));
            document.getElementById('flagBtn').addEventListener('click', () => {
                if (flagged.has(current)) flagged.delete(current); else flagged.add(current);
                renderQuestion(false);
            });
            document.getElementById('prevBtn').addEventListener('click', () => go(current - 1));
            document.getElementById('nextBtn').addEventListener('click', () => last ? openSubmitSheet() : go(current + 1));
        }

        function choose(i) {
            if (!inExam || isSubmitting) return;
            answers[current] = i;
            renderQuestion(false);
        }
        function go(i) {
            if (!inExam || i < 0 || i >= questions.length || i === current) return;
            current = i;
            renderQuestion(true);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openSubmitSheet() {
            if (!inExam || isSubmitting) return;
            const answered = answers.filter(a => a >= 0).length;
            const unanswered = questions.length - answered;
            const firstEmpty = answers.findIndex(a => a < 0);
            const flaggedList = [...flagged].sort((a, b) => a - b);
            const html = `
                <div class="sumgrid">
                    <div class="sum"><b class="num" style="color:var(--success)">${answered}</b><span>Answered</span></div>
                    <div class="sum"><b class="num" style="color:var(--accent)">${flaggedList.length}</b><span>Flagged</span></div>
                    <div class="sum" style="${unanswered ? 'background:var(--danger-soft)' : ''}"><b class="num" style="color:${unanswered ? 'var(--danger)' : 'var(--text)'}">${unanswered}</b><span>Not answered</span></div>
                </div>
                <div class="qgrid" id="sheetGrid" style="margin-bottom:14px">${navHtml()}</div>
                ${unanswered
                    ? `<div class="notice danger">${icon('alert')}<div>Answer every question before you submit. Tap a number above to jump to it.</div></div>`
                    : flaggedList.length
                        ? `<div class="notice warning">${icon('flag')}<div>You flagged question${flaggedList.length > 1 ? 's' : ''} ${flaggedList.map(i => i + 1).join(', ')}. Double-check before submitting if you're unsure.</div></div>`
                        : `<div class="notice success">${icon('checkCircle')}<div>All questions answered. After you submit, you can't change your answers.</div></div>`}`;
            const actions = unanswered
                ? [{ label: `Go to question ${firstEmpty + 1}`, icon: 'arrowRight', onClick: (close) => { close(); go(firstEmpty); } },
                   { label: 'Keep working', cls: 'btn-ghost' }]
                : [{ label: 'Submit exam', icon: 'send', onClick: (close) => { close(); submitAnswers(false); } },
                   { label: 'Keep reviewing', cls: 'btn-ghost' }];
            const close = App.sheet({ iconName: 'send', title: 'Submit your exam?', subtitle: 'Quick check before you finish.', html, actions });
            document.getElementById('sheetGrid')?.addEventListener('click', (e) => {
                const n = e.target.closest('[data-q]'); if (n) { close(); go(Number(n.dataset.q)); }
            });
        }

        // ==================== Submission (manual or automatic) ====================
        async function submitAnswers(isAuto, autoNote) {
            if (isSubmitting) return;
            isSubmitting = true;
            document.querySelectorAll('.overlay [data-close]').forEach(b => b.click());
            document.querySelectorAll('#nextBtn, #sideSubmit').forEach(b => { b.disabled = true; });
            // Only tell the student we're submitting if it takes more than a moment
            const slowToast = setTimeout(() => App.toast('Submitting your answers…'), 900);

            let lastError = null;
            // Retry up to 3 times if the connection drops for a moment
            for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                    const res = await fetch('/api/exams?action=submit', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ examId, studentId: session.id, answers, leaves: tabSwitchCount, autoReason: isAuto ? autoReason : null })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.status === 401 && data.code === 'STUDENT_SESSION_REQUIRED') {
                        // Signed out mid-exam: keep the answers on screen and ask to sign in in a new tab
                        lastError = new Error('You were signed out. Open Science Academy in a new tab, sign in, then come back here and tap "Submit again".');
                        lastError.final = false;
                        break;
                    }
                    if (!res.ok) {
                        lastError = new Error(data.error || 'The exam could not be submitted.');
                        lastError.final = true;   // a real refusal from the server — retrying won't help
                        break;
                    }
                    isSubmitting = false;
                    clearTimeout(slowToast);
                    renderResult(data.score, data.total, isAuto ? autoNote : null, false, data.reviewUnlocksAt);
                    return;
                } catch (err) {
                    lastError = err;
                    await new Promise(r => setTimeout(r, attempt * 1500));
                }
            }
            isSubmitting = false;
            clearTimeout(slowToast);

            if (isAuto || timeIsUp) {
                // Time is up / auto-submit failed: answers stay on the page (locked) with a retry button
                stopTimer();
                const keepWarning = !lastError?.final;
                inExam = false;
                root.innerHTML = `<div class="card result reveal">
                    <div class="empty" style="padding:0"><div class="bubble" style="background:var(--danger-soft);color:var(--danger)">${icon('wifiOff')}</div></div>
                    <h2>Your answers haven't reached us yet</h2>
                    <p>${esc(lastError?.message || 'Connection problem.')}</p>
                    <p class="small muted">Your answers are kept on this page. Check your internet and tap “Submit again”. Don't close this page.</p>
                    <div class="btns"><button class="btn btn-primary" id="retryBtn">${icon('refresh')}Submit again</button></div>
                </div>`;
                App.reveal(root);
                if (keepWarning) window.onbeforeunload = (e) => { e.preventDefault(); e.returnValue = ''; };
                document.getElementById('retryBtn').addEventListener('click', () => submitAnswers(true, autoNote));
                return;
            }

            document.querySelectorAll('#nextBtn, #sideSubmit').forEach(b => { b.disabled = false; });
            App.sheet({
                iconName: 'wifiOff', tone: 'danger', title: "Couldn't submit",
                subtitle: lastError?.message || 'Connection problem.',
                html: `<p class="muted" style="margin:0">Your answers are still here. Check your internet and try again.</p>`,
                actions: [{ label: 'Try again', icon: 'refresh', onClick: (close) => { close(); submitAnswers(false); } }, { label: 'Close', cls: 'btn-ghost' }]
            });
        }

        // ==================== Result & status screens ====================
        function renderResult(score, total, note, canReview, unlocksAt) {
            stopTimer();
            inExam = false;
            watermark(false);
            document.body.classList.remove('away');
            window.onbeforeunload = null;
            const tone = scoreTone(score, total);
            const title = tone === 'good' ? 'Excellent work!' : tone === 'bad' ? "Let's review this together" : 'Good job!';
            const msg = tone === 'good' ? 'You really know this. Keep it up.' : tone === 'bad' ? 'Go back over the lesson and ask Miss Marwa about anything unclear.' : "You're on the right track — a little more practice and you'll ace it.";
            root.innerHTML = `<div class="card result reveal">
                ${ring(score, total, { size: 'lg', label: 'Score' })}
                <h2>${title}</h2>
                <p>${msg}</p>
                ${note ? `<div class="notice warning" style="margin-top:14px;text-align:left">${icon('info')}<div>${esc(note)}</div></div>` : ''}
                ${canReview ? '' : `<div class="notice" style="margin-top:14px;text-align:left">${icon('lock')}<div>The questions and answers stay hidden until the exam closes for everyone${unlocksAt ? ` — the review opens on <b>${App.fmtDate(unlocksAt, true)}</b>` : ''}.</div></div>`}
                <div class="btns">
                    ${canReview ? `<a class="btn btn-primary" href="${url('exam-results.html', { id: examId })}">${icon('eye')}Review answers</a>` : ''}
                    <a class="btn ${canReview ? 'btn-ghost' : 'btn-primary'}" href="${url('exams.html')}">${icon('clipboard')}Back to exams</a>
                    <a class="btn btn-ghost" href="${url('home.html')}">${icon('home')}Home</a>
                </div>
            </div>`;
            App.reveal(root);
        }

        function renderStatus(ic, title, text, tone = '') {
            stopTimer();
            inExam = false;
            watermark(false);
            const style = tone === 'danger' ? 'background:var(--danger-soft);color:var(--danger)' : tone === 'warning' ? 'background:var(--warning-soft);color:var(--warning)' : '';
            root.innerHTML = `<div class="card result reveal">
                <div class="empty" style="padding:0"><div class="bubble" style="${style}">${icon(ic)}</div></div>
                <h2>${esc(title)}</h2><p>${esc(text)}</p>
                <div class="btns"><a class="btn btn-primary" href="${url('exams.html')}">${icon('clipboard')}Back to exams</a></div>
            </div>`;
            App.reveal(root);
        }

        // ==================== Start ====================
        async function start() {
            let data;
            try {
                const res = await fetch('/api/exams?action=start', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ examId, studentId: session.id })
                });
                data = await res.json().catch(() => ({}));
                if (res.status === 401 && data.code === 'STUDENT_SESSION_REQUIRED') { App.sessionEnded(); return; }
            } catch (e) {
                renderStatus('wifiOff', 'No connection', "We couldn't reach the server. Check your internet and open the exam again.", 'danger');
                return;
            }
            if (data.title) { document.getElementById('xTitle').textContent = data.title; document.title = `${data.title} · Science Academy`; }

            if (data.status === 'started') {
                questions = Array.isArray(data.questions) ? data.questions : [];
                if (!questions.length) { renderStatus('alert', 'This exam has no questions', 'Please let Miss Marwa know.', 'warning'); return; }
                answers = questions.map(() => -1);
                inExam = true;
                watermark(true);
                renderExam();
                if (data.timeLimitMinutes) startTimer(data.timeLimitMinutes);
            } else if (data.status === 'expired_taken') {
                renderResult(data.score, data.total, null, true);
            } else if (data.status === 'active_taken') {
                if (typeof data.score === 'number') renderResult(data.score, data.total, null, false, data.reviewUnlocksAt);
                else renderStatus('checkCircle', 'Already submitted', "You've already taken this exam. You can review your answers once it closes for everyone.");
            } else if (data.status === 'expired_nottaken' || data.status === 'expired') {
                renderStatus('clock', 'This exam has closed', "The time for this exam is over and it wasn't taken.", 'warning');
            } else if (data.status === 'forbidden') {
                renderStatus('lock', 'Not your exam', data.error || "This exam isn't for your grade.", 'danger');
            } else if (data.status === 'locked') {
                renderStatus('lock', "This exam can't be reopened", 'You opened this exam before. Ask Miss Marwa if you need it reopened.', 'danger');
            } else {
                renderStatus('alert', 'Something went wrong', data.error || 'Please try again in a moment.', 'danger');
            }
        }
        start();
    })();
    </script>
</body>
</html>
