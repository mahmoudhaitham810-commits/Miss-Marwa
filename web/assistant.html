<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#F4F7FC">
    <script>try { var t = localStorage.getItem('theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.dataset.theme = 'dark'; } catch (e) { }</script>
    <script>/* Catch the browser's install offer as early as possible (before any other script) */window.__deferredInstallPrompt=window.__deferredInstallPrompt||null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__deferredInstallPrompt=e;document.documentElement.classList.add('pwa-ready');});window.addEventListener('appinstalled',function(){window.__deferredInstallPrompt=null;});</script>
    <title>AI Assistant · Science Academy</title>
    <link rel="icon" href="/assets/img/logo-96.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/student.css">
    <style>
        .chat { max-width: 780px; margin: 0 auto; padding-bottom: 120px; }
        .chat-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .chat-head img { width: 48px; height: 48px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-sm); flex-shrink: 0; }
        .chat-head .t { flex: 1; min-width: 0; }
        .chat-head strong { display: block; font-size: 16px; }
        .chat-head .status { font-size: 12.5px; color: var(--success); display: inline-flex; align-items: center; gap: 6px; }
        .chat-head .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }

        .welcome { text-align: center; padding: 26px 18px; }
        .welcome img { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto 14px; background: #fff; box-shadow: var(--shadow); }
        .welcome h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
        .welcome p { color: var(--text-2); margin: 0 auto 20px; max-width: 420px; }
        .starters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
        @media (max-width: 420px) { .starters { grid-template-columns: 1fr; } }
        .starter { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); font-weight: 600; transition: transform .15s, border-color .15s; }
        .starter:hover { transform: translateY(-2px); border-color: var(--primary-line); }
        .starter .ic { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--primary-soft); color: var(--primary); }
        .starter small { display: block; font-weight: 500; color: var(--muted); font-size: 12.5px; }

        .msgs { display: flex; flex-direction: column; gap: 14px; }
        .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 100%; }
        .msg .who { width: 32px; height: 32px; border-radius: 50%; background: #fff; flex-shrink: 0; box-shadow: var(--shadow-sm); }
        .msg .body { min-width: 0; max-width: min(620px, 84%); display: flex; flex-direction: column; }
        .msg.me .body { align-items: flex-end; }
        .bubble { padding: 12px 15px; border-radius: 18px; line-height: 1.7; font-size: 15px; overflow-wrap: break-word; max-width: 100%; }
        .msg.bot .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; box-shadow: var(--shadow-sm); }
        .msg.me { justify-content: flex-end; }
        .msg.me .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 6px; }
        [data-theme="dark"] .msg.me .bubble { color: #0B1220; }
        .bubble ul { margin: 6px 0; padding-inline-start: 20px; }
        .bubble code { background: var(--surface-2); padding: 1px 6px; border-radius: 6px; font-size: 13.5px; }
        .msg .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .reply-chip { padding: 7px 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-weight: 600; font-size: 13.5px; }
        .reply-chip:hover { background: var(--primary-soft-hover); }
        .typing { display: inline-flex; gap: 5px; align-items: center; }
        .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
        .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
        @keyframes blink { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
        .msg-in { animation: msgIn .3s cubic-bezier(.22, .61, .36, 1); }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } }
        @media (prefers-reduced-motion: reduce) { .msg-in, .typing i { animation: none; } }

        .composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--canvas) 70%, transparent); }
        @media (min-width: 1024px) { .composer { left: var(--sidebar-w); padding-bottom: 20px; } }
        .composer-in { max-width: 780px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); }
        .composer-in:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
        .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: inherit; font-size: 15.5px; line-height: 1.5; padding: 9px 6px; max-height: 140px; min-height: 40px; }
        .composer .tool { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; }
        .composer .tool:hover { background: var(--surface-2); color: var(--text); }
        .composer .send { width: 42px; height: 42px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .15s, transform .12s; }
        [data-theme="dark"] .composer .send { color: #0B1220; }
        .composer .send:disabled { opacity: .4; }
        .composer .send:active { transform: scale(.95); }
        .composer .hint { max-width: 780px; margin: 6px auto 0; text-align: center; font-size: 11.5px; color: var(--faint); }

        .soon-wrap { max-width: 560px; margin: 20px auto; text-align: center; padding: 34px 24px; }
        .soon-wrap img { width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 16px; background: #fff; box-shadow: var(--shadow); }
        .soon-wrap h1 { font-size: 22px; margin: 10px 0 8px; }
        .soon-wrap p { color: var(--text-2); margin: 0 0 6px; }
        .soon-list { text-align: left; display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
        .soon-list div { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-weight: 500; }
        .soon-list .icon { color: var(--primary); }
    </style>
</head>
<body>
    <main class="main" id="main">
        <div class="container" id="root"></div>
    </main>

    <script src="/assets/pwa.js"></script>
    <script src="/assets/student.js"></script>
    <script>
    (function () {
        if (!window.App) return;
        const { session, esc, icon, api } = App;
        const params = new URLSearchParams(location.search);

        // The assistant is not open to students yet. Miss Marwa / the team can test it by
        // opening /assistant.html?preview=1 once (it is remembered on that device);
        // ?preview=0 switches the preview off again.
        try {
            if (params.get('preview') === '1') localStorage.setItem('ai_preview', '1');
            if (params.get('preview') === '0') localStorage.removeItem('ai_preview');
        } catch (e) { }
        let preview = false;
        try { preview = localStorage.getItem('ai_preview') === '1'; } catch (e) { }

        App.shell({ active: 'assistant', title: 'AI Assistant', bottomNav: !preview });
        const root = document.getElementById('root');
        const AVATAR = '/assets/img/marwa-160.png';

        if (!preview) {
            root.innerHTML = `<div class="card soon-wrap reveal">
                <img src="${AVATAR}" alt="Miss Marwa" width="96" height="96">
                <span class="soon-tag">Coming soon</span>
                <h1>Miss Marwa's AI Assistant</h1>
                <p>A study buddy that knows your grades, your exam deadlines and your lessons.</p>
                <div class="soon-list">
                    <div>${icon('chart')}Check your grades and rank in seconds</div>
                    <div>${icon('clock')}Know which exams are closing soon</div>
                    <div>${icon('sparkles')}Get science explained step by step</div>
                </div>
                <a class="btn btn-primary btn-block" href="${App.url('home.html')}">${icon('home')}Back to home</a>
            </div>`;
            App.reveal(root);
            return;
        }

        // ---------------- Chat (preview) ----------------
        const STARTERS = [
            { label: 'My grades', sub: 'Scores and rank', icon: 'chart', send: 'عرض درجاتي' },
            { label: 'Exam deadlines', sub: "What's closing soon", icon: 'clock', send: 'مواعيد الامتحانات' },
            { label: "What's new", sub: 'Latest lessons', icon: 'sparkles', send: 'المحتوى الجديد' },
            { label: 'Science question', sub: 'Explain a concept', icon: 'help', send: 'عندي سؤال علمي' }
        ];

        root.innerHTML = `
            <div class="chat">
                <div class="chat-head reveal">
                    <img src="${AVATAR}" alt="" width="48" height="48">
                    <div class="t"><strong>Miss Marwa's AI Assistant <span class="chip accent" style="margin-left:4px">Preview</span></strong><span class="status">Online</span></div>
                    <button class="icon-btn" id="clearBtn" title="Clear chat" aria-label="Clear chat">${icon('refresh', 'sm')}</button>
                </div>
                <div class="msgs" id="msgs"></div>
            </div>
            <div class="composer">
                <div class="composer-in">
                    <button class="tool" data-soon="Sending photos" aria-label="Send a photo (coming soon)">${icon('file')}</button>
                    <textarea id="input" rows="1" dir="auto" placeholder="Ask anything… (Arabic or English)" aria-label="Message"></textarea>
                    <button class="tool" data-soon="Voice messages" aria-label="Voice (coming soon)">${icon('help')}</button>
                    <button class="send" id="sendBtn" aria-label="Send" disabled>${icon('send')}</button>
                </div>
                <p class="hint">The assistant can make mistakes. Check important answers with Miss Marwa.</p>
            </div>`;
        // mic icon for the voice button
        root.querySelector('[data-soon="Voice messages"]').innerHTML = `<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 19v3"/></svg>`;

        const msgs = document.getElementById('msgs');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        let waiting = false;

        function welcome() {
            msgs.innerHTML = `<div class="welcome reveal" id="welcome">
                <img src="${AVATAR}" alt="" width="92" height="92">
                <h1>Hi ${esc(session.firstName || '')}! How can I help?</h1>
                <p>Ask about your grades, exam deadlines, new lessons — or any science question.</p>
                <div class="starters">${STARTERS.map((s, i) => `<button class="starter" data-starter="${i}"><span class="ic">${icon(s.icon)}</span><span>${s.label}<small>${s.sub}</small></span></button>`).join('')}</div>
            </div>`;
            App.reveal(msgs);
        }

        // Light markdown: escape everything first, then allow bold / italic / code / bullet lists
        function md(text) {
            let h = String(text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g, '$1<em>$2</em>').replace(/`([^`]+)`/g, '<code>$1</code>');
            const lines = h.split('\n'); let out = '', inList = false;
            lines.forEach(l => {
                const m = l.match(/^\s*[-•]\s+(.*)$/);
                if (m) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; }
                else { if (inList) { out += '</ul>'; inList = false; } out += l + '<br>'; }
            });
            if (inList) out += '</ul>';
            return out.replace(/(<br>)+$/, '');
        }

        function add(role, content, chips) {
            document.getElementById('welcome')?.remove();
            const row = document.createElement('div');
            row.className = `msg msg-in ${role === 'user' ? 'me' : 'bot'}`;
            const bubble = role === 'user'
                ? `<div class="bubble" dir="auto">${esc(content).replace(/\n/g, '<br>')}</div>`
                : role === 'error'
                    ? `<div class="bubble" style="background:var(--danger-soft);border-color:var(--danger-line)"><span dir="auto">${esc(content)}</span></div>`
                    : `<div class="bubble" dir="auto">${md(content)}</div>`;
            row.innerHTML = (role === 'user' ? '' : `<img class="who" src="${AVATAR}" alt="" width="32" height="32">`) + `<div class="body">${bubble}${chips && chips.length ? `<div class="chips-row">${chips.map(c => `<button class="reply-chip" dir="auto" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : ''}</div>`;
            msgs.appendChild(row);
            scrollDown();
            return row;
        }
        let typingEl = null;
        function typing(on) {
            if (on && !typingEl) {
                typingEl = document.createElement('div');
                typingEl.className = 'msg bot msg-in';
                typingEl.innerHTML = `<img class="who" src="${AVATAR}" alt="" width="32" height="32"><div class="bubble"><span class="typing" aria-label="Thinking"><i></i><i></i><i></i></span></div>`;
                msgs.appendChild(typingEl); scrollDown();
            } else if (!on && typingEl) { typingEl.remove(); typingEl = null; }
        }
        function scrollDown() { requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' })); }

        async function send(text) {
            text = String(text || '').trim();
            if (!text || waiting) return;
            waiting = true; sendBtn.disabled = true;
            input.value = ''; autosize();
            add('user', text);
            typing(true);
            try {
                const data = await api('/api/assistant?action=chat', { method: 'POST', body: { studentId: session.id, message: text, firstName: session.firstName, grade: session.grade } });
                typing(false);
                if (data.reply) add('bot', data.reply, data.fallback_suggestions);
                else add('error', "The assistant didn't reply. Please try again.", data.fallback_suggestions);
            } catch (e) {
                typing(false);
                const msg = e.status === 404
                    ? 'This preview needs a student account. Sign in as a student to chat.'
                    : e.network ? 'No internet connection. Check your network and try again.' : (e.message || 'Something went wrong.');
                add('error', msg, e.data && e.data.fallback_suggestions);
            } finally {
                waiting = false;
                sendBtn.disabled = !input.value.trim();
                input.focus();
            }
        }

        function autosize() {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 140) + 'px';
            sendBtn.disabled = waiting || !input.value.trim();
        }
        input.addEventListener('input', autosize);
        input.addEventListener('keydown', (e) => {
            // Enter sends, Shift+Enter adds a new line (phones use the send button)
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(hover: hover)').matches) { e.preventDefault(); send(input.value); }
        });
        sendBtn.addEventListener('click', () => send(input.value));
        msgs.addEventListener('click', (e) => {
            const s = e.target.closest('[data-starter]'); if (s) { send(STARTERS[Number(s.dataset.starter)].send); return; }
            // Server suggestion chips may start with an emoji; send the words only
            const c = e.target.closest('[data-chip]'); if (c) send(c.dataset.chip.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '').trim());
        });
        document.getElementById('clearBtn').addEventListener('click', () => {
            App.sheet({
                iconName: 'refresh', tone: 'danger', title: 'Clear this chat?', subtitle: 'Your conversation history will be deleted.',
                actions: [
                    {
                        label: 'Clear chat', cls: 'btn-danger', onClick: async (close) => {
                            close();
                            try {
                                await api('/api/assistant?action=clear', { method: 'POST', body: { studentId: session.id, firstName: session.firstName, grade: session.grade } });
                                welcome(); App.toast('Chat cleared', 'success');
                            } catch (e) { App.toast("Couldn't clear the chat", 'error'); }
                        }
                    },
                    { label: 'Cancel', cls: 'btn-ghost' }
                ]
            });
        });

        welcome();
        App.reveal(root);
        api('/api/assistant?action=history', { method: 'POST', body: { studentId: session.id, firstName: session.firstName, grade: session.grade } })
            .then(d => {
                const h = (d && d.history) || [];
                if (!h.length) return;
                msgs.innerHTML = '';
                h.forEach(m => add(m.role === 'model' ? 'bot' : 'user', m.content));
            })
            .catch(() => { /* not fatal: stay on the welcome screen */ });
    })();
    </script>
</body>
</html>
