<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#F4F7FC">
    <script>try { var t = localStorage.getItem('theme'); if (t === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { }</script>
    <script>/* Catch the browser's install offer as early as possible (before any other script) */window.__deferredInstallPrompt=window.__deferredInstallPrompt||null;window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__deferredInstallPrompt=e;document.documentElement.classList.add('pwa-ready');});window.addEventListener('appinstalled',function(){window.__deferredInstallPrompt=null;});</script>
    <title>AI Assistant · Science Academy</title>
    <link rel="icon" href="/assets/img/logo-96.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/student.css">
</head>
<body>
    <!-- Miss Marwa AI Assistant for students. HIDDEN until it is opened (Cloudflare variable TUTOR_OPEN = 1):
         until then the server answers "coming soon" and the menu item stays "Soon". Staff test it at /admin/tutor-preview.html -->
    <main class="main" id="main"><div id="root"></div></main>

    <script src="/assets/pwa.js"></script>
    <script src="/assets/student.js?v=20261127c"></script>
    <script src="/assets/ai-kit.js?v=20261128c"></script>
    <script src="/assets/ai-robot.js?v=20261127c"></script>
    <script src="/assets/tutor-chat.js?v=20261128c"></script>
    <script>
    (function () {
        if (!window.App) return;
        App.shell({ active: 'assistant', title: 'AI Assistant' });
        TutorChat.mount(document.getElementById('root'), { toast: (m, k) => App.toast(m, k || 'info') });
    })();
    </script>
</body>
</html>
